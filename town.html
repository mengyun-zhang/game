<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我们的小镇">
<meta name="theme-color" content="#7ec8f7">
<title>我们的小镇</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <div id="map"></div>
  <div id="scene"></div>
  <div id="layer"></div>
  <div id="cardHost"></div>
</div>

<!-- 家长闸门：长按 3 秒 -->
<div id="gate"><div class="ring"></div></div>

<!-- 家长面板 -->
<div id="panel">
  <h1>家长面板</h1>
  <div class="psub">长按左上角小点 3 秒可再次打开</div>

  <h3>名字</h3>
  <div class="name-edit">
    <input id="pName" class="name-input small" type="text" maxlength="12"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入名字">
    <button id="pNameSave" class="pbtn small">保存</button>
  </div>

  <h3>今日概览</h3>
  <div class="pcard" id="pStat"></div>

  <h3>音效</h3>
  <div id="pSound"></div>

  <h3>各地点进度</h3>
  <div class="pcard" id="pDetail"></div>

  <div class="pbtns">
    <button class="pbtn" id="pClose">继续玩</button>
    <button class="pbtn" id="pReset">清空进度</button>
  </div>

</div>

<script src="core.js"></script>
<script src="kid.js"></script>
<script src="scenes.js"></script>
<script src="app.js"></script>
</body>
</html>
