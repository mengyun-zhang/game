    }
  }
  function hint(){
    var it=queue[idx]; if(!it) return;
    var kd=kinds.filter(function(x){return x.id===it.id;})[0];
    guide("把它放进"+kd.name+"。");
  }
  render();
  return {hint:hint};
};

/* ---------- 10.6 铺路：把路接通（空间路径引导） ---------- */
MINI.path=function(){
  /* 7x5 网格，左中出发，右上终点；中间有断点，点亮空格铺路 */
  var cols=S.diff==="easy"?5:7, rows=S.diff==="easy"?3:5;
  var start=[Math.floor(rows/2),0], goal=[0,cols-1];
  var grid=[];
  for(var r=0;r<rows;r++){ grid.push([]); for(var c=0;c<cols;c++) grid[r].push("block"); }
  /* 正确的路：先右到底，再上到顶（形成 L 形，容易看懂） */
  var path=[];
  for(var c2=0;c2<cols;c2++) path.push([start[0],c2]);
  for(var r2=start[0]-1;r2>=0;r2--) path.push([r2,cols-1]);
  path.forEach(function(p){ grid[p[0]][p[1]]="path"; });

  /* 随机挖断几个格子，让小朋友补回来 */
  var holes = S.diff==="easy"?2:(S.diff==="mid"?3:4);
  var inner=path.slice(1,path.length-1);
  shuffle(inner).slice(0,holes).forEach(function(p){ grid[p[0]][p[1]]="hole"; });

  var pos={r:start[0],c:start[1]};
  var filled=0, need=inner.filter(function(p){return grid[p[0]][p[1]]==="hole";}).length;

  function reachable(from,to){
    var seen={}, q=[from];
    seen[from.r+","+from.c]=1;
    while(q.length){
      var cur=q.shift();
      if(cur.r===to.r&&cur.c===to.c) return true;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var nr=cur.r+d[0], nc=cur.c+d[1];
        if(nr<0||nc<0||nr>=rows||nc>=cols) return;
        if(grid[nr][nc]==="block") return;
        var key=nr+","+nc;
        if(seen[key]) return;
        seen[key]=1; q.push({r:nr,c:nc});
      });
    }
    return false;
  }

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div class="hintline" id="pHint">点亮空格，把路接到'+(curBuilding&&curBuilding.id==="park"?"大树":"消防站")+'</div>';
    var m=document.createElement("div"); m.className="map-grid";
    m.style.gridTemplateColumns="repeat("+cols+",1fr)";
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var cell=document.createElement("div");
        var st=grid[r][c];
        cell.className="tg"+(st==="block"?" block":(st==="path"?" path":(st==="hole"?" hole":"")));
        if(r===goal[0]&&c===goal[1]){ cell.classList.add("target"); cell.innerHTML=art(curBuilding&&curBuilding.id==="park"?"tree":"truck",30); }
        else if(st==="path") cell.innerHTML='<div style="width:100%;height:100%;border-radius:9px;background:#f6d98a"></div>';
        else if(st==="hole") cell.innerHTML='<div style="width:100%;height:100%;border-radius:9px;background:#fff3d4"></div>';
        if(r===pos.r&&c===pos.c){ cell.classList.add("me"); cell.innerHTML=art("girl",30); }
        (function(r,c,st,cell){
          if(st==="hole") cell.onclick=function(){ fillHole(r,c,cell); };
        })(r,c,st,cell);
        m.appendChild(cell);
      }
    }
    g.appendChild(m);
    paintScore(filled,need);
  }
  function fillHole(r,c,cell){
    grid[r][c]="path"; filled++; Sound.blip("ok");
    /* 铺好后自动往前走一步 */
    if(filled>=need){
      render();
      Sound.blip("good");
      finish("路接通啦，可以走过去喽。");
      /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
    }else{
      render();
      guide("这一段接上了，继续往前。");
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    var cs=g.querySelectorAll(".map-grid .tg");
    for(var i=0;i<cs.length;i++){
      if(cs[i].style.background==="rgb(255, 253, 243)"){
        cs[i].style.boxShadow="0 0 0 4px #f0a832";
        setTimeout(function(){ cs[i].style.boxShadow=""; },1700);
        break;
      }
    }
    guide("点亮空着的那一格，路就接上了。");
  }
  render();
  return {hint:hint};
};

/* ---------- 10.8 记忆翻卡片：翻两张，找出一样的 ---------- */
MINI.memory=function(){
  var kinds=["apple","balloon","star","flower","truck","ball","heart","candy","kite","teddy"];
  var pairs=S.diff==="easy"?3:(S.diff==="mid"?4:5);
  var deck=[], open=[], lock=false, found=0;
  (function(){
    var pick=shuffle(kinds).slice(0,pairs);
    pick.forEach(function(k){ deck.push({k:k,done:false}); deck.push({k:k,done:false}); });
    shuffle(deck);
  })();
  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div class="hintline">翻开两张卡片，找出一样的</div>';
    var grid=document.createElement("div"); grid.className="find memgrid";
    grid.style.gridTemplateColumns="repeat("+Math.min(deck.length/2,4)+",1fr)";
    deck.forEach(function(c,i){
      var d=document.createElement("button");
      d.className="card mem"+(c.done||open.indexOf(i)>=0?" up":"");
      d.innerHTML=c.done||open.indexOf(i)>=0 ? art(c.k,52) : '<span class="q">?</span>';
      if(!c.done && open.indexOf(i)<0 && !lock){
        (function(i){ d.onclick=function(){ flip(i); }; })(i);
      }
      grid.appendChild(d);
    });
    g.appendChild(grid);
    paintScore(found,pairs);
  }
  function flip(i){
    if(lock||gameDone) return;
    if(open.indexOf(i)>=0 || deck[i].done) return;
    open.push(i); Sound.blip("pop"); render();
    if(open.length===2){
      lock=true;
      var a=deck[open[0]], b=deck[open[1]];
      if(a.k===b.k){
        setTimeout(function(){
          a.done=b.done=true; open=[]; lock=false; found++;
          Sound.blip("ok"); render();
          if(found>=pairs){
            Sound.blip("good");
            finish("全都记住啦，记性真好。");
            /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
          }else{
            guide(pickPhrase(["一对好朋友找到啦。","真棒，继续翻。","记住位置，越翻越快。"]));
          }
        },480);
      }else{
        guide("不一样，看一看，记住它们在哪里。");
        setTimeout(function(){ open=[]; lock=false; render(); },850);
      }
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    var cs=g.querySelectorAll(".mem");
    if(cs.length){ cs[0].classList.add("peek"); setTimeout(function(){ cs[0].classList.remove("peek"); },1600); }
    guide("先翻开一张，记住它，再找它的好朋友。");
  }
  render();
  return {hint:hint};
};

/* ---------- 10.9 影子配对：找到正确的影子 ---------- */
MINI.shadow=function(){
  /* 消防站里的东西：帽、车、水桶、水壶、水管卷、对讲机……
     用现成的图形里形状差别明显的，剪影才分得清 */
  var pool=["truck","fire","can","bucket","shovel","pot","book","ball"];
  var round=0, total=S.diff==="easy"?3:(S.diff==="mid"?4:5);
  var target=null, opts=[];
  function next(){
    target=pickPhrase(pool);
    var others=shuffle(pool.filter(function(x){return x!==target;})).slice(0,2);
    opts=shuffle([target].concat(others));
    render();
  }
  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div style="text-align:center;font-size:13px;color:#7c8b80">它的影子是哪一个？</div>'+
      '<div style="display:flex;justify-content:center;margin:4px 0 8px">'+
        '<div style="background:#f4f9f2;border-radius:20px;padding:8px">'+art(target,56)+'</div></div>';
    var grid=document.createElement("div"); grid.className="find";
    grid.style.gridTemplateColumns="repeat(3,1fr)";
    opts.forEach(function(k){
      var d=document.createElement("button"); d.className="card";
      d.innerHTML='<div class="sil">'+art(k,66)+'</div>';
      d.onclick=function(){ choose(k,d); };
      grid.appendChild(d);
    });
    g.appendChild(grid);
    paintScore(round,total);
  }
  var locked=false;
  function choose(k,el){
    if(locked||gameDone) return;
    if(k===target){
      locked=true; el.classList.add("yes"); Sound.blip("ok"); round++;
      if(round>=total){
        paintScore(round,total); Sound.blip("good");
        finish("影子全找对啦，眼睛真尖。");
        /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
        return;
      }
      guide("找对啦，这就是它的影子。");
      setTimeout(function(){ locked=false; next(); },700);
    }else{
      el.classList.add("no"); Sound.blip("soft");
      setTimeout(function(){ el.classList.remove("no"); },340);
      guide("影子不一样，再看看形状。");
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    var cs=g.querySelectorAll(".find .card");
    for(var i=0;i<cs.length;i++){
      if(cs[i].innerHTML.indexOf(art(target,58))>=0){ cs[i].style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ cs[i].style.boxShadow=""; },1700); break; }
    }
    guide("形状一样的影子，就是它。");
  }
  next();
  return {hint:hint};
};

/* ---------- 10.10 院子拼图：把碎片拖到网格里，拼成外公画的院子 ---------- */
MINI.puzzle=function(){
  /* 2x2 的四块：左上太阳、右上云、左下大树、右下小花
     孩子把下面盒子里的小图，拖（或点选再点格）到对应位置 */
  var pieces=[
    { k:"sun",    name:"太阳", slot:0 },
    { k:"cloud",  name:"云朵", slot:1 },
    { k:"tree",   name:"大树", slot:2 },
    { k:"flower", name:"小花", slot:3 }
  ];
  var placed={};         /* slot -> piece key */
  var picked=null;       /* 已选中的碎片下标 */
  var seed=shuffle([0,1,2,3]);   /* 碎片在下方盒子里的排列 */
  var total=pieces.length, done=0, wrong=0;

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div class="hintline">把下面的小图放到上面格子里</div>';
    var wrap=document.createElement("div"); wrap.className="pzwrap";

    /* 上面：2x2 棋盘 */
    var board=document.createElement("div"); board.className="pzboard";
    for(var i=0;i<4;i++){
      var c=document.createElement("button");
      c.className="pzcell"+(placed[i]?" on":"")+(picked!==null?" ready":"");
      c.dataset.slot=i;
      c.innerHTML = placed[i] ? art(placed[i],52) : '<span class="q">?</span>';
      (function(i,c){
        c.onclick=function(){ drop(i); };
      })(i,c);
      board.appendChild(c);
    }
    wrap.appendChild(board);
    g.appendChild(wrap);

    /* 下面：待放的碎片 */
    var tray=document.createElement("div"); tray.className="pztray";
    seed.forEach(function(idx){
      var pc=pieces[idx];
      if(placed[pc.slot]) return;
      var t=document.createElement("button");
      t.className="pzpiece"+(picked===idx?" sel":"");
      t.innerHTML=art(pc.k,44);
      t.onclick=function(){ picked=(picked===idx?null:idx); Sound.blip("tap"); render(); };
      tray.appendChild(t);
    });
    if(tray.children.length){
      var lab=document.createElement("div"); lab.className="pztraytip";
      lab.textContent="先点一张小图，再点上面对应的格子";
      g.appendChild(lab);
      g.appendChild(tray);
    }else{
      g.appendChild(tray);
    }
    paintScore(done,total);
  }

  function drop(slot){
    if(gameDone) return;
    if(placed[slot]){ guide("这里已经拼好啦。"); return; }
    if(picked===null){ guide("先点下面的一张图。"); Sound.blip("soft"); return; }
    var pc=pieces[picked];
    if(pc.slot===slot){
      placed[slot]=pc.k; picked=null; done++;
      Sound.blip("ok"); render();
      if(done>=total){
        Sound.blip("good");
        finish("拼好啦，这就是外公画的院子。");
        /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
      }else{
        guide(pickPhrase(["对，"+pc.name+"就放这儿。","放对了，继续。","好眼力。"]));
      }
    }else{
      wrong++;
      Sound.blip("soft");
      var cell=document.querySelector('.pzcell[data-slot="'+slot+'"]');
      if(cell){ cell.classList.add("no"); setTimeout(function(){ cell.classList.remove("no"); },380); }
      guide("这张不是这里的，看看它旁边该是什么。");
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    /* 先替孩子选好一张，再把对应格子点亮 */
    if(picked===null){
      var left=pieces.filter(function(x){ return !placed[x.slot]; })[0];
      if(left){ picked=pieces.indexOf(left); render(); }
    }
    if(picked!==null){
      var cell=document.querySelector('.pzcell[data-slot="'+pieces[picked].slot+'"]');
      if(cell){ cell.style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ if(cell) cell.style.boxShadow=""; },1800); }
      guide(pieces[picked].name+"放在亮起来的格子里。");
    }
  }
  render();
  return {hint:hint};
};

/* ---------- 10.11 数一数：点一个数一个，再挑出对的数字（1—10） ---------- */
MINI.count=function(){
  /* 三种难度：小班数到 5，中班到 8，大班到 10；一共 4 关 */
  var CAP = S.diff==="easy"?5:(S.diff==="mid"?8:10);
  var LOW = S.diff==="easy"?1:(S.diff==="mid"?2:4);
  var ROUNDS = 4;
  var kinds=["apple","star","flower","candy","carrot","ball","truck","basket","leaf","balloon","bread","berry"];

  var round=0;          /* 已经过几关 */
  var n=0;              /* 这一关有几个东西 */
  var kind="";          /* 这一关是什么东西 */
  var counted=0;        /* 数到第几个 */
  var opts=[];          /* 三个数字选项 */
  var solved=false;     /* 这一关是否答对 */
  var lock=false;

  function newRound(){
    var span = CAP - LOW + 1;
    /* 别连着出同样的数目，孩子会觉得没变化 */
    var t = LOW + Math.floor(Math.random()*span);
    if (t === n && span > 1) t = LOW + ((t - LOW + 1) % span);
    n = t;
    kind = kinds[Math.floor(Math.random()*kinds.length)];
    counted = 0; solved = false; lock = false;
    /* 选项：正确答案 + 两个挨得近的数（1 和 10 的时候别越界） */
    var set = [n];
    var guard = 0;
    while (set.length < 3 && guard++ < 40){
      var d = Math.random() < 0.5 ? -1 : 1;
      var c = n + d * (1 + Math.floor(Math.random()*2));
      if (c >= 1 && c <= 10 && set.indexOf(c) < 0) set.push(c);
    }
    while (set.length < 3){
      var f = 1 + Math.floor(Math.random()*10);
      if (set.indexOf(f) < 0) set.push(f);
    }
    opts = shuffle(set);
  }

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div class="hintline">点一下，帮你一个一个数出来</div>';

    var grid=document.createElement("div"); grid.className="cnt-grid";
    for (var i=0;i<n;i++){
      var d=document.createElement("button");
      d.type="button";
      d.className="cnt-item"+((i<counted)?" on":"");
      d.innerHTML=art(kind,34)+(i<counted ? "<b>"+(i+1)+"</b>" : "");
      (function(i,d){
        d.onclick=function(){
          if (gameDone||solved) return;
          /* 必须按顺序点：手指落到还没数的那个上才算一次 */
          if (i===counted){
            counted++; Sound.blip("pop");
            Voice.say(String(counted), {rate:0.95});
            render();
            if (counted===n) guide("一共 "+n+" 个，是哪个数字呢？");
          } else if (i<counted){
            guide("这个数过啦，找还没数的。");
          } else {
            guide("一个一个来，先点前面那个。");
            d.classList.add("no");
            setTimeout(function(){ d.classList.remove("no"); },300);
          }
        };
      })(i,d);
      grid.appendChild(d);
    }
    g.appendChild(grid);

    var nums=document.createElement("div"); nums.className="cnt-nums";
    opts.forEach(function(v){
      var b=document.createElement("button");
      b.type="button"; b.className="cnt-num"; b.textContent=v;
      b.onclick=function(){ pick(v,b); };
      nums.appendChild(b);
    });
    g.appendChild(nums);
    paintScore(round, ROUNDS);
  }

  function pick(v,el){
    if (gameDone||solved||lock) return;
    if (v===n){
      solved=true; lock=true;
      el.classList.add("yes"); Sound.blip("ok");
      round++;
      paintScore(round, ROUNDS);
      if (round>=ROUNDS){
        Sound.blip("good");
        finish("四个都数对啦，数得又准又稳。");
      } else {
        guide(pickPhrase(["对，就是 "+n+" 个。","数对啦，再来一次。","没错，是 "+n+" 个。"]));
        setTimeout(function(){ newRound(); render(); }, 780);
      }
    } else {
      el.classList.add("no");
      setTimeout(function(){ el.classList.remove("no"); },340);
      Sound.blip("soft");
      if (counted < n){
        guide("先一个一个点着数，数完再选。");
      } else {
        guide("再数一遍试试，一个一个点。");
      }
    }
  }

  /* 「帮帮我」：把这一堆从头点数一遍，边点边报数 */
  function hint(){
    if (!boardEl()) return;
    var items=document.querySelectorAll(".cnt-item");
    if (!items.length) return;
    var k=0;
    (function tick(){
      if (k>=n){
        guide("数完啦，一共 "+n+" 个。");
        return;
      }
      var it=items[k];
      if (it){ it.click(); }
      k++;
      setTimeout(tick, 520);
    })();
  }

  newRound();
  render();
  return {hint:hint};
};

/* ---------- 10.7 种地：挖坑 → 放种子 → 浇水（三步任务） ---------- */
MINI.plant=function(){
  var n = S.diff==="easy"?1:(S.diff==="mid"?2:3);
  var plots=[];   /* 0 空地 1 挖好坑 2 放了种子 3 发芽 */
  for(var i=0;i<n;i++) plots.push(0);
  var active=0;
  var STAGE=["点铲子，先挖个小坑","放进一颗小种子","浇一点水，等它发芽"];
  var TOOLS=["shovel","seed","can"];
  var NAMES=["小铲子","种子","水壶"];

  function soilSvg(stage){
    /* 一块土垄：底色土黄 + 细纹，中间按阶段画坑/种子/苗 */
    /* 先确保图形字典就绪 */
    if(!ART_LIB.seed) art("seed",20);
    if(!ART_LIB.sprout) art("sprout",20);
    var inner="";
    if(stage===0) inner='<ellipse cx="0" cy="2" rx="8" ry="3.6" fill="#b08a5e" opacity=".38"/>';
    if(stage===1) inner='<ellipse cx="0" cy="2" rx="11" ry="5.6" fill="#8f7048"/>'+
                        '<ellipse cx="0" cy="0.6" rx="8" ry="3.8" fill="#6f5638"/>';
    if(stage===2) inner='<ellipse cx="0" cy="2" rx="11" ry="5.6" fill="#8f7048"/>'+
                        '<g transform="translate(0,-5) scale(.62)">'+ART_LIB.seed+'</g>';
    if(stage===3) inner='<g transform="translate(0,-4) scale(.9)">'+ART_LIB.sprout+'</g>';
    return '<svg viewBox="-26 -16 52 34" width="100%" height="70" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible;max-width:100%;height:auto">'+
             /* 土垄：一块略立体的褐色土台 */
             '<path d="M-23,8 C-23,1 23,1 23,8 L23,12 C23,19 -23,19 -23,12 Z" fill="#b18f63"/>'+
             '<ellipse cx="0" cy="8" rx="23" ry="7.2" fill="#cBa87b"/>'+
             '<ellipse cx="0" cy="7" rx="19.5" ry="5.6" fill="#d6b98d"/>'+
             /* 小土粒 */
             '<circle cx="-13" cy="6" r="1.3" fill="#c0a071" opacity=".8"/>'+
             '<circle cx="11" cy="8.4" r="1.1" fill="#c0a071" opacity=".8"/>'+
             '<circle cx="7" cy="4.6" r="1" fill="#c0a071" opacity=".7"/>'+
             '<circle cx="-8" cy="9.2" r="1" fill="#c0a071" opacity=".7"/>'+
             inner+
           '</svg>';
  }

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    var st=(active<n)?(plots[active]||0):3;
    var line=(active<n)?(STAGE[st]||STAGE[0]):"全都发芽啦，真棒";
    g.innerHTML='<div class="hintline" style="font-size:14px;color:#5d7a66;font-weight:600">'+line+'</div>';
    var row=document.createElement("div"); row.className="plots";
    row.style.gridTemplateColumns="repeat("+n+",1fr)";
    plots.forEach(function(stage,i){
      var d=document.createElement("button");
      d.className="plot"+(stage===3?" grown":"");
      d.style.padding="4px";
      d.style.minHeight="80px";
      d.innerHTML=soilSvg(stage);
      if(i===active && !ended){
        d.style.borderColor="#f0c25a"; d.style.background="#fffdf3";
        d.onclick=function(){ advance(); };
      }
      row.appendChild(d);
    });
    g.appendChild(row);

    /* 三个工具：该用的那个亮起来，并带一句名字 */
    var tools=document.createElement("div");
    tools.style.cssText="display:flex;justify-content:center;gap:12px;margin-top:10px";
    TOOLS.forEach(function(k,i){
      var wrap=document.createElement("div");
      wrap.style.cssText="text-align:center";
      var b=document.createElement("div");
      var on=(i===Math.min(st,2));
      b.style.cssText="width:60px;height:60px;border-radius:16px;display:grid;place-items:center;border:2px solid "+
        (on?"#f0c25a":"#ece3d2")+";background:"+(on?"#fff6e4":"#fff")+";"+
        (on?"box-shadow:0 4px 10px rgba(240,194,90,.35);":"opacity:.4;");
      b.innerHTML=art(k,34);
      var lb=document.createElement("div");
      lb.style.cssText="font-size:11px;color:"+(on?"#a3792a":"#a9a49a")+";margin-top:3px";
      lb.textContent=NAMES[i];
      wrap.appendChild(b); wrap.appendChild(lb);
      tools.appendChild(wrap);
    });
    g.appendChild(tools);
    paintScore(plots.filter(function(x){return x===3;}).length,n);
  }

  var ended=false;
  function advance(){
    if(ended) return;
    plots[active]++;
    Sound.blip("ok");
    if(plots[active]<3){
      render();
      guide(pickPhrase(["对，就这样。","下一步啦。","很好。"]),{rate:0.95});
      return;
    }
    if(active>=n-1){
      active=n;                   /* 全部完成：让 render 走「全部发芽」分支 */
      ended=true;                 /* 并锁住，避免重复触发 */
      render();
      Sound.blip("good");
      finish("种子发芽啦，过几天就会长大。");
      /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
    }else{
      active++;
      render();
      guide("这块长出来了，去种下一块。",{rate:0.95});
    }
  }

  function hint(){
    if(active>=n) return;
    var st=plots[active]||0;
    guide("现在要用"+NAMES[st]+"。");
    var g=boardEl(); if(!g) return;
    var the=null;
    [].forEach.call(g.querySelectorAll("button.plot"),function(p,i){ if(i===active) the=p; });
    if(the){ the.style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ if(the) the.style.boxShadow=""; },1800); }
  }
  render();
  return {hint:hint};
};

/* =====================================================================
   11. 面板
   ===================================================================== */
/* 地点的显示名：只有「家」跟着小朋友改名字，其他地点不变 */
function bLabel(b){
  if(b.id === "home") return homeName();
  return b.name;
}

/* 整站的名字都跟着小朋友改：标题、小镇名、家的名字 */
function applyNames(){
  var t = townTitle();
  document.title = t;
  var bn = document.getElementById("brandName");
  if(bn) bn.textContent = t;

/* ---------------- 进度备份：导出 / 导入 / 重置 ---------------- */
function exportSave(){
  try{
    var payload = { _app:"chengcheng-town", _v:2, _at:new Date().toISOString(), save:S };
    var blob = new Blob([JSON.stringify(payload)], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "chengcheng-" + (kidName() || "小镇") + "-" +
      new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1600);
    toast("进度存好啦，去「下载」里找这个文件");
    Voice.say("进度存好了。");
  } catch(e){
    toast("这台设备不支持存文件，换成电脑试试");
  }
}
function pickImport(){
  var inp = document.getElementById("importFile");
  if (inp) inp.click();
}
function doImport(file){
  var r = new FileReader();
  r.onload = function(){
    var v = null;
    try{
      var obj = JSON.parse(String(r.result));
      /* 兼容两种：包了一层信封的，和直接是存档的 */
      v = (obj && obj.save) ? obj.save : obj;
    } catch(e){ v = null; }
    if (!v || typeof v !== "object" || typeof v.stars !== "number"){
      toast("这个文件读不了，确认是小镇的进度文件");
      return;
    }
    try{
      localStorage.setItem(KEY, JSON.stringify(v));
      toast("读好了，马上回到你的小镇");
      setTimeout(function(){ location.reload(); }, 700);
    } catch(e){
      toast("存不进去，可能是浏览器满了");
    }
  };
  r.onerror = function(){ toast("文件读不出来，再试一次"); };
  r.readAsText(file);
}

/* =====================================================================
   10.8 角色的动作道具（放在图标之前，用 ico/art 都没问题）

var carryEls = [];

/* 手里站着的东西：背包里有气球就挂一只，点一下就能放飞 */
function paintCarry(){
  carryEls.forEach(function(e){ if (e.parentNode) e.parentNode.removeChild(e); });

  [["balloon","点一下，气球就飞起来"],["bubble","点一下，吹出满屏泡泡"],["firework","点一下，放一支烟花"]].forEach(function(it){
    if (!(S.bag[it[0]] > 0)) return;

    b.className = "carry playable " + it[0];

    });

    carryEls.push(b);
  });
}
/* 跟着主角一起动的东西（气球 / 风筝 / 小旗子）每帧更新，不用定时器 */
function stepCarry(){
  /* 身上可能同时有气球、泡泡和烟花：
     气球举高在身后，泡泡拿在手边，烟花抱在另一侧——都让开脸，别挡着孩子 */
  var offs = [26, -34, 46];

/* =====================================================================
   10.85 放飞气球 / 吹泡泡
   ---------------------------------------------------------------------
   · 气球：点一下，满屏慢慢飘起一片气球，不扎堆、会自己飘走
   · 泡泡：点一下，一群泡泡从脚下升起来，点泡泡会啵地破掉
   · 都从背包里扣 1 个，扣完手里就没啦
   ===================================================================== */
var FLY = [];              /* 正在飘的东西，每帧推一次 */
var flyLayer = null;

function flyRoot(){
  if (!flyLayer || !flyLayer.parentNode){
    flyLayer = document.createElement("div");
    flyLayer.className = "fly-layer";
    document.body.appendChild(flyLayer);
  }
  return flyLayer;
}

/* 在屏幕上随机撒点，尽量不重叠（格子随机取，天然均匀） */
function scatterSpots(n, cols, rows, padX, padTop, padBottom){
  var spots = [];
  for (var i = 0; i < cols * rows; i++) spots.push(i);
  shuffle(spots);
  var out = [];
  for (var k = 0; k < n && k < spots.length; k++){
    var idx = spots[k];
    var c = idx % cols, r = Math.floor(idx / cols);
    out.push({
      x: padX + (c + 0.18 + Math.random() * 0.64) * (1 - padX * 2) / cols,
      y: padTop + (r + 0.15 + Math.random() * 0.7) * (1 - padTop - padBottom) / rows
    });
  }
  return out;
}

var FLY_COLORS = ["#f78fb3", "#8fd0e8", "#f6d365", "#b9a5f7", "#a9e0b0", "#f7a678", "#f2a3c8"];

var _lastPlay=0;
function playCarry(id){
  var now=Date.now();
  if(now-_lastPlay<700) return;          /* 碰到连点，别一口气全放光 */
  _lastPlay=now;
  if (!(S.bag[id] > 0)){
    toast(id === "balloon" ? "气球用完了，去商店再换一些"
        : id === "bubble" ? "泡泡用完了，去商店再换一些"
        : "烟花用完了，去商店再换一支吧");
    Voice.say("用完了，去商店换一些吧。");
    return;
  }
  S.bag[id] = (S.bag[id] || 0) - 1;
  if (S.bag[id] <= 0) delete S.bag[id];
  save(); paintHud(); paintCarry();
  if (id === "balloon") releaseBalloons();
  else if (id === "firework") launchFireworks();
  else blowBubbles();
}

/* 气球：一次放一大片，铺满整屏，飘飘悠悠往上走 */
function releaseBalloons(){
  var root = flyRoot();
  var n = 14 + Math.floor(Math.random() * 5);     /* 14-18 只，铺满屏 */
  var spots = scatterSpots(n, 5, 4, 0.06, 0.10, 0.12);
  var vw = window.innerWidth, vh = window.innerHeight;
  Sound.blip("pop");
  spots.forEach(function(p, i){
    setTimeout(function(){
      var el = document.createElement("div");
      el.className = "flyer balloon";
      var col = FLY_COLORS[Math.floor(Math.random() * FLY_COLORS.length)];
      var size = 26 + Math.random() * 26;
      el.style.left = (p.x * vw) + "px";
      el.style.top = (p.y * vh) + "px";
      el.style.setProperty("--c", col);
      el.innerHTML = '<svg viewBox="-12 -12 24 24" width="' + size + '" height="' + size + '" aria-hidden="true">' +
        '<path d="M0,4 C-6,-1 -6,-9 0,-9 C6,-9 6,-1 0,4 Z" fill="' + col + '"/>' +
        '<path d="M0,4 L0,6" stroke="#c98aa0" stroke-width="1.2"/>' +
        '<path d="M0,6 C-2.2,8 2.2,9.2 0,11" stroke="#c98aa0" stroke-width="1.1" fill="none"/>' +
        '<ellipse cx="-2" cy="-5" rx="1.6" ry="2.2" fill="#fff" opacity=".55"/></svg>';
      root.appendChild(el);
      FLY.push({
        el: el, kind: "balloon",
        x: p.x * vw, y: p.y * vh,
        vx: (Math.random() - 0.5) * 12, vy: -(13 + Math.random() * 14),
        sway: Math.random() * 6.28, swayAmp: 8 + Math.random() * 12,
        life: 8.5, age: 0
      });
      Sound.blip("ok");
    }, i * 70);
  });
  toast("气球飞起来啦");
  Voice.say("气球飞起来喽。");
}

/* 泡泡：一大群泡泡从脚下升起来，铺满屏，点一下会破 */
function blowBubbles(){
  var root = flyRoot();
  var vw = window.innerWidth, vh = window.innerHeight;
  Sound.blip("soft");
  var n = 22 + Math.floor(Math.random() * 8);      /* 22-29 个 */
  var spots = scatterSpots(n, 6, 5, 0.05, 0.30, 0.06);
  spots.forEach(function(p, i){
    setTimeout(function(){
      var el = document.createElement("div");
      el.className = "flyer bubble";
      var size = 16 + Math.random() * 30;
      el.style.width = size + "px";
      el.style.height = size + "px";
      el.innerHTML = art("bubble", size);
      el.style.left = (p.x * vw) + "px";
      el.style.top = (p.y * vh) + "px";
      root.appendChild(el);
      var f = {
        el: el, kind: "bubble",
        x: p.x * vw, y: p.y * vh,
        vx: (Math.random() - 0.5) * 18, vy: -(20 + Math.random() * 20),
        sway: Math.random() * 6.28, swayAmp: 8 + Math.random() * 14,
        life: 6.2, age: 0
      };
      el.addEventListener("click", function(e){ e.stopPropagation(); popBubble(f); });
      FLY.push(f);
      Sound.blip("ok");
    }, i * 55);
  });
  Voice.say("泡泡，圆圆的泡泡。");
}

/* =====================================================================
   烟花：点一下背包里的烟花，天上接连炸开几朵大花
   ---------------------------------------------------------------------
   · 用一张临时 canvas 画粒子，放完自己删掉，不常驻内存
   · 先升空再炸开，粒子带重力、会拖着光往下落
   ===================================================================== */
function launchFireworks(){
  var W = window.innerWidth, H = window.innerHeight;
  var cv = document.createElement("canvas");
  cv.className = "fw-canvas";
  var dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr);
  cv.style.width = W + "px"; cv.style.height = H + "px";
  document.body.appendChild(cv);
  var g = cv.getContext("2d");
  if (!g){ if (cv.parentNode) cv.parentNode.removeChild(cv); return; }
  g.scale(dpr, dpr);

  var COLS = [["#ffd166","#fff0b8"],["#ff7b9c","#ffd0dc"],["#7fd8ff","#dff4ff"],
              ["#b6a6ff","#e6e0ff"],["#8ef0a8","#dbffe6"],["#ff9f6e","#ffe4d0"]];
  var rockets = [], parts = [], flashes = [];
  var start = performance.now(), last = start, t = 0, closing = false;

  function addRocket(delay){
    rockets.push({
      x: W * (0.16 + Math.random() * 0.68),
      y: H + 8,
      ty: H * (0.14 + Math.random() * 0.28),
      v: H * 0.011 + Math.random() * 3.5,
      c: COLS[Math.floor(Math.random() * COLS.length)],
      wait: delay, tail: []
    });
  }
  addRocket(0); addRocket(230); addRocket(430); addRocket(680);

  function explode(r){
    var n = 62 + Math.floor(Math.random() * 28);
    var sp = 1.15 + Math.random() * 1.5;
    for (var i = 0; i < n; i++){
      var a = Math.PI * 2 * i / n + Math.random() * 0.12;
      var v = sp * (0.55 + Math.random() * 0.9);
      parts.push({
        x: r.x, y: r.y,
        vx: Math.cos(a) * v * 2.1, vy: Math.sin(a) * v * 2.1,
        life: 1, dec: 0.008 + Math.random() * 0.006,
        col: Math.random() < 0.55 ? r.c[0] : r.c[1],
        r: 1.3 + Math.random() * 1.5
      });
    }
    flashes.push({ x: r.x, y: r.y, life: 1 });
    Sound.boom();
  }

  function frame(now){
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now; t += dt;
    var fs = Math.max(0.4, Math.min(2.2, dt * 60));

    /* 黄昏色轻轻压一层，烟花才亮得起来 */
    var dusk = closing ? Math.max(0, 0.2 * (1 - (t - 3.4) / 1.4)) : Math.min(0.2, t * 0.9);
    g.clearRect(0, 0, W, H);
    if (dusk > 0.002){ g.fillStyle = "rgba(26,30,56," + dusk.toFixed(3) + ")"; g.fillRect(0, 0, W, H); }

    g.globalCompositeOperation = "lighter";

    /* 升空的礼花 */
    for (var i = rockets.length - 1; i >= 0; i--){
      var r = rockets[i];
      if (r.wait > 0){ r.wait -= dt * 1000; continue; }
      r.tail.push({ x: r.x, y: r.y });
      if (r.tail.length > 7) r.tail.shift();
      r.y -= r.v * fs;
      g.strokeStyle = "rgba(255,240,200,.85)";
      g.lineWidth = 2.2;
      g.beginPath();
      for (var k = 0; k < r.tail.length; k++){
        if (k === 0) g.moveTo(r.tail[k].x, r.tail[k].y);
        else g.lineTo(r.tail[k].x, r.tail[k].y);
      }
      g.stroke();
      g.fillStyle = "#fff6d8";
      g.beginPath(); g.arc(r.x, r.y, 2.6, 0, 6.2832); g.fill();
      if (r.y <= r.ty){ explode(r); rockets.splice(i, 1); }
    }

    /* 炸开的粒子 */
    for (var j = parts.length - 1; j >= 0; j--){
      var p = parts[j];
      p.vy += 0.052 * fs;
      p.vx *= Math.pow(0.987, fs);
      p.vy *= Math.pow(0.987, fs);
      p.x += p.vx * fs; p.y += p.vy * fs;
      p.life -= p.dec * fs;
      if (p.life <= 0 || p.y > H + 40){ parts.splice(j, 1); continue; }
      var tw = 0.72 + 0.28 * Math.sin(now / 70 + j);
      g.globalAlpha = Math.max(0, Math.min(1, p.life * tw));
      g.fillStyle = p.col;
      g.beginPath(); g.arc(p.x, p.y, p.r * (0.5 + p.life * 0.7), 0, 6.2832); g.fill();
    }
    g.globalAlpha = 1;

    /* 炸开瞬间的白光 */
    for (var m = flashes.length - 1; m >= 0; m--){
      var f = flashes[m];
      f.life -= 0.055 * fs;
      if (f.life <= 0){ flashes.splice(m, 1); continue; }
      var rad = 96 * (1.15 - f.life);
      var rg = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, Math.max(1, rad));
      rg.addColorStop(0, "rgba(255,252,235," + (0.55 * f.life).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(255,240,200,0)");
      g.fillStyle = rg;
      g.beginPath(); g.arc(f.x, f.y, Math.max(1, rad), 0, 6.2832); g.fill();
    }

    g.globalCompositeOperation = "source-over";

    if (!closing && t > 3.4 && !rockets.length){ closing = true; cv.classList.add("out"); }
    if (closing && t > 4.0){
      if (cv.parentNode) cv.parentNode.removeChild(cv);
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  Voice.say("烟花！看天上。");
}


function popBubble(f){
  if (f.dead) return;
  f.dead = true;
  Sound.blip("pop");
  f.el.classList.add("popping");
  setTimeout(function(){ if (f.el.parentNode) f.el.parentNode.removeChild(f.el); }, 300);
}

/* 每帧推一次：往上飘 + 左右晃 + 飘出屏幕或到时间就收掉 */
function stepFly(dt){
  for (var i = FLY.length - 1; i >= 0; i--){
    var f = FLY[i];
    if (f.dead){ FLY.splice(i, 1); continue; }
    f.age += dt;
    f.sway += dt * 1.6;
    f.y += f.vy * dt;
    f.x += f.vx * dt;
    var sway = Math.sin(f.sway) * f.swayAmp;
    f.el.style.transform = "translate(" + sway.toFixed(1) + "px," + 0 + "px)";
    f.el.style.left = f.x.toFixed(1) + "px";
    f.el.style.top = f.y.toFixed(1) + "px";
    var fadeStart = f.life - 1.2;
    if (f.age > fadeStart) f.el.style.opacity = Math.max(0, (f.life - f.age) / 1.2);
    if (f.age > f.life || f.y < -80){
      if (f.el.parentNode) f.el.parentNode.removeChild(f.el);
      FLY.splice(i, 1);
    }
  }
}

/* 某个居民手里牵着的东西（气球 / 风筝） */
function attachCarry(n){
  if (n.carryEl && n.carryEl.parentNode) n.carryEl.parentNode.removeChild(n.carryEl);
  n.carryEl = null;
  if (!n.carry) return;
  var d = document.createElement("div");
  d.className = "carry " + n.carry;
  d.innerHTML = art(n.carry, n.carry === "kite" ? 30 : 26);
  world.appendChild(d);
  n.carryEl = d;
}

/* 存档在文件开头已经读好了（CC.load），这里不再重复读一遍 */
/* 从农场点「去商店」过来：带 ?shop= 直接进商店，不再问名字 */
var ASK_SHOP = null;
try{
  var _sm = /[?&]shop=([a-z]+)/.exec(location.search);
  if(_sm) ASK_SHOP = ["food","toy","seed","pet"].indexOf(_sm[1]) >= 0 ? _sm[1] : "toy";
}catch(e){}

/* 已经进过小镇了：从房间里回来时不再重新问一次「开始」 */
if(S.entered || ASK_SHOP){
  var _cv=document.getElementById("cover");
  if(_cv && _cv.parentNode) _cv.parentNode.removeChild(_cv);
  S.sound=S.sound!==false;
  if(S.music===undefined) S.music=S.sound;      /* 老存档：从总开关继承 */
  if(S.sfx===undefined) S.sfx=true;
  setTimeout(function(){ if(audioOn("music")) Sound.start(); }, 400);
} else {
  /* 老存档里有名字就不再问，直接开始 */

    if(_row) _row.style.display="none";
    if(_ask) _ask.innerHTML="欢迎回来，" + kidName() + "！<br>今天想去哪里玩？";
  }
  var _inp=document.getElementById("heroName");
  if(_inp){
    if(kidName()) _inp.value=kidName();
    _inp.addEventListener("input", function(){
      var v=_inp.value.replace(/\s/g,"").slice(0,4);
      if(v!==_inp.value) _inp.value=v;
      var _t=document.getElementById("coverTitle");
      if(_t) _t.textContent = v ? v+"的小镇" : "我的小镇";

/* 兜底：老版本 iPad Safari 万一没认出场地的尺寸（页面一片空白），
   这里自己补上固定定位 + 100vw/100vh，再重新量一次，别让孩子对着空屏 */
setTimeout(function(){
  try{
    var r=stage.getBoundingClientRect();
    if(r.width<10||r.height<10){
      stage.style.position="fixed";
      stage.style.top="0"; stage.style.left="0";
      stage.style.width="100vw"; stage.style.height="100vh";
      resize();
    }
  }catch(e){}
},1200);

/* 点「开始」：解锁音频 → 淡入音乐 → 语音欢迎（注意：不能叫 startGame，
   那是小游戏的开局函数，重名会把这里覆盖掉） */
function beginTown(){
  var cover=document.getElementById("cover");
  if(!cover) return;

  /* 第一次进来：把输入的名字记住（允许先不填，之后在「大人看这里」里补） */
  var inp = document.getElementById("heroName");
  var nm = inp ? inp.value.replace(/\s/g,"").slice(0,4) : "";
  if(nm && nm !== S.kidName){
    S.kidName = nm;
    var oldTown = townTitle();
    save();
    applyNames();
    refreshHomeSign();
    toast("这里是" + oldTown);
  }

  cover.classList.add("hide");
  cover.style.pointerEvents="none";
  cover.setAttribute("aria-hidden","true");
  setTimeout(function(){
    cover.style.display="none";
    if(cover.parentNode) cover.parentNode.removeChild(cover);
  },520);
  S.entered=true; save();
  S.sound=S.sound!==false;
  if(S.music===undefined) S.music=S.sound;
  if(S.sfx===undefined) S.sfx=true;
  if(audioOn("music")) Sound.start();
  Sound.blip("ok");
  setTimeout(function(){
    var tip="欢迎来到" + townTitle() + "。用方向键或者摇杆，我们去找" + childCall() + "的家人吧。";
    if(S.bag.balloon>0 || S.bag.bubble>0){
      tip += " 身边的小气球点一下就飞起来，泡泡点一下就吹出来。";
    }
    guide(tip);
  },300);
  showTip("用方向键或左下摇杆走一走，走到房子门口点一下就能进屋");

  /* 从农场点「去商店」过来的：进门直接把商店开到对应分类 */
  if(ASK_SHOP){
    setTimeout(function(){ paintShopSheet(ASK_SHOP); }, 700);
  }
}
