<!DOCTYPE html>
<!--
  澄澄的小镇 · 3 岁向探索式益智游戏（v0.2）
  ---------------------------------------------------------------
  单文件、零依赖（无 CDN / 无框架 / 无外链图片 / 无外链音频）、原生 JS+CSS、localStorage 存进度、PC+移动自适应。
  音乐与语音说明：
    · 背景音乐由 Web Audio 实时合成（五声音阶柔和琶音），不加载任何音频文件，因此断网也能响。
    · 引导语用浏览器内置的 speechSynthesis 中文语音朗读，无需联网下载语音包（是否可用取决于系统语音）。
  扩展示例：往 BUILDINGS 里加一条建筑数据 → 在 BUILDING_ART 里加一个造型 → 在 MINI 里加一个玩法函数。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dff0e4">
<title>澄澄的小镇</title>
<style>
  :root{
    --bg:#dff0e4; --card:#fffdf8; --ink:#3f3a32; --muted:#7c8b80;
    --line:#e7e0d2; --accent:#4f9e6b; --accent-soft:#e6f4e8; --gold:#f0a832; --err:#d4705f;
    --shadow:0 6px 18px rgba(63,58,50,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer}

  /* ================= 地图舞台 ================= */
  .stage{
    position:fixed;inset:0;overflow:hidden;touch-action:none;
    background:linear-gradient(180deg,#cfeacb,#bfe2b7);
  }
  .world{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;will-change:transform}
  .world svg.map{display:block;position:absolute;inset:0;width:100%;height:100%}

  /* 建筑 */
  .b{
    position:absolute;z-index:6;border:none;background:transparent;padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    transition:transform .18s ease;
  }
  .b svg{position:static;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 7px rgba(70,90,60,.15))}
  .b[data-active="1"]{transform:translateY(-5px) scale(1.04)}
  .b[data-active="1"] svg{filter:drop-shadow(0 0 9px rgba(255,214,120,.95)) drop-shadow(0 8px 9px rgba(70,90,60,.2))}
  .b .tag{
    position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
    background:#fffdf8;border:2px solid #ece3d2;border-radius:999px;
    font-size:15px;line-height:1;padding:8px 13px;white-space:nowrap;color:#4a4438;
    box-shadow:0 3px 8px rgba(63,58,50,.12);letter-spacing:.5px;font-weight:600;
    z-index:3;
  }
  .b .badge{
    position:absolute;top:-14px;right:-8px;width:26px;height:26px;border-radius:13px;
    background:var(--gold);color:#fff;font-size:14px;line-height:22px;text-align:center;
    border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);display:grid;place-items:center;
  }

  #hero{position:absolute;z-index:9;pointer-events:none;width:64px;height:110px}
  #hero svg{width:100%;height:100%;overflow:visible}
  #hero .shadow{position:absolute;left:50%;bottom:1px;transform:translateX(-50%)}

  /* ================= 小镇居民 ================= */
  .folk{
    position:absolute;z-index:9;pointer-events:auto;cursor:pointer;
    width:48px;height:84px;padding:0;border:none;background:transparent;
    transition:transform .12s ease;
  }
  .folk svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 6px rgba(60,80,55,.16))}
  .folk:active{filter:brightness(1.06)}
  /* 尺寸按性别微调：小狗矮一点，小孩高一点 */
  .folk.gen2{width:52px;height:84px}
  .folk.gen3{width:54px;height:92px}
  .folk.pop{animation:folkPop .5s cubic-bezier(.2,1.4,.5,1)}
  @keyframes folkPop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
  /* 手里牵着的气球 / 风筝 */
  .carry{position:absolute;pointer-events:none;z-index:11;width:30px;
    animation:carrySway 2.6s ease-in-out infinite}
  .carry svg{width:100%;height:auto;display:block;overflow:visible}
  .carry:after{
    content:"";position:absolute;left:50%;top:88%;width:1.4px;height:26px;
    background:linear-gradient(#c9bda4,#e0d6c0);transform:translateX(-50%);
  }
  @keyframes carrySway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  .carry.balloon{border:none;background:transparent;padding:0;cursor:pointer;
    filter:drop-shadow(0 3px 5px rgba(60,80,55,.2))}
  .carry.balloon:active{transform:scale(1.12)}

  /* 放飞的气球 / 泡泡 */
  .fly-layer{position:fixed;inset:0;z-index:48;pointer-events:none}
  .flyer{position:absolute;pointer-events:auto;transition:opacity .4s;will-change:transform}
  .flyer svg{display:block;overflow:visible}
  .flyer.bubble{cursor:pointer;border-radius:50%}
  .flyer.bubble.popping{animation:bubblePop .3s ease-out forwards}
  @keyframes bubblePop{
    0%{transform:scale(1);opacity:.9}
    100%{transform:scale(1.6);opacity:0}
  }
  .folk .fbubble{
    position:absolute;left:50%;top:-26px;transform:translateX(-50%);
    background:#fffdf8;border:1.6px solid #ece3d2;border-radius:12px;
    padding:4px 9px;font-size:11.5px;line-height:1.35;color:#4a4438;white-space:nowrap;
    box-shadow:0 4px 12px rgba(60,80,55,.14);z-index:3;
  }
  .folk .fbubble:after{
    content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);
    width:8px;height:8px;background:#fffdf8;border-right:1.6px solid #ece3d2;border-bottom:1.6px solid #ece3d2;
  }
  .folk .fmood{
    position:absolute;left:50%;top:-14px;transform:translateX(-50%);
    font-size:12px;line-height:1;padding:2px 4px;border-radius:8px;
    background:#fffdf8;box-shadow:0 2px 6px rgba(60,80,55,.14);
    animation:bob 1.5s ease-in-out infinite;
  }
  .folk .fmood.sleepy{animation:none;opacity:.8}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
  .fheart{position:absolute;z-index:14;pointer-events:none;animation:floatUp 1.2s ease-out forwards}
  .fheart svg{width:22px;height:22px;display:block}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(0) scale(.6)}
    25%{opacity:1}
    100%{opacity:0;transform:translateY(-46px) scale(1.1)}
  }

  /* 送礼小窗 */
  .gift-box{
    position:fixed;inset:0;z-index:65;display:grid;place-items:center;
    background:rgba(45,52,45,.3);opacity:0;pointer-events:none;transition:.24s;
  }
  .gift-box.show{opacity:1;pointer-events:auto}
  .gb-in{
    background:#fffdf8;border-radius:22px;padding:20px 24px 14px;text-align:center;
    width:min(280px,84vw);box-shadow:0 18px 40px rgba(30,40,32,.24);
  }
  .gb-ico{display:flex;justify-content:center;margin-bottom:6px}
  .gb-in p{margin:0 0 14px;font-size:14px;color:#6b6152}
  .gb-yes{
    display:block;width:100%;border:none;border-radius:999px;padding:12px 0;
    background:#4f9e6b;color:#fff;font-size:15px;font-weight:700;letter-spacing:2px;
    cursor:pointer;font-family:inherit;
  }
  .gb-no{
    display:block;width:100%;margin-top:6px;border:none;background:transparent;
    color:#9aa89d;font-size:12.5px;padding:7px 0;cursor:pointer;font-family:inherit;
  }

  /* 商店 / 背包 */
  .shop-wallet{
    display:flex;align-items:center;gap:6px;justify-content:center;
    background:#fff8e6;border:1px solid #f0e2c8;border-radius:14px;padding:9px 12px;
    font-size:13px;color:#8a7a5c;margin-bottom:12px;
  }
  .shop-wallet b{font-size:17px;color:#e09a24}
  .shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .shop-cell{
    background:#fffdf8;border:1.5px solid #efe6d4;border-radius:16px;
    padding:9px 6px 8px;text-align:center;transition:.18s;
  }
  .shop-cell.poor{opacity:.5}
  .sc-ico{display:flex;justify-content:center;height:60px;align-items:center}
  .shop-cell b{display:block;font-size:12.5px;margin-top:2px}
  .sc-cost{display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#a89170;margin:2px 0 6px}
  .sc-buy{
    width:100%;border:none;border-radius:999px;padding:6px 0;font-size:13px;font-weight:700;
    background:#4f9e6b;color:#fff;cursor:pointer;font-family:inherit;letter-spacing:1px;
  }
  .sc-buy:disabled{background:#ddd5c6;cursor:default}
  /* ================= 做新朋友 ================= */
  .maker{display:flex;gap:14px;align-items:flex-start}
  .mk-left{flex:0 0 116px;display:flex;flex-direction:column;gap:6px}
  .mk-preview{
    width:100%;height:140px;border-radius:20px;border:2px dashed #e2d8c2;background:#fbf7ee;
    display:grid;place-items:end center;padding-bottom:8px;overflow:hidden;position:relative;
  }
  .mk-preview svg{width:92px;height:auto;display:block;overflow:visible}
  .mk-preview .tag{
    position:absolute;left:0;right:0;top:7px;text-align:center;font-size:11px;color:#a89a80;letter-spacing:1px;
  }
  .mk-dice{
    border:1.6px solid #e6dcc8;background:#fff;border-radius:13px;padding:8px 6px;font-size:13px;
    font-family:inherit;color:#6f7d74;white-space:nowrap;
  }
  .mk-dice:active{transform:scale(.97)}
  .mk-form{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:9px}
  #mkChoices{display:flex;flex-direction:column;gap:7px}
  .mk-lab{font-size:12px;color:#8a958c;letter-spacing:.5px;margin:2px 0 -3px}
  .mk-name{
    width:100%;box-sizing:border-box;border:1.6px solid #e6dcc8;border-radius:14px;background:#fff;
    padding:11px 13px;font-size:16px;font-family:inherit;color:var(--ink);letter-spacing:1px;
  }
  .mk-name:focus{outline:none;border-color:#9ed3a8;box-shadow:0 0 0 3px rgba(158,211,168,.22)}
  .mk-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .mk-dot{width:27px;height:27px;border-radius:50%;border:2px solid transparent;padding:0;
    box-shadow:0 2px 6px rgba(80,70,50,.14)}
  .mk-dot.on{border-color:#4f9e6b;transform:scale(1.1)}
  .mk-pick{border:1.6px solid #e6dcc8;background:#fff;border-radius:12px;padding:6px 9px;
    font-size:12.5px;font-family:inherit;color:var(--ink);display:inline-flex;align-items:center;gap:4px;
    white-space:nowrap}
  .mk-pick.on{background:#eaf6e6;border-color:#8ecb9a;color:#3f6b4c;font-weight:600}
  .mk-tip{font-size:12px;color:#a09580;line-height:1.6;margin-top:2px}

  .bag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .bag-cell{
    background:#fffdf8;border:1.5px solid #efe6d4;border-radius:16px;
    padding:10px 6px;text-align:center;
  }
  .bg-ico{display:flex;justify-content:center;height:58px;align-items:center}
  .bag-cell b{display:block;font-size:12.5px;margin-top:2px}
  .bag-cell span{font-size:11.5px;color:#a89170}
  .bg-play{
    margin-top:6px;width:100%;border:none;border-radius:10px;padding:6px 0;
    background:#eaf6e6;color:#3f6b4c;font-size:12px;font-weight:600;font-family:inherit;
  }
  .bg-play:active{transform:scale(.96)}

  /* ================= HUD ================= */
  .hud{position:fixed;left:0;right:0;top:0;z-index:20;pointer-events:none;padding:14px 16px;
    display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .hud > *{pointer-events:auto}
  .brand{background:rgba(255,253,248,.94);border:1px solid #ece3d2;border-radius:16px;
    padding:8px 14px;box-shadow:var(--shadow);flex:0 0 auto}
  .brand h1{margin:0;font-size:17px;letter-spacing:2px;white-space:nowrap}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:.5px;white-space:nowrap}
  .hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:1 1 auto;min-width:0}
  .pills{display:flex;gap:6px}
  .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pill span{background:rgba(255,253,248,.94);border:1px solid #ece3d2;border-radius:999px;
    padding:8px 12px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;
    display:flex;align-items:center;gap:4px}
  .tools button{width:42px;height:42px;border-radius:14px;border:1px solid #ece3d2;background:rgba(255,253,248,.95);
    box-shadow:var(--shadow);display:grid;place-items:center;padding:0;position:relative}
  .tools button:active{transform:scale(.94)}
  .tools button.off{opacity:.45}
  .tools button .ping{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:4px;background:#e0a92b}

  /* 摇杆 */
  .stick{position:fixed;z-index:20;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));
    width:122px;height:122px;border-radius:50%;
    background:rgba(255,253,248,.42);border:2px solid rgba(255,255,255,.7);
    backdrop-filter:blur(2px);touch-action:none}
  .stick .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;background:rgba(255,253,248,.95);border:1px solid #e6ddc9;
    box-shadow:0 4px 10px rgba(63,58,50,.16)}
  .tipbar{position:fixed;z-index:19;left:50%;transform:translateX(calc(-50% + 70px));
    bottom:calc(18px + env(safe-area-inset-bottom));background:rgba(63,58,50,.88);color:#fff;
    padding:9px 15px;border-radius:20px;font-size:13px;white-space:normal;
    opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 190px);
    line-height:1.45;text-align:center}
  .tipbar.show{opacity:1}

  /* ================= 进屋提示 ================= */
  .enter-room{
    position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;
    background:rgba(45,52,45,.34);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:.28s;
  }
  .enter-room.show{opacity:1;pointer-events:auto}
  .er-box{
    background:var(--card);border-radius:24px;padding:24px 26px 18px;text-align:center;
    width:min(320px,88vw);box-shadow:0 20px 44px rgba(30,40,32,.28);
    transform:translateY(10px) scale(.97);transition:.28s;
  }
  .enter-room.show .er-box{transform:none}
  .er-icon{
    width:60px;height:60px;border-radius:20px;background:var(--accent-soft);
    display:grid;place-items:center;margin:0 auto 10px;
  }
  .er-box h3{margin:0 0 6px;font-size:17px;letter-spacing:1px}
  .er-box p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.7}
  .er-go{
    display:block;width:100%;border:none;border-radius:999px;padding:14px 0;
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:2px;
    cursor:pointer;font-family:inherit;box-shadow:0 8px 18px rgba(79,158,107,.32);
  }
  .er-go:active{transform:scale(.98)}
  .er-later{
    display:block;width:100%;margin-top:9px;border:none;background:transparent;
    color:#9aa89d;font-size:13px;padding:8px 0;cursor:pointer;font-family:inherit;
  }

  /* ================= 弹层 ================= */
  .mask{position:fixed;inset:0;z-index:40;background:rgba(45,52,45,.42);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:14px;
    opacity:0;pointer-events:none;transition:.22s}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{position:relative;width:100%;max-width:470px;max-height:min(90vh,780px);overflow:auto;
    overscroll-behavior:contain;background:var(--card);border-radius:26px;padding:18px 18px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,.22);transform:translateY(14px) scale(.98);transition:.24s}
  .mask.show .sheet{transform:none}
  .sheet h2{margin:0 0 4px;font-size:20px;letter-spacing:1px;padding-right:46px}
  .sheet .sub{margin:0 0 12px;font-size:14px;color:#6f7d74;line-height:1.6;padding-right:4px}
  .sheet .close{position:absolute;right:12px;top:12px;width:34px;height:34px;flex:0 0 auto;
    padding:0;border-radius:12px;font-size:15px;line-height:1;background:#f4efe4;border:1px solid var(--line)}
  .row{display:flex;gap:8px}
  .btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 8px;
    font-size:15px;color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.ghost{background:transparent}
  .btn:active{transform:scale(.98)}

  .stats{display:flex;justify-content:space-between;gap:8px;background:var(--accent-soft);
    border-radius:15px;padding:9px 14px;font-size:12px;margin-bottom:10px;color:#5d7a66}
  .stats b{font-size:16px;color:#3f6b4c}
  /* 难度那一格可以点，点一下换一档 */
  .statbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
    border:none;background:transparent;padding:2px 6px;margin:-2px -6px;cursor:pointer;
    font:inherit;color:inherit;border-radius:10px;transition:.16s}
  .statbtn:active{background:rgba(255,255,255,.75);transform:scale(.97)}
  .statbtn b{font-size:16px;color:#3f6b4c}
  .statbtn:after{content:"点一下换难度";font-size:10px;color:#9aa89e;margin-top:1px}
  .statbtn b.bump{animation:bump .45s ease}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28);color:#e08a2c}100%{transform:scale(1)}}
  .board{width:100%;min-height:210px;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px}
  .board > *{width:100%}
  .board .hintline{font-size:13px;color:#8a958c;text-align:center;line-height:1.6;margin-top:2px}
  .note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px}

  /* 通用大按钮格（种菜/浇水/摘果用） */
  .plots{display:grid;gap:10px;width:100%}
  .plot{position:relative;border-radius:18px;border:2px dashed #d9cfb9;background:#f7f2e6;
    display:grid;place-items:center;min-height:78px;transition:.16s;overflow:hidden}
  .plot.grown{border-style:solid;border-color:#a9d5ab;background:#eef8ea}
  .plot.wet{background:#e9f4fb;border-color:#a9cbe2}
  .plot:active{transform:scale(.97)}
  .plot .cap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11px;color:#a09580}

  /* 找一样 */
  .find{display:grid;gap:10px;width:100%}
  .find .card{height:96px;border-radius:18px;background:#fff;border:2px solid #ece3d2;
    display:grid;place-items:center;transition:.16s;padding:6px}
  .find .card .q{font-size:26px;font-weight:700;color:#c9c2ad;line-height:1}
  .find .card.mem.up,.find .card.pz.up{background:#f4f9f2;border-color:#bcd9b0}
  .find .card.peek{border-color:#f0a832;box-shadow:0 0 0 4px rgba(240,168,50,.35)}
  .find .card .sil{display:flex;justify-content:center;align-items:center;height:100%}
  .find .card .sil svg{filter:brightness(0);opacity:.42}
  /* 院子拼图 */
  .pzwrap{display:flex;justify-content:center;margin:6px 0 4px}
  .pzboard{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
    width:min(240px,68vw);padding:8px;border-radius:20px;
    background:#f7f2e6;border:2px dashed #d9cfb9}
  .pzcell{height:88px;border-radius:14px;border:2px solid #ece3d2;background:#fffdf8;
    display:grid;place-items:center;transition:.16s;padding:4px;cursor:default}
  .pzcell .q{font-size:24px;font-weight:700;color:#d5cdb8}
  .pzcell.ready{cursor:pointer;border-color:#bcd9b0}
  .pzcell.ready:active{transform:scale(.97)}
  .pzcell.on{background:#f4f9f2;border-color:#bcd9b0}
  .pzcell.no{animation:shake .3s;border-color:#e8a0a0}
  .pztraytip{font-size:12px;color:#a8a294;text-align:center;margin:10px 0 4px}
  .pztray{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
  .pzpiece{width:60px;height:60px;border-radius:14px;border:2px solid #ece3d2;
    background:#fff;display:grid;place-items:center;transition:.16s;padding:4px}
  .pzpiece.sel{border-color:#f0a832;background:#fff8ea;
    box-shadow:0 0 0 4px rgba(240,168,50,.28);transform:translateY(-3px)}

/* =====================================================================
   2. 声音：背景音乐（Web Audio 实时合成）+ 语音（speechSynthesis）
   ===================================================================== */
var Sound = (function(){
  var ctx=null, master=null, musicGain=null, timer=null, playing=false, step=0;
  /* 五声音阶（C 大调宫调式），听感柔和、不吵 */
  var SCALE=[0,2,4,7,9,12,14,16,19,21];
  var ROOT=261.63;      // C4
  function freq(semi){ return ROOT*Math.pow(2,semi/12); }

  function ensure(){
    if(ctx) return ctx;
    try{
      var AC = window.AudioContext||window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination);
      musicGain = ctx.createGain(); musicGain.gain.value=0.0; musicGain.connect(master);
      /* 一点点混响感：延迟反馈 */
      var dly=ctx.createDelay(0.6), fb=ctx.createGain(), wet=ctx.createGain();
      dly.delayTime.value=0.28; fb.gain.value=0.26; wet.gain.value=0.24;
      musicGain.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);
    }catch(e){ ctx=null; }
    return ctx;
  }

  /* 一个柔和的音：三角波 + 缓慢包络 */
  function tone(f,when,dur,vol,type){
    if(!ctx) return;
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||"triangle";
    o.frequency.value=f;
    g.gain.setValueAtTime(0,when);
    g.gain.linearRampToValueAtTime(vol,when+0.06);
    g.gain.exponentialRampToValueAtTime(0.0008,when+dur);
    o.connect(g); g.connect(musicGain);
    o.start(when); o.stop(when+dur+0.05);
  }

  /* 每 8 拍一个循环的琶音，配一个很轻的低音 */
  var MELODY=[0,4,2,5, 4,7,5,2, 0,4,2,5, 7,4,2,0];
  function tick(){
    if(!ctx) return;
    var t=ctx.currentTime+0.02;
    var n=MELODY[step%MELODY.length];
    tone(freq(SCALE[n%SCALE.length]), t, 1.5, 0.085, "triangle");
    if(step%4===0) tone(freq(SCALE[0]-12), t, 2.4, 0.055, "sine");
    if(step%8===4) tone(freq(SCALE[3]-12), t, 2.0, 0.038, "sine");
    step++;
  }

  return {
    /* 用户第一次点击后调用：解锁音频并淡入 */
    start:function(){
      if(!S.sound) return;
      ensure(); if(!ctx) return;
      if(ctx.state==="suspended") ctx.resume();
      if(playing) return;
      playing=true;
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.setValueAtTime(musicGain.gain.value, ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(0.5, ctx.currentTime+2.5);
      clearInterval(timer);
      timer=setInterval(tick, 620);
      tick();
    },
    stop:function(){
      if(!ctx) { playing=false; return; }
      playing=false;
      clearInterval(timer);
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.setValueAtTime(musicGain.gain.value, ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(0, ctx.currentTime+0.8);
    },
    /* 语音播放时把音乐压低，说完再抬起来 */
    duck:function(on){
      if(!ctx||!playing) return;
      var g = on?0.12:0.5;
      musicGain.gain.cancelScheduledValues(ctx.currentTime);
      musicGain.gain.setValueAtTime(musicGain.gain.value, ctx.currentTime);
      musicGain.gain.linearRampToValueAtTime(g, ctx.currentTime+0.4);
    },
    /* 音效：轻快的小提示音 */
    blip:function(kind){
      if(!S.sound) return;
      ensure(); if(!ctx) return;
      if(ctx.state==="suspended") ctx.resume();
      var t=ctx.currentTime;
      var map={ ok:[784,1047], good:[659,880,1175], soft:[523], pop:[880] };
      var arr=map[kind]||map.soft;
      var tmp=ctx.createGain(); tmp.gain.value=1; tmp.connect(master);
      arr.forEach(function(f,i){
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.type="sine"; o.frequency.value=f;
        g.gain.setValueAtTime(0,t+i*0.09);
        g.gain.linearRampToValueAtTime(0.16,t+i*0.09+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,t+i*0.09+0.42);
        o.connect(g); g.connect(tmp);
        o.start(t+i*0.09); o.stop(t+i*0.09+0.46);
      });
      setTimeout(function(){ try{tmp.disconnect();}catch(e){} }, 900);
    }
  };
})();

/* --------- 语音 --------- */
var Voice = (function(){
  var zh=null, ready=false, lastText="", lastAt=0;
  function pick(){
    if(!("speechSynthesis" in window)) return null;
    var vs=window.speechSynthesis.getVoices()||[];
    /* 优先中文女声 */
    var pref=["Xiaoxiao","Xiaoyi","Tingting","Yaoyao","Huihui","Google 普通话","Chinese","中文","普通话"];
    for(var i=0;i<pref.length;i++){
      for(var j=0;j<vs.length;j++){
        if((vs[j].name||"").indexOf(pref[i])>=0 && /zh|Chinese/i.test(vs[j].lang||"")) return vs[j];
      }
    }
    for(var k=0;k<vs.length;k++){ if(/^zh/i.test(vs[k].lang||"")) return vs[k]; }
    return null;
  }
  function refresh(){ zh=pick(); ready=true; }
  if("speechSynthesis" in window){
    refresh();
    window.speechSynthesis.onvoiceschanged=refresh;
    setTimeout(refresh,300); setTimeout(refresh,1200);
  }
  return {
    say:function(text,opts){
      if(!S.voice || !text) return;
      if(!("speechSynthesis" in window)) return;
      var now=Date.now();
      if(text===lastText && now-lastAt<2500) return;   // 同一句不连续重复
      lastText=text; lastAt=now;
      try{
        window.speechSynthesis.cancel();
        var u=new SpeechSynthesisUtterance(text);
        u.lang="zh-CN";
        if(zh) u.voice=zh;
        u.rate=(opts&&opts.rate)||0.92;      // 略慢，适合 3 岁
        u.pitch=(opts&&opts.pitch)||1.15;    // 略高，更柔和
        u.volume=0.95;
        u.onstart=function(){ Sound.duck(true); };
        u.onend=function(){ Sound.duck(false); };
        u.onerror=function(){ Sound.duck(false); };
        window.speechSynthesis.speak(u);
      }catch(e){}
    },
    stop:function(){ try{ window.speechSynthesis.cancel(); Sound.duck(false); }catch(e){} },
    has:function(){ return ("speechSynthesis" in window); }
  };
})();

function tree(x,y,s){

  E("rect",{x:-5,y:-8,width:10,height:26,rx:4,fill:"#a9784f"},g);
  E("circle",{cx:0,cy:-26,r:26,fill:"#8ec97e"},g);

  E("circle",{cx:16,cy:-14,r:18,fill:"#9ad689"},g);
  E("circle",{cx:0,cy:-34,r:15,fill:"#a8e096",opacity:".8"},g);
  return g;
}
function bush(x,y,s,fill){
  var g=E("g",{transform:"translate("+x+","+y+") scale("+s+")"});
  E("circle",{cx:0,cy:0,r:16,fill:fill||"#8dc97f"},g);
  E("circle",{cx:14,cy:4,r:12,fill:fill||"#8dc97f"},g);
  E("circle",{cx:-14,cy:4,r:12,fill:fill||"#8dc97f"},g);
  return g;
}
function flower(x,y,c){
  var g=E("g",{transform:"translate("+x+","+y+")"});
  for(var i=0;i<5;i++){
    var a=i/5*Math.PI*2;
    E("circle",{cx:(Math.cos(a)*3.6).toFixed(2),cy:(Math.sin(a)*3.6).toFixed(2),r:3,fill:c},g);
  }
  E("circle",{cx:0,cy:0,r:2.2,fill:"#ffe9a8"},g);
  return g;
}

function buildMap(){
  E("rect",{x:0,y:0,width:W,height:H,fill:"#bfe2b7"},mapSvg);
  for(var i=0;i<26;i++){
    var cxp=(i*127)%W, cyp=(i*211)%H;
    E("ellipse",{cx:cxp,cy:cyp,rx:90+(i%4)*30,ry:60+(i%3)*24,
      fill:i%2?"#c6e7bd":"#b8ddb0",opacity:".5"},mapSvg);
  }

  /* 主路 */
  var roads=E("g",{},mapSvg);
  E("rect",{x:0,y:392,width:W,height:100,fill:"#f5ead4"},roads);

function gWindows(g,x,y,w,h,n){

    E("rect",{x:wx,y:y,width:22,height:h,rx:7,fill:"#cfeaf6"},g);

    E("line",{x1:wx+11,y1:y,x2:wx+11,y2:y+h,stroke:"#fff","stroke-width":"2.4"},g);

}

   ===================================================================== */
var keys={};
document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].indexOf(k)>=0){ keys[k]=true; e.preventDefault(); }
  if(k==="escape") closeSheet();
});
document.addEventListener("keyup",function(e){ keys[e.key.toLowerCase()]=false; });

var stick=document.getElementById("stick"), knob=document.getElementById("knob");
var stickVec={x:0,y:0}, stickId=null;
function stickStart(e){ stickId=e.pointerId; try{stick.setPointerCapture(stickId);}catch(err){} stickMove(e); }
function stickMove(e){
  if(stickId===null) return;
  var r=stick.getBoundingClientRect();
  var dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  var len=Math.hypot(dx,dy), max=r.width/2-12;
  if(len>max){ dx=dx/len*max; dy=dy/len*max; }
  knob.style.transform="translate("+dx+"px,"+dy+"px)";
  stickVec.x=dx/max; stickVec.y=dy/max;
}
function stickEnd(){ stickId=null; stickVec.x=0; stickVec.y=0; knob.style.transform="translate(0,0)"; }
stick.addEventListener("pointerdown",stickStart);
stick.addEventListener("pointermove",stickMove);
stick.addEventListener("pointerup",stickEnd);
stick.addEventListener("pointercancel",stickEnd);

var walkTo=null;
stage.addEventListener("pointerdown",function(e){
  if(e.target.closest(".b")) return;
  if(document.getElementById("cover") && !document.getElementById("cover").classList.contains("hide")) return;
  var r=world.getBoundingClientRect();
  walkTo={ x:(e.clientX-r.left)/M.scale, y:(e.clientY-r.top)/M.scale };
});

function blocked(x,y){
  for(var i=0;i<BUILDINGS.length;i++){
    var b=BUILDINGS[i];
    if(x>b.x-b.w/2+14 && x<b.x+b.w/2-14 && y>b.y+b.h/2-26 && y<b.y+b.h/2+14) return true;
  }
  return false;
}
function clampX(x){ return Math.max(24,Math.min(W-24,x)); }
function clampY(y){ return Math.max(70,Math.min(H-14,y)); }

var lastT=0;
function loop(t){
  var dt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;
  var speed=330, vx=0, vy=0;
  if(keys["arrowleft"]||keys["a"]) vx-=1;
  if(keys["arrowright"]||keys["d"]) vx+=1;
  if(keys["arrowup"]||keys["w"]) vy-=1;
  if(keys["arrowdown"]||keys["s"]) vy+=1;
  vx+=stickVec.x; vy+=stickVec.y;
  var len=Math.hypot(vx,vy);
  if(len>1){ vx/=len; vy/=len; len=1; }
  var inputActive=len>0.18;          /* 真的有人在按方向键 / 推摇杆 */

  var moving=false;
  if(len>0.08){
    var nx=clampX(heroPose.x+vx*speed*dt), ny=clampY(heroPose.y+vy*speed*dt);
    if(!blocked(nx,heroPose.y)) heroPose.x=nx;
    if(!blocked(heroPose.x,ny)) heroPose.y=ny;
    if(Math.abs(vx)>0.1) heroPose.face=vx>0?1:-1;
    moving=true;
    /* 只有键盘/摇杆真有输入时才取消点地走路，
       否则摇杆松手后的残值会把点地走路一直清掉 */
    if(inputActive) walkTo=null;
  }
  if(walkTo){
    var dx=walkTo.x-heroPose.x, dy=walkTo.y-heroPose.y, d=Math.hypot(dx,dy);
    if(d>8){
      var st=Math.min(speed*dt,d);
      var stepX=dx/d*st, stepY=dy/d*st;
      var mx=clampX(heroPose.x+stepX), my=clampY(heroPose.y+stepY);
      var okX=!blocked(mx,heroPose.y), okY=!blocked(heroPose.x,my);
      if(okX) heroPose.x=mx;
      if(okY) heroPose.y=my;
      if(Math.abs(dx)>2) heroPose.face=dx>0?1:-1;
      if(!okX && !okY){
        /* 两个方向都堵住了：绕一下，先把能走的方向走完 */
        var slipA=clampX(heroPose.x+Math.sign(dx)*st), slipB=clampY(heroPose.y+Math.sign(dy)*st);
        if(!blocked(slipA,heroPose.y)) heroPose.x=slipA;
        else if(!blocked(heroPose.x,slipB)) heroPose.y=slipB;
        else walkTo=null;              /* 彻底堵死，停下 */
      }
      moving=true;
    } else walkTo=null;
  }
  /* 朝向(scaleX) 必须和走路/呼吸的位移写在同一行，
     否则会被后面的赋值覆盖掉，人转身就走形了 */
  var faceT="scaleX("+heroPose.face+") ";
  if(moving){
    heroPose.walk+=dt*11;
    heroInner.style.transform=faceT+"translateY("+(Math.sin(heroPose.walk)*2).toFixed(2)+"px) rotate("+(Math.sin(heroPose.walk)*1.6).toFixed(2)+"deg)";
  } else {
    heroInner.style.transform=faceT+"translateY("+(Math.sin(Date.now()/900)*0.9).toFixed(2)+"px)";
  }
  if(moving){ S.hero.x=heroPose.x; S.hero.y=heroPose.y; saveThrottled(); }
  drawHero(); stepFolk(dt); stepCarry(); stepFly(dt); updateCamera(dt); updateNearest();
  requestAnimationFrame(loop);
}

var cam={x:0,y:0};
function camTarget(){
  var s=M.scale, vw=viewW(), vh=viewH();
  var tx=vw/2-heroPose.x*s;
  var ty=vh*0.52-heroPose.y*s;
  var minX=vw-W*s, minY=vh-H*s;
  if(minX>=0) tx=minX/2; else tx=Math.max(minX,Math.min(0,tx));
  if(vh>H*s) ty=(vh-H*s)/2; else ty=Math.max(minY,Math.min(0,ty));
  return {x:tx,y:ty};
}
function updateCamera(dt){
  var t=camTarget(), k=Math.min(1,dt*5);
  cam.x+=(t.x-cam.x)*k; cam.y+=(t.y-cam.y)*k;
  world.style.transform="translate("+cam.x+"px,"+cam.y+"px) scale("+M.scale+")";
}
var saveT=0;
function saveThrottled(){ var n=Date.now(); if(n-saveT>900){ saveT=n; save(); } }

var nearId=null, nearSaid=0;
function nearest(){
  var best=null, bd=1e9;
  BUILDINGS.forEach(function(b){
    var bx=b.x, by=b.y+b.h/2-6;
    var d=Math.hypot(heroPose.x-bx,heroPose.y-by);
    var inDoor=Math.abs(heroPose.x-b.x)<b.w/2+30 && Math.abs(heroPose.y-(b.y+b.h/2+8))<72;
    var score=inDoor?d*0.5:d;
    if(score<bd){ bd=score; best=b; }
  });
  return (best&&bd<190)?best:null;
}
function updateNearest(){
  var n=nearest(), id=n?n.id:null;
  if(id===nearId) return;
  nearId=id;
  BUILDINGS.forEach(function(b){ b.el.dataset.active=(b.id===id)?"1":"0"; });
  if(n){
    showTip("到「"+bLabel(n)+"」门口了 · 点一下进去");
    /* 每 12 秒才念一次，避免吵闹 */
    if(Date.now()-nearSaid>12000){ nearSaid=Date.now(); }
  } else hideTip();
}

function diffName(){ return {easy:"小班",mid:"中班",hard:"大班"}[S.diff]||"中班"; }
var DIFF_ORDER=["easy","mid","hard"];

/* 提一档难度；已经到「大班」就停在那儿，回头再来 */
function stepDiff(){
  var i=DIFF_ORDER.indexOf(S.diff);
  if(i<0) i=1;
  if(i>=DIFF_ORDER.length-1) return false;      /* 已经最高 */
  S.diff=DIFF_ORDER[i+1]; save();
  return true;
}
function syncDiffLabel(){
  var e=document.getElementById("gDiff");
  if(e){
    e.textContent=diffName();
    e.classList.remove("bump");
    void e.offsetWidth;                          /* 强制重排，动画能重播 */
    e.classList.add("bump");
  }
}
function switchDiff(){
  var i=DIFF_ORDER.indexOf(S.diff);
  if(i<0) i=1;
  S.diff=DIFF_ORDER[(i+1)%DIFF_ORDER.length]; save();
  syncDiffLabel();
  startGame(curBuilding?curBuilding.game:"");
  toast("换成「"+diffName()+"」了");
  guide("现在是"+diffName()+"的，试试看。");
}

/* 「再玩一次」= 换一种难度（升一档，到顶就停在最高档重来） */
function restartGame(){
  if(!curBuilding) return;
  var up=stepDiff();
  startGame(curBuilding.game);
  syncDiffLabel();
  if(up){
    toast("换成「"+diffName()+"」了");
    guide("这次换"+diffName()+"的，我们再玩一次。");
  }else{
    toast(diffName()+"最难啦，再玩一次");
    guide("已经是最难的"+diffName()+"了，再来一次吧。");

/* =====================================================================
   8.5 小镇居民：三个小朋友 + 一只小狗，各有自己的日子
   ---------------------------------------------------------------------
   · 各自在街上慢慢走，会停下来做小动作（看花、跳一下、打哈欠、追蝴蝶）
   · 有心情：开心 / 饿了 / 困了 / 想玩。饿了头上冒小餐具，走过去点它就能喂
   · 玩家靠近会转头看你；点它会说话、给东西它会开心跳
   · 两个居民碰到一起会打招呼、并肩走一段；小狗会跟着澄澄跑
   全部存在 localStorage，刷新后位置和心情都还在
   ===================================================================== */
var FOLK = [
  { id:"doudou", name:"豆豆", kind:"boy",   spd:52,  home:{x:470,y:700}, like:"bread", talks:[
      "我在找小石头，你看这颗圆不圆？",

  { id:"duoduo", name:"朵朵", kind:"girl2", spd:44,  home:{x:1010,y:700}, like:"candy", talks:[
      "我在数地上的格子，一共好多好多。",
      "等会儿我想去公园看大树。",
      "你裙子上有花，真好看。",

    ], hungry:["呜……（它盯着你的口袋）","汪……（肚子叫了）"] }
];

/* 每只居民的运行时状态（不直接进存档，存档是精简版） */
var folkState = [];
/* 自己做的小朋友的配色，配色变了画图就跟着变 */
/* 自己做的小朋友存在这里（和上面三个固定居民合起来才是全部居民） */
var MYFOLK = [];

/* 从存档里读回自己做的小朋友 */
function loadMyFolk(){
  MYFOLK = (S.myfolk || []).map(function(u){
    return {
      id: u.id,
      name: u.name,
      kind: "kid",
      gen: 1,
      look: u.look || randomLook(),
      lookId: u.id,
      spd: 46 + (u.id.length % 5) * 3,
      home: u.home || { x: 520, y: 700 },
      like: u.like || "apple",
      carry: u.carry || null,

      hungry: u.hungry || KID_HUNGRY.slice(),
      gone: u.gone ? 1 : 0
    };
  });
}
var LOOK_SKIN = ["#f6d9c2", "#eec9a9", "#dcae86"];
var LOOK_HAIR = ["#4a3a2e", "#2f2a26", "#7a5334", "#c98a4b"];
var LOOK_CLOTH = ["#7fb6e0", "#f6a3b0", "#8fcca0", "#f2c14e", "#b4a2dd"];

function allFolk(){
  return FOLK.concat(MYFOLK.filter(function(u){ return !u.gone; }));
}
/* 配色换了，把所有用这套配色的娃娃重新画一遍 */
function repaintLook(id){
  folkState.forEach(function(n){
    if (n.cfg.lookId === id && n.el){
      n.el.innerHTML = '<span class="fbubble" hidden></span>' +
        '<span class="fmood" hidden></span>' + folkSvg("kid", 92, n.cfg.look);
      n.el.className = n.el.className.replace(/\s+gen\d+/, "");
      n.el.classList.add("gen" + n.cfg.gen);
      n.inner = n.el.querySelector("svg");
    }
  });
}

function folkSvg(kind, size, look){
  return folkArt(kind, size, look);
}

/* 一个居民的运行时状态 */
function makeState(f, sv){
  sv = sv || {};
  return {
    cfg: f,
    x: typeof sv.x === "number" ? sv.x : f.home.x,
    y: typeof sv.y === "number" ? sv.y : f.home.y,
    tx: null, ty: null,
    pause: 0,                 /* 还要停多久（秒） */
    act: null,                /* 正在做的小动作 */
    actT: 0,
    face: 1,
    walk: Math.random() * 6,
    mood: sv.mood || "happy", /* happy / hungry / sleepy / play */
    moodT: 8 + Math.random() * 14,
    greet: 0,                 /* 头顶气泡倒计时 */
    greetTxt: "",
    heart: 0,                 /* 冒爱心倒计时 */
    el: null, inner: null
  };
}

/* 找回上次的位置和心情，没有就放在家门口 */
function loadFolk(){
  var saved = S.folk || {};
  folkState = allFolk().map(function(f){
    var st = makeState(f, saved[f.id]);
    /* 手里牵着的玩具跟着存档回来 */
    if (saved[f.id] && saved[f.id].carry){ st.carry = saved[f.id].carry; f.carry = saved[f.id].carry; }
    else if (f.carry) st.carry = f.carry;
    return st;
  });
}

function bindFolkEl(n){
  var b = document.createElement("button");
  b.className = "folk" + (n.cfg.gen ? " gen" + n.cfg.gen : "");
  b.type = "button";
  b.id = "folk-" + n.cfg.id;
  b.innerHTML = '<span class="fbubble" hidden></span>' + folkSvg(n.cfg.kind, 92, n.cfg.look);
  b.addEventListener("click", function(e){ e.stopPropagation(); talkFolk(n); });
  world.appendChild(b);
  n.el = b;
  n.inner = b.querySelector("svg");
  if (n.cfg.carry) attachCarry(n);
}

function placeFolk(){
  folkState.forEach(bindFolkEl);
}

/* 新建一个居民：加状态、加存档、放到小镇上 */
function addFolk(u){
  var n = makeState(u, { x: u.home.x, y: u.home.y, mood: "happy" });
  folkState.push(n);
  bindFolkEl(n);
  n.el.classList.add("pop");
  drawFolk();
  return n;
}

/* 把某个居民从镇上拿走（收进小柜子） */
function removeFolk(id){
  var i = -1;
  folkState.forEach(function(n, k){ if (n.cfg.id === id) i = k; });
  if (i < 0) return;
  var n = folkState[i];
  if (n.el && n.el.parentNode) n.el.parentNode.removeChild(n.el);
  folkState.splice(i, 1);
  delete S.folk[id];
}

function drawFolk(){
  folkState.forEach(function(n){
    n.el.style.left = (n.x - 24) + "px";
    n.el.style.top = (n.y - 82) + "px";
    n.el.style.zIndex = String(10 + Math.round((n.y + 2) / 10));
    /* 只有娃娃翻转，气泡和表情角标保持正向 */
    var bob = n.pause > 0
      ? Math.sin(Date.now() / 700 + n.walk) * 1.2
      : Math.sin(n.walk * 2) * 2.2;
    var tilt = n.pause > 0 ? 0 : Math.sin(n.walk) * 1.4;
    n.inner.style.transform =
      "scaleX(" + n.face + ") translateY(" + bob.toFixed(2) + "px) rotate(" + tilt.toFixed(2) + "deg)";
  });
}

/* 挑一个新目标点：在自己家门口附近转悠，不走进房子 */
function pickTarget(n){
  var h = n.cfg.home;
  for (var k = 0; k < 12; k++){
    var a = Math.random() * Math.PI * 2;
    var r = 90 + Math.random() * 230;
    var x = clampX(h.x + Math.cos(a) * r);
    var y = clampY(h.y + Math.sin(a) * r * 0.6);
    if (!blocked(x, y)) { n.tx = x; n.ty = y; return; }
  }
  n.tx = h.x; n.ty = h.y;
}

/* 到了某个点做点小动作 */
var SMALL_ACTS = ["look", "jump", "stretch", "yawn"];

function startAct(n){
  n.act = SMALL_ACTS[Math.floor(Math.random() * SMALL_ACTS.length)];
  n.actT = 1.1 + Math.random() * 1.2;
  var txt = "";
  if (n.act === "yawn") txt = "呼——（打了个哈欠）";
  else if (n.act === "jump") txt = "嘿！（跳了一下）";
  else if (n.act === "stretch") txt = "（伸了个懒腰）";
  else txt = "（抬头看了看天）";
  if (Math.random() < 0.5) sayFolk(n, txt, 1.6);
}

function sayFolk(n, txt, sec){
  n.greetTxt = txt;
  n.greet = sec || 2.4;
  var bb = n.el.querySelector(".fbubble");
  if (bb){ bb.textContent = txt; bb.hidden = false; }

/* 心情变化：饿了、困了、想玩，过一阵又自己好了 */
function shiftMood(dt){
  folkState.forEach(function(n){
    n.moodT -= dt;
    if (n.moodT <= 0){
      n.moodT = 16 + Math.random() * 20;
      var pool = ["happy", "hungry", "play", "sleepy"];
      var pickM = pool[Math.floor(Math.random() * pool.length)];
      /* 玩家刚喂过就多开心一会儿 */
      if (n.justFed > 0){ pickM = "happy"; n.justFed = 0; }
      n.mood = pickM;
    }
    if (n.justFed > 0) n.justFed -= dt;
  });
}

/* 玩家靠近：转头看过来 */
function folkNoticeHero(){
  folkState.forEach(function(n){
    var d = Math.hypot(n.x - heroPose.x, n.y - heroPose.y);
    if (d < 130 && n.pause > 0.2){
      n.face = heroPose.x >= n.x ? 1 : -1;
    }
  });
}

/* 两只居民靠近了，打个招呼 */
function folkMeet(dt){
  folkState.forEach(function(a, i){
    if (a.cool > 0){ a.cool -= dt; return; }
    for (var j = i + 1; j < folkState.length; j++){
      var b = folkState[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) < 60){
        if (a.cfg.id !== "afu" && b.cfg.id !== "afu"){
          sayFolk(a, "嗨，" + b.cfg.name + "！", 1.8);
          sayFolk(b, "嗨！", 1.8);
        } else {
          sayFolk(a.cfg.id === "afu" ? a : b, "汪！", 1.4);
        }
        a.cool = 9; b.cool = 9;
        a.mood = a.mood === "hungry" ? a.mood : "happy";
        b.mood = b.mood === "hungry" ? b.mood : "happy";
        break;
      }
    }
  });
}

/* 阿福会跟着澄澄跑一小段 */
function dogFollow(dt){
  var dog = null;
  folkState.forEach(function(n){ if (n.cfg.kind === "dog") dog = n; });
  if (!dog) return;
  var d = Math.hypot(dog.x - heroPose.x, dog.y - heroPose.y);
  if (d < 300 && d > 70){
    dog.tx = heroPose.x + (dog.x > heroPose.x ? 46 : -46);
    dog.ty = heroPose.y + 12;
    dog.pause = 0;
  }
}

/* 主循环：每帧推进所有居民 */
function stepFolk(dt){
  dogFollow(dt);
  shiftMood(dt);
  folkMeet(dt);
  folkNoticeHero();

  folkState.forEach(function(n){
    /* 头顶气泡倒计时 */
    if (n.greet > 0){
      n.greet -= dt;
      if (n.greet <= 0){
        var bb = n.el.querySelector(".fbubble");
        if (bb) bb.hidden = true;
      }
    }

    /* 饿了 / 困了的图标提示 */
    var badge = n.el.querySelector(".fmood");
    if (!badge){
      badge = document.createElement("span");
      badge.className = "fmood";
      badge.hidden = true;
      n.el.appendChild(badge);
    }
    if (n.mood === "hungry"){
      badge.hidden = false;
      badge.textContent = "🍎";
      badge.className = "fmood hungry";
    } else if (n.mood === "sleepy"){
      badge.hidden = false;
      badge.textContent = "💤";
      badge.className = "fmood sleepy";
    } else {
      badge.hidden = true;
    }

    /* 正在做小动作 */
    if (n.act && n.actT > 0){
      n.actT -= dt;
      if (n.act === "jump" && n.inner){
        n.inner.style.transform = "scaleX(" + n.face + ") translateY(" + (-Math.abs(Math.sin(n.actT * 9)) * 9).toFixed(1) + "px)";
      }
      if (n.actT <= 0){ n.act = null; n.pause = 0.4 + Math.random() * 1.4; }
      return;
    }

    /* 停下来歇着 */
    if (n.pause > 0){ n.pause -= dt; return; }

    /* 该出发了 */
    if (n.tx === null || n.ty === null) pickTarget(n);

    var dx = n.tx - n.x, dy = n.ty - n.y, d = Math.hypot(dx, dy);
    if (d < 8){
      n.tx = null; n.ty = null;
      n.pause = 1.6 + Math.random() * 3.6;
      if (Math.random() < 0.55) startAct(n);
      return;
    }
    var st = Math.min(n.cfg.spd * dt, d);
    var nx = clampX(n.x + dx / d * st), ny = clampY(n.y + dy / d * st);
    if (!blocked(nx, n.y)) n.x = nx;
    if (!blocked(n.x, ny)) n.y = ny;
    if (Math.abs(dx) > 1) n.face = dx > 0 ? 1 : -1;
    n.walk += dt * 9;
  });
  drawFolk();
}

/* 点一个居民 */
function talkFolk(n){
  Sound.blip("tap");
  var line;
  if (n.mood === "hungry") line = pickPhrase(n.cfg.hungry);
  else if (n.mood === "sleepy") line = "啊……有点困了。";
  else line = pickPhrase(n.cfg.talks);

  sayFolk(n, line, 3.2);
  Voice.say(line.replace(/（.*?）/g, ""));

  /* 如果背包里有它喜欢的，顺手就能送 */
  var like = n.cfg.like;
  if ((S.bag[like] || 0) > 0){
    setTimeout(function(){ offerGift(n, like); }, 700);
  }
}

/* 送礼小窗：点了「送给它」才真的送出 */
function offerGift(n, itemId){
  var it = SHOP_ITEMS.filter(function(x){ return x.id === itemId; })[0];
  if (!it) return;
  if (document.getElementById("giftBox")) return;
  var d = document.createElement("div");
  d.id = "giftBox";
  d.className = "gift-box";
  d.innerHTML =
    '<div class="gb-in">' +
      '<div class="gb-ico">' + art(itemId, 54) + '</div>' +
      '<p>把' + it.name + '送给' + n.cfg.name + '？</p>' +
      '<button class="gb-yes" id="gbYes">送</button>' +
      '<button class="gb-no" id="gbNo">先留着</button>' +
    '</div>';
  document.body.appendChild(d);
  requestAnimationFrame(function(){ d.classList.add("show"); });

  document.getElementById("gbYes").onclick = function(){
    S.bag[itemId] = (S.bag[itemId] || 0) - 1;
    if (S.bag[itemId] <= 0) delete S.bag[itemId];
    n.mood = "happy"; n.justFed = 20; n.moodT = 20 + Math.random() * 8;
    /* 气球和风筝是拿在手里玩的，送出去以后它会一直牵着 */
    if (itemId === "balloon" || itemId === "kite"){
      n.carry = itemId;
      n.cfg.carry = itemId;
      attachCarry(n);
      saveFolk();
    }
    save(); paintHud(); paintCarry();
    closeGift();
    Sound.blip("good");
    /* 先把庆祝的小动作收住，不然会把话盖掉 */
    n.act = null; n.actT = 0; n.pause = 3;
    var cheer = "给我的吗？谢谢你！";
    if (itemId === "balloon") cheer = "气球！我牵着它走。";
    else if (itemId === "kite") cheer = "风筝！等下就去放。";
    else if (itemId === "teddy") cheer = "我可以抱着它睡午觉。";
    sayFolk(n, cheer, 3.2);
    Voice.say(cheer);
    n.inner.style.transition = "transform .18s ease";
    var t0 = Date.now();
    var iv = setInterval(function(){
      var k = (Date.now() - t0) / 120;
      n.inner.style.transform = "scaleX(" + n.face + ") translateY(" + (-Math.abs(Math.sin(k)) * 14).toFixed(1) + "px)";
      if (Date.now() - t0 > 900){ clearInterval(iv); n.inner.style.transform = "scaleX(" + n.face + ")"; }
    }, 60);
    heartBurst(n);
    toast("送给" + n.cfg.name + "一个" + it.name);
  };
  document.getElementById("gbNo").onclick = function(){ closeGift(); };
}
function closeGift(){
  var d = document.getElementById("giftBox");
  if (d && d.parentNode) d.parentNode.removeChild(d);
}

/* 头顶冒爱心 */
function heartBurst(n){
  for (var i = 0; i < 3; i++){
    (function(i){
      setTimeout(function(){
        var h = document.createElement("div");
        h.className = "fheart";
        h.innerHTML = folkArt("heart", 22);
        h.style.left = (n.x - 12 + (i - 1) * 16) + "px";
        h.style.top = (n.y - 96) + "px";
        world.appendChild(h);
        setTimeout(function(){ if (h.parentNode) h.parentNode.removeChild(h); }, 1200);
      }, i * 130);
    })(i);
  }
}

              '<div class="sc-ico">' + art(it.id, 62) + '</div>' +
              '<b>' + it.name + '</b>' +
              '<div class="sc-cost">' + ico("star", 13, "#f0a832") + ' ' + it.cost + '</div>' +
              '<button class="sc-buy" ' + (can ? 'onclick="buyItem(\'' + it.id + '\')"' : 'disabled') + '>' +
                (can ? "换" : "还差") + '</button>' +
            '</div>';
  });
  html += '</div>';
  html += '<div class="row" style="margin-top:14px"><button class="btn" onclick="openBag()">看看背包</button>' +
          '<button class="btn primary" onclick="closeSheet()">继续逛</button></div>';
  openSheet(html);
}

/* 背包面板（从小镇 HUD 打开） */
function openBag(){
  var ids = Object.keys(S.bag || {});
  var html = '<h2>我的背包</h2><p class="sub">' + (ids.length ? "点一下可以看，走到谁身边就能送给谁。" : "还是空的，去超市用星星换点东西吧。") + '</p>';
  if (ids.length){
    html += '<div class="bag-grid">';
    ids.forEach(function(id){
      var it = SHOP_ITEMS.filter(function(x){ return x.id === id; })[0];
      if (!it) return;
      var playable = (id === "balloon" || id === "bubble");
      html += '<div class="bag-cell"><div class="bg-ico">' + art(id, 58) + '</div>' +
              '<b>' + it.name + '</b><span>× ' + S.bag[id] + '</span>' +
              (playable ? '<button class="bg-play" onclick="closeSheet();playCarry(\'' + id + '\')">放</button>' : '') +
              '</div>';
    });
    html += '</div>';
  }
  html += '<div class="row" style="margin-top:14px"><button class="btn primary" onclick="closeSheet()">收起来</button></div>';
  openSheet(html);
  guide(ids.length ? "背包里有" + ids.length + "样东西。" : "背包还空着。");
}

/* =====================================================================
   10. 玩法（全部为 3 岁可完成的任务型，不含认字/算式）
   ===================================================================== */
var MINI={};

/* ---------- 10.1 浇水：按顺序给每盆花浇水 ---------- */
MINI.water=function(){
  var n = S.diff==="easy"?3:(S.diff==="mid"?4:5);
  var cur=0, seq=[];            // seq 里存每盆花的花色
  var cols=["#f7a5ad","#f6d365","#b9a5f7","#f78fb3","#8fd0e8"];
  seq=cols.slice(0,n);
  var step=0;                   // 0 浇水 1 开花结果

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div style="display:flex;justify-content:center">'+art(step===0?"can":"bloom",60,{c:"#f7a5ad"})+'</div>'+
      '<div class="hintline" id="wHint">'+(step===0? "点一点小花，给它浇浇水" : "花开了，真好看")+'</div>';
    var grid=document.createElement("div"); grid.className="plots";
    grid.style.gridTemplateColumns="repeat("+Math.min(n,3)+",1fr)";
    seq.forEach(function(c,i){
      var d=document.createElement("button");
      d.className="plot"+(i<cur?" wet":"");
      d.innerHTML=art(i<cur? "bloom" : "thirsty", 46, {c:c});
      var cap=document.createElement("div"); cap.className="cap";
      cap.textContent = i<cur? (step===0?"喝饱了":"开花了") : "还没浇";
      d.appendChild(cap);
      if(i===cur && step===0){
        d.style.borderColor="#7fb6e0"; d.style.background="#eef7fd";
        d.onclick=function(){ water(i,c); };
      }
      grid.appendChild(d);
    });
    g.appendChild(grid);
    paintScore(cur,seq.length);
  }
  function water(i,c){
    cur++; Sound.blip("ok"); render();
    if(cur<seq.length){
      guide(pickPhrase(["真棒，再浇下一盆。","这一盆也喝饱啦。","好厉害，还有几盆呢。"]),{rate:0.95});
    }else{
      step=1; render();
      Sound.blip("good");
      finish("花都开了，你帮了大忙，谢谢你。");
      /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    var ps=g.querySelectorAll(".plot");
    if(ps[cur]){ ps[cur].style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ if(ps[cur]) ps[cur].style.boxShadow=""; },1600); }
    guide("点一亮一亮的这一盆。");
  }
  render();
  return {hint:hint};
};

/* ---------- 10.2 收获：把所有萝卜拔出来（手眼协调 + 数数） ---------- */
MINI.harvest=function(){
  var n = S.diff==="easy"?4:(S.diff==="mid"?6:8);
  var left=n;
  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div style="display:flex;justify-content:center">'+art("carrot",54)+'</div>'+
      '<div class="hintline">还有 <b style="color:#e0832c">'+left+'</b> 个，点一点拔出来</div>';
    var grid=document.createElement("div"); grid.className="plots";
    grid.style.gridTemplateColumns="repeat(4,1fr)";
    for(var i=0;i<n;i++){
      var d=document.createElement("button");
      d.className="plot"+(i<n-left?" grown":"");
      d.style.minHeight="62px";
      if(i<n-left){ d.innerHTML=art("sprout",26); d.style.opacity=".45"; d.disabled=true; }
      else {
        d.innerHTML=art("carrot",40);
        (function(d){
          d.onclick=function(){
            left--; Sound.blip("pop"); render();
            if(left===0){
              Sound.blip("good");
              finish("全部拔出来啦，可以拿去做萝卜汤了。");
              /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
            }
          };
        })(d);
      }
      grid.appendChild(d);
    }
    g.appendChild(grid);
    paintScore(n-left,n);
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    var ps=[].filter.call(g.querySelectorAll(".plot"),function(x){return !x.disabled;});
    if(ps[0]){ ps[0].style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ if(ps[0]) ps[0].style.boxShadow=""; },1600); }
    guide("点还没拔出来的。");
  }
  render();

/* ---------- 10.3 排队：按从小到大排好（大小比较） ---------- */
MINI.sort=function(){
  /* 三个身高差别明显的小朋友（矮 / 中 / 高），按从矮到高排进队里 */
  var n = S.diff==="easy"?3:3;
  var KIDS=[
    {k:"kid3", h:52, name:"小小"},
    {k:"kid2", h:72, name:"中中"},
    {k:"kid1", h:94, name:"大大"}
  ];
  var chosen = KIDS.slice(0, n);
  var ans = chosen.slice();                      /* 已经是矮→高 */
  var pool = shuffle(chosen.slice());
  var placed = [];

  /* 画小朋友：底部对齐，高度决定大小，一眼看出谁高 */
  function kidSvg(k, h){
    /* 确保图形字典已生成 */
    if(!ART_LIB[k]) art(k,40);
    /* 用统一的 36 单位视口，只改宽高：图形等比放大，不会被裁头 */
    var size = Math.round(h*1.55);
    return '<div style="display:flex;align-items:flex-end;justify-content:center">'+
             '<svg viewBox="-18 -18 36 36" width="'+size+'" height="'+size+'" style="display:block;overflow:visible;flex:0 0 auto">'+
               ART_LIB[k] +
             '</svg>'+
           '</div>';
  }

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div class="hintline">从矮到高，一个一个点</div>';

    /* 队列：左边是起点（矮），右边越来越高 */
    var slots=document.createElement("div"); slots.className="sortqueue";
    for(var i=0;i<n;i++){
      var cell=document.createElement("div");
      cell.className="qcell"+(placed[i]?" filled":"");
      if(placed[i]) cell.innerHTML=kidSvg(placed[i].k, placed[i].h);
      else cell.innerHTML='<span class="qnum">'+(i+1)+'</span>';
      slots.appendChild(cell);
    }
    g.appendChild(slots);

    /* 身高刻度参考 */
    var ruler=document.createElement("div"); ruler.className="ruler";
    ruler.innerHTML='<span>矮</span><i></i><span>高</span>';
    g.appendChild(ruler);

    var row=document.createElement("div"); row.className="sortrow";
    pool.forEach(function(it){
      if(it.used) return;
      var d=document.createElement("button"); d.className="sitem";
      d.style.width="88px"; d.style.height="118px"; d.style.alignItems="flex-end";
      d.innerHTML=kidSvg(it.k, it.h);
      d.onclick=function(){ pick(it,d); };
      row.appendChild(d);
    });
    g.appendChild(row);
    paintScore(placed.length,n);
  }

  function pick(it,dom){
    var idx=placed.length;
    if(it===ans[idx]){
      it.used=true; placed.push(it); Sound.blip("ok"); render();
      if(placed.length===n){
        Sound.blip("good");
        finish("排好啦！一个比一个高，真整齐。");
        /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
      }else{
        guide(pickPhrase(["对，把它放进来。","接着找高一点的。","很好，再看下一个。"]),{rate:0.95});
      }
    }else{
      Sound.blip("soft");
      if(dom){ dom.classList.add("no"); setTimeout(function(){ dom.classList.remove("no"); },420); }
      guide("先点最矮的那个，它会排在第一个。",{rate:0.95});
    }
  }

  function hint(){
    var want=ans[placed.length];
    if(!want){ return; }
    guide("找一找，哪一个最矮？");
    var g=boardEl(); if(!g) return;
    var found=null;
    [].forEach.call(g.querySelectorAll(".sortrow .sitem"),function(btn){
      if(btn.querySelector('svg') && +btn.querySelector('svg').getAttribute("width")===Math.round(94*want.h/94)) found=btn;
    });
    /* 用高度匹配更稳：直接找 svg 高度等于目标高度的按钮 */
    [].forEach.call(g.querySelectorAll(".sortrow .sitem"),function(btn){
      var sv=btn.querySelector("svg");
      if(sv && Math.abs(+sv.getAttribute("height") - Math.round(94*want.h/94))<3) found=btn;
    });
    if(found){ found.style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ if(found) found.style.boxShadow=""; },1800); }
  }
  render();
  return {hint:hint};
};

/* ---------- 10.6 铺路：把路接通（空间路径引导） ---------- */
MINI.path=function(){
  /* 7x5 网格，左中出发，右上终点；中间有断点，点亮空格铺路 */
  var cols=S.diff==="easy"?5:7, rows=S.diff==="easy"?3:5;
  var start=[Math.floor(rows/2),0], goal=[0,cols-1];
  var grid=[];
  for(var r=0;r<rows;r++){ grid.push([]); for(var c=0;c<cols;c++) grid[r].push("block"); }
  /* 正确的路：先右到底，再上到顶（形成 L 形，容易看懂） */
  var path=[];
  for(var c2=0;c2<cols;c2++) path.push([start[0],c2]);
  for(var r2=start[0]-1;r2>=0;r2--) path.push([r2,cols-1]);
  path.forEach(function(p){ grid[p[0]][p[1]]="path"; });

  /* 随机挖断几个格子，让小朋友补回来 */
  var holes = S.diff==="easy"?2:(S.diff==="mid"?3:4);
  var inner=path.slice(1,path.length-1);
  shuffle(inner).slice(0,holes).forEach(function(p){ grid[p[0]][p[1]]="hole"; });

  var pos={r:start[0],c:start[1]};
  var filled=0, need=inner.filter(function(p){return grid[p[0]][p[1]]==="hole";}).length;

  function reachable(from,to){
    var seen={}, q=[from];
    seen[from.r+","+from.c]=1;
    while(q.length){
      var cur=q.shift();
      if(cur.r===to.r&&cur.c===to.c) return true;
      [[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){
        var nr=cur.r+d[0], nc=cur.c+d[1];
        if(nr<0||nc<0||nr>=rows||nc>=cols) return;
        if(grid[nr][nc]==="block") return;
        var key=nr+","+nc;
        if(seen[key]) return;
        seen[key]=1; q.push({r:nr,c:nc});
      });
    }
    return false;
  }

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div class="hintline" id="pHint">点亮空格，把路接到'+(curBuilding&&curBuilding.id==="park"?"大树":"消防站")+'</div>';
    var m=document.createElement("div"); m.className="map-grid";
    m.style.gridTemplateColumns="repeat("+cols+",1fr)";
    for(var r=0;r<rows;r++){
      for(var c=0;c<cols;c++){
        var cell=document.createElement("div");
        var st=grid[r][c];
        cell.className="tg"+(st==="block"?" block":(st==="path"?" path":(st==="hole"?" hole":"")));
        if(r===goal[0]&&c===goal[1]){ cell.classList.add("target"); cell.innerHTML=art(curBuilding&&curBuilding.id==="park"?"tree":"truck",30); }
        else if(st==="path") cell.innerHTML='<div style="width:100%;height:100%;border-radius:9px;background:#f6d98a"></div>';
        else if(st==="hole") cell.innerHTML='<div style="width:100%;height:100%;border-radius:9px;background:#fff3d4"></div>';
        if(r===pos.r&&c===pos.c){ cell.classList.add("me"); cell.innerHTML=art("girl",30); }
        (function(r,c,st,cell){
          if(st==="hole") cell.onclick=function(){ fillHole(r,c,cell); };
        })(r,c,st,cell);
        m.appendChild(cell);
      }
    }
    g.appendChild(m);
    paintScore(filled,need);
  }
  function fillHole(r,c,cell){
    grid[r][c]="path"; filled++; Sound.blip("ok");
    /* 铺好后自动往前走一步 */
    if(filled>=need){
      render();
      Sound.blip("good");
      finish("路接通啦，可以走过去喽。");
      /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
    }else{
      render();
      guide("这一段接上了，继续往前。");
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    var cs=g.querySelectorAll(".map-grid .tg");
    for(var i=0;i<cs.length;i++){
      if(cs[i].style.background==="rgb(255, 253, 243)"){
        cs[i].style.boxShadow="0 0 0 4px #f0a832";
        setTimeout(function(){ cs[i].style.boxShadow=""; },1700);
        break;
      }
    }
    guide("点亮空着的那一格，路就接上了。");
  }
  render();
  return {hint:hint};
};

/* ---------- 10.8 记忆翻卡片：翻两张，找出一样的 ---------- */
MINI.memory=function(){
  var kinds=["apple","balloon","star","flower","truck","ball","heart","candy","kite","teddy"];
  var pairs=S.diff==="easy"?3:(S.diff==="mid"?4:5);
  var deck=[], open=[], lock=false, found=0;
  (function(){
    var pick=shuffle(kinds).slice(0,pairs);
    pick.forEach(function(k){ deck.push({k:k,done:false}); deck.push({k:k,done:false}); });
    shuffle(deck);
  })();
  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div class="hintline">翻开两张卡片，找出一样的</div>';
    var grid=document.createElement("div"); grid.className="find memgrid";

      var d=document.createElement("button");
      d.className="card mem"+(c.done||open.indexOf(i)>=0?" up":"");
      d.innerHTML=c.done||open.indexOf(i)>=0 ? art(c.k,52) : '<span class="q">?</span>';
      if(!c.done && open.indexOf(i)<0 && !lock){
        (function(i){ d.onclick=function(){ flip(i); }; })(i);
      }
      grid.appendChild(d);
    });
    g.appendChild(grid);

    open.push(i); Sound.blip("pop"); render();
    if(open.length===2){
      lock=true;

      if(a.k===b.k){
        setTimeout(function(){
          a.done=b.done=true; open=[]; lock=false; found++;
          Sound.blip("ok"); render();
          if(found>=pairs){
            Sound.blip("good");
            finish("全都记住啦，记性真好。");
            /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
          }else{
            guide(pickPhrase(["一对好朋友找到啦。","真棒，继续翻。","记住位置，越翻越快。"]));
          }
        },480);
      }else{
        guide("不一样，看一看，记住它们在哪里。");
        setTimeout(function(){ open=[]; lock=false; render(); },850);
      }
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    var cs=g.querySelectorAll(".mem");
    if(cs.length){ cs[0].classList.add("peek"); setTimeout(function(){ cs[0].classList.remove("peek"); },1600); }
    guide("先翻开一张，记住它，再找它的好朋友。");
  }
  render();
  return {hint:hint};
};

/* ---------- 10.10 院子拼图：把碎片拖到网格里，拼成外公画的院子 ---------- */
MINI.puzzle=function(){
  /* 2x2 的四块：左上太阳、右上云、左下大树、右下小花
     孩子把下面盒子里的小图，拖（或点选再点格）到对应位置 */
  var pieces=[
    { k:"sun",    name:"太阳", slot:0 },
    { k:"cloud",  name:"云朵", slot:1 },
    { k:"tree",   name:"大树", slot:2 },
    { k:"flower", name:"小花", slot:3 }
  ];
  var placed={};         /* slot -> piece key */
  var picked=null;       /* 已选中的碎片下标 */
  var seed=shuffle([0,1,2,3]);   /* 碎片在下方盒子里的排列 */
  var total=pieces.length, done=0, wrong=0;

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div class="hintline">把下面的小图放到上面格子里</div>';
    var wrap=document.createElement("div"); wrap.className="pzwrap";

    /* 上面：2x2 棋盘 */
    var board=document.createElement("div"); board.className="pzboard";
    for(var i=0;i<4;i++){
      var c=document.createElement("button");
      c.className="pzcell"+(placed[i]?" on":"")+(picked!==null?" ready":"");
      c.dataset.slot=i;
      c.innerHTML = placed[i] ? art(placed[i],52) : '<span class="q">?</span>';
      (function(i,c){
        c.onclick=function(){ drop(i); };
      })(i,c);
      board.appendChild(c);
    }
    wrap.appendChild(board);
    g.appendChild(wrap);

    /* 下面：待放的碎片 */
    var tray=document.createElement("div"); tray.className="pztray";
    seed.forEach(function(idx){
      var pc=pieces[idx];
      if(placed[pc.slot]) return;
      var t=document.createElement("button");
      t.className="pzpiece"+(picked===idx?" sel":"");
      t.innerHTML=art(pc.k,44);
      t.onclick=function(){ picked=(picked===idx?null:idx); Sound.blip("tap"); render(); };
      tray.appendChild(t);
    });
    if(tray.children.length){
      var lab=document.createElement("div"); lab.className="pztraytip";
      lab.textContent="先点一张小图，再点上面对应的格子";
      g.appendChild(lab);
      g.appendChild(tray);
    }else{
      g.appendChild(tray);
    }
    paintScore(done,total);
  }

  function drop(slot){
    if(gameDone) return;
    if(placed[slot]){ guide("这里已经拼好啦。"); return; }
    if(picked===null){ guide("先点下面的一张图。"); Sound.blip("soft"); return; }
    var pc=pieces[picked];
    if(pc.slot===slot){
      placed[slot]=pc.k; picked=null; done++;
      Sound.blip("ok"); render();
      if(done>=total){
        Sound.blip("good");
        finish("拼好啦，这就是外公画的院子。");
        /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
      }else{
        guide(pickPhrase(["对，"+pc.name+"就放这儿。","放对了，继续。","好眼力。"]));
      }
    }else{
      wrong++;
      Sound.blip("soft");
      var cell=document.querySelector('.pzcell[data-slot="'+slot+'"]');
      if(cell){ cell.classList.add("no"); setTimeout(function(){ cell.classList.remove("no"); },380); }
      guide("这张不是这里的，看看它旁边该是什么。");
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    /* 先替孩子选好一张，再把对应格子点亮 */
    if(picked===null){
      var left=pieces.filter(function(x){ return !placed[x.slot]; })[0];
      if(left){ picked=pieces.indexOf(left); render(); }
    }
    if(picked!==null){
      var cell=document.querySelector('.pzcell[data-slot="'+pieces[picked].slot+'"]');
      if(cell){ cell.style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ if(cell) cell.style.boxShadow=""; },1800); }
      guide(pieces[picked].name+"放在亮起来的格子里。");
    }
  }
  render();
  return {hint:hint};
};

/* ---------- 10.7 种地：挖坑 → 放种子 → 浇水（三步任务） ---------- */
MINI.plant=function(){
  var n = S.diff==="easy"?1:(S.diff==="mid"?2:3);
  var plots=[];   /* 0 空地 1 挖好坑 2 放了种子 3 发芽 */
  for(var i=0;i<n;i++) plots.push(0);
  var active=0;
  var STAGE=["点铲子，先挖个小坑","放进一颗小种子","浇一点水，等它发芽"];
  var TOOLS=["shovel","seed","can"];
  var NAMES=["小铲子","种子","水壶"];

  function soilSvg(stage){
    /* 一块土垄：底色土黄 + 细纹，中间按阶段画坑/种子/苗 */
    /* 先确保图形字典就绪 */
    if(!ART_LIB.seed) art("seed",20);
    if(!ART_LIB.sprout) art("sprout",20);
    var inner="";
    if(stage===0) inner='<ellipse cx="0" cy="2" rx="8" ry="3.6" fill="#b08a5e" opacity=".38"/>';
    if(stage===1) inner='<ellipse cx="0" cy="2" rx="11" ry="5.6" fill="#8f7048"/>'+
                        '<ellipse cx="0" cy="0.6" rx="8" ry="3.8" fill="#6f5638"/>';
    if(stage===2) inner='<ellipse cx="0" cy="2" rx="11" ry="5.6" fill="#8f7048"/>'+
                        '<g transform="translate(0,-5) scale(.62)">'+ART_LIB.seed+'</g>';
    if(stage===3) inner='<g transform="translate(0,-4) scale(.9)">'+ART_LIB.sprout+'</g>';
    return '<svg viewBox="-26 -16 52 34" width="100%" height="70" preserveAspectRatio="xMidYMid meet" style="display:block;overflow:visible;max-width:100%;height:auto">'+
             /* 土垄：一块略立体的褐色土台 */
             '<path d="M-23,8 C-23,1 23,1 23,8 L23,12 C23,19 -23,19 -23,12 Z" fill="#b18f63"/>'+
             '<ellipse cx="0" cy="8" rx="23" ry="7.2" fill="#cBa87b"/>'+
             '<ellipse cx="0" cy="7" rx="19.5" ry="5.6" fill="#d6b98d"/>'+
             /* 小土粒 */
             '<circle cx="-13" cy="6" r="1.3" fill="#c0a071" opacity=".8"/>'+
             '<circle cx="11" cy="8.4" r="1.1" fill="#c0a071" opacity=".8"/>'+
             '<circle cx="7" cy="4.6" r="1" fill="#c0a071" opacity=".7"/>'+
             '<circle cx="-8" cy="9.2" r="1" fill="#c0a071" opacity=".7"/>'+
             inner+
           '</svg>';
  }

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    var st=(active<n)?(plots[active]||0):3;
    var line=(active<n)?(STAGE[st]||STAGE[0]):"全都发芽啦，真棒";
    g.innerHTML='<div class="hintline" style="font-size:14px;color:#5d7a66;font-weight:600">'+line+'</div>';
    var row=document.createElement("div"); row.className="plots";
    row.style.gridTemplateColumns="repeat("+n+",1fr)";
    plots.forEach(function(stage,i){
      var d=document.createElement("button");
      d.className="plot"+(stage===3?" grown":"");
      d.style.padding="4px";
      d.style.minHeight="80px";
      d.innerHTML=soilSvg(stage);
      if(i===active && !ended){
        d.style.borderColor="#f0c25a"; d.style.background="#fffdf3";
        d.onclick=function(){ advance(); };
      }
      row.appendChild(d);
    });
    g.appendChild(row);

    /* 三个工具：该用的那个亮起来，并带一句名字 */
    var tools=document.createElement("div");
    tools.style.cssText="display:flex;justify-content:center;gap:12px;margin-top:10px";
    TOOLS.forEach(function(k,i){
      var wrap=document.createElement("div");
      wrap.style.cssText="text-align:center";
      var b=document.createElement("div");
      var on=(i===Math.min(st,2));
      b.style.cssText="width:60px;height:60px;border-radius:16px;display:grid;place-items:center;border:2px solid "+
        (on?"#f0c25a":"#ece3d2")+";background:"+(on?"#fff6e4":"#fff")+";"+
        (on?"box-shadow:0 4px 10px rgba(240,194,90,.35);":"opacity:.4;");
      b.innerHTML=art(k,34);
      var lb=document.createElement("div");
      lb.style.cssText="font-size:11px;color:"+(on?"#a3792a":"#a9a49a")+";margin-top:3px";
      lb.textContent=NAMES[i];
      wrap.appendChild(b); wrap.appendChild(lb);
      tools.appendChild(wrap);
    });
    g.appendChild(tools);
    paintScore(plots.filter(function(x){return x===3;}).length,n);
  }

  var ended=false;
  function advance(){
    if(ended) return;
    plots[active]++;
    Sound.blip("ok");
    if(plots[active]<3){
      render();
      guide(pickPhrase(["对，就这样。","下一步啦。","很好。"]),{rate:0.95});
      return;
    }
    if(active>=n-1){
      active=n;                   /* 全部完成：让 render 走「全部发芽」分支 */
      ended=true;                 /* 并锁住，避免重复触发 */
      render();
      Sound.blip("good");
      finish("种子发芽啦，过几天就会长大。");
      /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
    }else{
      active++;
      render();
      guide("这块长出来了，去种下一块。",{rate:0.95});
    }
  }

  function hint(){
    if(active>=n) return;
    var st=plots[active]||0;
    guide("现在要用"+NAMES[st]+"。");
    var g=boardEl(); if(!g) return;
    var the=null;
    [].forEach.call(g.querySelectorAll("button.plot"),function(p,i){ if(i===active) the=p; });
    if(the){ the.style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ if(the) the.style.boxShadow=""; },1800); }
  }
  render();
  return {hint:hint};
};

/* =====================================================================

   ===================================================================== */
var carryEls = [];

/* 手里站着的东西：背包里有气球就挂一只，点一下就能放飞 */
function paintCarry(){

  carryEls.push(b);
}
/* 跟着主角一起动的东西（气球 / 风筝 / 小旗子）每帧更新，不用定时器 */
function stepCarry(){
  carryEls.forEach(function(e){

  folkState.forEach(function(n){

    n.carryEl.style.top = (n.y - 116) + "px";

/* =====================================================================
   10.85 放飞气球 / 吹泡泡
   ---------------------------------------------------------------------
   · 气球：点一下，满屏慢慢飘起一片气球，不扎堆、会自己飘走
   · 泡泡：点一下，一群泡泡从脚下升起来，点泡泡会啵地破掉
   · 都从背包里扣 1 个，扣完手里就没啦
   ===================================================================== */
var FLY = [];              /* 正在飘的东西，每帧推一次 */
var flyLayer = null;

function flyRoot(){
  if (!flyLayer || !flyLayer.parentNode){
    flyLayer = document.createElement("div");
    flyLayer.className = "fly-layer";
    document.body.appendChild(flyLayer);
  }
  return flyLayer;
}

/* 在屏幕上随机撒点，尽量不重叠（格子随机取，天然均匀） */
function scatterSpots(n, cols, rows, padX, padTop, padBottom){
  var spots = [];
  for (var i = 0; i < cols * rows; i++) spots.push(i);
  shuffle(spots);
  var out = [];
  for (var k = 0; k < n && k < spots.length; k++){
    var idx = spots[k];
    var c = idx % cols, r = Math.floor(idx / cols);
    out.push({
      x: padX + (c + 0.18 + Math.random() * 0.64) * (1 - padX * 2) / cols,
      y: padTop + (r + 0.15 + Math.random() * 0.7) * (1 - padTop - padBottom) / rows
    });
  }
  return out;
}

var FLY_COLORS = ["#f78fb3", "#8fd0e8", "#f6d365", "#b9a5f7", "#a9e0b0", "#f7a678", "#f2a3c8"];

function playCarry(id){
  if (!(S.bag[id] > 0)){
    toast(id === "balloon" ? "气球用完了，去商店再换一些" : "泡泡用完了，去商店再换一些");
    Voice.say("用完了，去商店换一些吧。");
    return;
  }
  S.bag[id] = (S.bag[id] || 0) - 1;
  if (S.bag[id] <= 0) delete S.bag[id];
  save(); paintHud(); paintCarry();
  if (id === "balloon") releaseBalloons();
  else blowBubbles();
}

/* 气球：一次放一片（3 只左右），从人物身边升起，飘飘悠悠往上走 */
function releaseBalloons(){
  var root = flyRoot();
  var n = 3 + Math.floor(Math.random() * 2);      /* 3-4 只 */
  var cols = 3, rows = 2;
  var spots = scatterSpots(n, cols, rows, 0.10, 0.28, 0.18);
  var vw = window.innerWidth, vh = window.innerHeight;
  Sound.blip("pop");
  spots.forEach(function(p, i){
    setTimeout(function(){
      var el = document.createElement("div");
      el.className = "flyer balloon";
      var col = FLY_COLORS[Math.floor(Math.random() * FLY_COLORS.length)];
      var size = 30 + Math.random() * 18;
      el.style.left = (p.x * vw) + "px";
      el.style.top = (p.y * vh) + "px";
      el.style.setProperty("--c", col);
      el.innerHTML = '<svg viewBox="-12 -12 24 24" width="' + size + '" height="' + size + '" aria-hidden="true">' +
        '<path d="M0,4 C-6,-1 -6,-9 0,-9 C6,-9 6,-1 0,4 Z" fill="' + col + '"/>' +
        '<path d="M0,4 L0,6" stroke="#c98aa0" stroke-width="1.2"/>' +
        '<path d="M0,6 C-2.2,8 2.2,9.2 0,11" stroke="#c98aa0" stroke-width="1.1" fill="none"/>' +
        '<ellipse cx="-2" cy="-5" rx="1.6" ry="2.2" fill="#fff" opacity=".55"/></svg>';
      root.appendChild(el);
      FLY.push({
        el: el, kind: "balloon",
        x: p.x * vw, y: p.y * vh,
        vx: (Math.random() - 0.5) * 10, vy: -(14 + Math.random() * 12),
        sway: Math.random() * 6.28, swayAmp: 8 + Math.random() * 10,
        life: 7.5, age: 0
      });
      Sound.blip("ok");
    }, i * 170);
  });
  toast("气球飞起来啦");
  Voice.say("气球飞起来喽。");
}

/* 泡泡：一群泡泡从脚下升起来，点一下会破 */
function blowBubbles(){
  var root = flyRoot();
  var vw = window.innerWidth, vh = window.innerHeight;
  Sound.blip("soft");
  var n = 7;
  for (var i = 0; i < n; i++){
    (function(i){
      setTimeout(function(){
        var el = document.createElement("div");
        el.className = "flyer bubble";
        var size = 18 + Math.random() * 26;
        el.style.width = size + "px";
        el.style.height = size + "px";
        el.innerHTML = art("bubble", size);
        el.style.left = (0.12 + Math.random() * 0.76) * vw + "px";
        el.style.top = (0.34 + Math.random() * 0.22) * vh + "px";
        root.appendChild(el);
        var f = {
          el: el, kind: "bubble",
          x: (0.12 + Math.random() * 0.76) * vw, y: (0.34 + Math.random() * 0.22) * vh,
          vx: (Math.random() - 0.5) * 16, vy: -(22 + Math.random() * 16),
          sway: Math.random() * 6.28, swayAmp: 10 + Math.random() * 12,
          life: 5.2, age: 0
        };
        el.addEventListener("click", function(e){ e.stopPropagation(); popBubble(f); });
        FLY.push(f);
        Sound.blip("ok");
      }, i * 110);
    })(i);
  }
  Voice.say("泡泡，圆圆的泡泡。");
}

function popBubble(f){
  if (f.dead) return;
  f.dead = true;
  Sound.blip("pop");
  f.el.classList.add("popping");
  setTimeout(function(){ if (f.el.parentNode) f.el.parentNode.removeChild(f.el); }, 300);
}

/* 每帧推一次：往上飘 + 左右晃 + 飘出屏幕或到时间就收掉 */
function stepFly(dt){
  for (var i = FLY.length - 1; i >= 0; i--){
    var f = FLY[i];
    if (f.dead){ FLY.splice(i, 1); continue; }
    f.age += dt;
    f.sway += dt * 1.6;
    f.y += f.vy * dt;
    f.x += f.vx * dt;
    var sway = Math.sin(f.sway) * f.swayAmp;
    f.el.style.transform = "translate(" + sway.toFixed(1) + "px," + 0 + "px)";
    f.el.style.left = f.x.toFixed(1) + "px";
    f.el.style.top = f.y.toFixed(1) + "px";
    var fadeStart = f.life - 1.2;
    if (f.age > fadeStart) f.el.style.opacity = Math.max(0, (f.life - f.age) / 1.2);
    if (f.age > f.life || f.y < -80){
      if (f.el.parentNode) f.el.parentNode.removeChild(f.el);
      FLY.splice(i, 1);
    }
  }
}

/* 某个居民手里牵着的东西（气球 / 风筝） */
function attachCarry(n){
  if (n.carryEl && n.carryEl.parentNode) n.carryEl.parentNode.removeChild(n.carryEl);
  n.carryEl = null;
  if (!n.carry) return;
  var d = document.createElement("div");
  d.className = "carry " + n.carry;
  d.innerHTML = art(n.carry, n.carry === "kite" ? 30 : 26);
  world.appendChild(d);
  n.carryEl = d;
}

function ico(name,size,color){
  var d=ICONS[name]||ICONS.star;
  return '<svg viewBox="-12 -12 24 24" width="'+(size||20)+'" height="'+(size||20)+'" style="color:'+(color||"#4f9e6b")+'" aria-hidden="true">'+d+'</svg>';
}

/* 已经进过小镇了：从房间里回来时不再重新问一次「开始」 */
if(S.entered){
  var _cv=document.getElementById("cover");
  if(_cv && _cv.parentNode) _cv.parentNode.removeChild(_cv);
  S.sound=S.sound!==false;
  setTimeout(function(){ if(S.sound) Sound.start(); }, 400);
} else {
  /* 老存档里有名字就不再问，直接开始 */
  if(kidName()){
    var _row=document.getElementById("nameRow");
    var _ask=document.getElementById("coverAsk");
    if(_row) _row.style.display="none";
    if(_ask) _ask.innerHTML="欢迎回来，" + kidName() + "！<br>今天想去哪里玩？";
  }
  var _inp=document.getElementById("heroName");
  if(_inp){
    if(kidName()) _inp.value=kidName();
    _inp.addEventListener("input", function(){
      var v=_inp.value.replace(/\s/g,"").slice(0,4);
      if(v!==_inp.value) _inp.value=v;
      var _t=document.getElementById("coverTitle");
      if(_t) _t.textContent = v ? v+"的小镇" : "我的小镇";
    });
    _inp.addEventListener("keydown", function(e){ if(e.key==="Enter") beginTown(); });
  }
}

/* 点「开始」：解锁音频 → 淡入音乐 → 语音欢迎（注意：不能叫 startGame，
   那是小游戏的开局函数，重名会把这里覆盖掉） */
function beginTown(){
  var cover=document.getElementById("cover");
  if(!cover) return;

  /* 第一次进来：把输入的名字记住（允许先不填，之后在「大人看这里」里补） */
  var inp = document.getElementById("heroName");
  var nm = inp ? inp.value.replace(/\s/g,"").slice(0,4) : "";
  if(nm && nm !== S.kidName){
    S.kidName = nm;
    var oldTown = townTitle();
    save();
    applyNames();
    refreshHomeSign();
    toast("这里是" + oldTown);
  }

  cover.classList.add("hide");
  cover.style.pointerEvents="none";
  cover.setAttribute("aria-hidden","true");
  setTimeout(function(){
    cover.style.display="none";
    if(cover.parentNode) cover.parentNode.removeChild(cover);
  },520);
  S.entered=true; save();
  S.sound=S.sound!==false;
  if(S.sound) Sound.start();
  Sound.blip("ok");
  setTimeout(function(){
    guide("欢迎来到" + townTitle() + "。用方向键或者摇杆，我们去找" + childCall() + "的家人吧。");
  },300);
  showTip("用方向键或左下摇杆走一走，走到房子门口点一下就能进屋");
}
