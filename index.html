<!DOCTYPE html>
<!--
  澄澄的小镇 · 3 岁向探索式益智游戏（v0.3）
  ---------------------------------------------------------------
  单文件、零依赖（无 CDN / 无框架 / 无外链图片 / 无外链音频）、原生 JS+CSS、localStorage 存进度、PC+移动自适应。
  音乐与语音说明：
    · 背景音乐《小镇的午后》由 Web Audio 实时合成（G 大调五声、4/4 拍分解和弦），不加载任何音频文件，因此断网也能响。
    · 引导语用浏览器内置的 speechSynthesis 中文语音朗读，无需联网下载语音包（是否可用取决于系统语音）。
  扩展示例：往 BUILDINGS 里加一条建筑数据 → 在 BUILDING_ART 里加一个造型 → 在 MINI 里加一个玩法函数。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dff0e4">
<link rel="icon" href="data:,">
<title>澄澄的小镇</title>
<style>
  :root{
    --bg:#dff0e4; --card:#fffdf8; --ink:#3f3a32; --muted:#7c8b80;
    --line:#e7e0d2; --accent:#4f9e6b; --accent-soft:#e6f4e8; --gold:#f0a832; --err:#d4705f;
    --shadow:0 6px 18px rgba(63,58,50,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{height:100%;min-height:100%}
  /* iPad 上 100% 有时不给高度，补一个 -webkit-fill-available 兜底 */
  @supports (-webkit-touch-callout:none){ html,body{min-height:-webkit-fill-available} }
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer;touch-action:manipulation}

  /* ================= 地图舞台 ================= */
  .stage{
    position:fixed;top:0;right:0;bottom:0;left:0;;overflow:hidden;touch-action:none;
    background:linear-gradient(180deg,#cfeacb,#bfe2b7);
  }
  .world{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;will-change:transform}
  .world svg.map{display:block;position:absolute;top:0;right:0;bottom:0;left:0;;width:100%;height:100%}

  /* 建筑 */
  .b{
    position:absolute;z-index:6;border:none;background:transparent;padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    transition:transform .18s ease;
  }
  .b svg{position:static;width:100%;height:auto;overflow:visible;filter:drop-shadow(0 6px 7px rgba(70,90,60,.15))}
  .b[data-active="1"]{transform:translateY(-5px) scale(1.04)}
  .b[data-active="1"] svg{filter:drop-shadow(0 0 9px rgba(255,214,120,.95)) drop-shadow(0 8px 9px rgba(70,90,60,.2))}
  .b .tag{
    position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);
    background:#fffdf8;border:2px solid #ece3d2;border-radius:999px;
    font-size:15px;line-height:1;padding:8px 13px;white-space:nowrap;color:#4a4438;
    box-shadow:0 3px 8px rgba(63,58,50,.12);letter-spacing:.5px;font-weight:600;
    z-index:3;
  }
  .b .badge{
    position:absolute;top:-14px;right:-8px;width:26px;height:26px;border-radius:13px;
    background:var(--gold);color:#fff;font-size:14px;line-height:22px;text-align:center;
    border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.18);display:grid;place-items:center;
  }

  #hero{position:absolute;z-index:9;pointer-events:none;width:64px;height:110px}
  #hero svg{width:100%;height:100%;overflow:visible}
  #hero .shadow{position:absolute;left:50%;bottom:1px;transform:translateX(-50%)}

  /* ================= 小镇居民 ================= */
  .folk{
    position:absolute;z-index:9;pointer-events:auto;cursor:pointer;
    width:48px;height:84px;padding:0;border:none;background:transparent;
    transition:transform .12s ease;
  }
  .folk svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 4px 6px rgba(60,80,55,.16))}
  .folk:active{filter:brightness(1.06)}
  /* 尺寸按性别微调：小狗矮一点，小孩高一点 */
  .folk.gen2{width:52px;height:84px}
  .folk.gen3{width:54px;height:92px}
  .folk.pop{animation:folkPop .5s cubic-bezier(.2,1.4,.5,1)}
  @keyframes folkPop{0%{opacity:0}60%{opacity:1}100%{opacity:1}}
  /* 手里牵着的气球 / 风筝 */
  .carry{position:absolute;pointer-events:none;z-index:11;width:30px;
    animation:carrySway 2.6s ease-in-out infinite}
  .carry svg{width:100%;height:auto;display:block;overflow:visible}
  .carry:after{
    content:"";position:absolute;left:50%;top:88%;width:1.4px;height:26px;
    background:linear-gradient(#c9bda4,#e0d6c0);transform:translateX(-50%);
  }
  @keyframes carrySway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  /* 能放飞的道具：热区比图大，碰到就能点着 */
  .carry.playable{pointer-events:auto;border:none;background:transparent;cursor:pointer;
    width:46px;height:52px;padding:8px;margin:-8px;
    filter:drop-shadow(0 3px 5px rgba(60,80,55,.2));transition:transform .15s}
  .carry.playable:hover{transform:scale(1.22) rotate(-4deg)}
  .carry.playable:active{transform:scale(1.32)}
  .carry.playable:before{content:"放";position:absolute;left:50%;bottom:-14px;transform:translateX(-50%);
    font-size:10px;line-height:1.4;color:#fffdf8;background:#8fbf6f;border-radius:8px;
    padding:1px 7px;opacity:0;transition:.18s;pointer-events:none;white-space:nowrap}
  .carry.playable:hover:before{opacity:1}

  /* 放飞的气球 / 泡泡 */
  .fly-layer{position:fixed;top:0;right:0;bottom:0;left:0;;z-index:48;pointer-events:none}
  .flyer{position:absolute;pointer-events:auto;transition:opacity .4s;will-change:transform}
  .flyer svg{display:block;overflow:visible}
  .flyer.bubble{cursor:pointer;border-radius:50%}
  .flyer.bubble.popping{animation:bubblePop .3s ease-out forwards}
  .fw-canvas{position:fixed;left:0;top:0;z-index:96;pointer-events:none;
    transition:opacity .5s ease}
  .fw-canvas.out{opacity:0}
  @keyframes bubblePop{
    0%{transform:scale(1);opacity:.9}
    100%{transform:scale(1.6);opacity:0}
  }
  .folk .fbubble{
    position:absolute;left:50%;top:-26px;transform:translateX(-50%);
    background:#fffdf8;border:1.6px solid #ece3d2;border-radius:12px;
    padding:4px 9px;font-size:11.5px;line-height:1.35;color:#4a4438;white-space:nowrap;
    box-shadow:0 4px 12px rgba(60,80,55,.14);z-index:3;
  }
  .folk .fbubble:after{
    content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%) rotate(45deg);
    width:8px;height:8px;background:#fffdf8;border-right:1.6px solid #ece3d2;border-bottom:1.6px solid #ece3d2;
  }
  .folk .fmood{
    position:absolute;left:50%;top:-14px;transform:translateX(-50%);
    font-size:12px;line-height:1;padding:2px 4px;border-radius:8px;
    background:#fffdf8;box-shadow:0 2px 6px rgba(60,80,55,.14);
    animation:bob 1.5s ease-in-out infinite;
  }
  .folk .fmood.sleepy{animation:none;opacity:.8}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-3px)}}
  .fheart{position:absolute;z-index:14;pointer-events:none;animation:floatUp 1.2s ease-out forwards}
  .fheart svg{width:22px;height:22px;display:block}
  @keyframes floatUp{
    0%{opacity:0;transform:translateY(0) scale(.6)}
    25%{opacity:1}
    100%{opacity:0;transform:translateY(-46px) scale(1.1)}
  }

  /* 送礼小窗 */
  .gift-box{
    position:fixed;top:0;right:0;bottom:0;left:0;;z-index:65;display:grid;place-items:center;
    background:rgba(45,52,45,.3);opacity:0;pointer-events:none;transition:.24s;
  }
  .gift-box.show{opacity:1;pointer-events:auto}
  .gb-in{
    background:#fffdf8;border-radius:22px;padding:20px 24px 14px;text-align:center;
    width:min(280px,84vw);box-shadow:0 18px 40px rgba(30,40,32,.24);
  }
  .gb-ico{display:flex;justify-content:center;margin-bottom:6px}
  .gb-in p{margin:0 0 14px;font-size:14px;color:#6b6152}
  .gb-yes{
    display:block;width:100%;border:none;border-radius:999px;padding:12px 0;
    background:#4f9e6b;color:#fff;font-size:15px;font-weight:700;letter-spacing:2px;
    cursor:pointer;font-family:inherit;
  }
  .gb-no{
    display:block;width:100%;margin-top:6px;border:none;background:transparent;
    color:#9aa89d;font-size:12.5px;padding:7px 0;cursor:pointer;font-family:inherit;
  }

  /* 商店 / 背包 */
  .shop-wallet{
    display:flex;align-items:center;gap:6px;justify-content:center;
    background:#fff8e6;border:1px solid #f0e2c8;border-radius:14px;padding:9px 12px;
    font-size:13px;color:#8a7a5c;margin-bottom:12px;
  }
  .shop-wallet b{font-size:17px;color:#e09a24}
  .shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .shop-cell{
    background:#fffdf8;border:1.5px solid #efe6d4;border-radius:16px;
    padding:9px 6px 8px;text-align:center;transition:.18s;
  }
  .shop-cell.poor{opacity:.5}
  .sc-ico{display:flex;justify-content:center;height:60px;align-items:center}
  .shop-cell b{display:block;font-size:12.5px;margin-top:2px}
  .sc-cost{display:flex;align-items:center;justify-content:center;gap:2px;font-size:12px;color:#a89170;margin:2px 0 6px}
  .sc-buy{
    width:100%;border:none;border-radius:999px;padding:6px 0;font-size:13px;font-weight:700;
    background:#4f9e6b;color:#fff;cursor:pointer;font-family:inherit;letter-spacing:1px;
  }
  .sc-buy:disabled{background:#ddd5c6;cursor:default}
  /* 商店分类标签 */
  .shop-tabs{display:flex;gap:6px;margin:10px 0 6px;flex-wrap:wrap}
  .shop-tab{
    flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;
    padding:8px 6px;border-radius:13px;border:1px solid var(--line);background:#fffdf8;
    font:inherit;font-size:12.5px;color:#7a7364;cursor:pointer;transition:transform .12s,background .15s,border-color .15s;
  }
  .shop-tab .tab-ico{display:flex;align-items:center}
  .shop-tab .tab-ico svg{width:20px;height:20px}
  .shop-tab.on{background:#eaf6ee;border-color:#8ec9a3;color:#3f7a55;font-weight:700}
  .shop-tab:active{transform:scale(.97)}
  .shop-cat-hint{font-size:11.5px;color:#9aa1bb;margin:2px 0 8px;text-align:center;line-height:1.5}
  .sc-tail{font-size:10.5px;color:#5aa86e;font-weight:700;margin:-2px 0 4px}
  /* ================= 做新朋友 ================= */
  .maker{display:flex;gap:14px;align-items:flex-start}
  .mk-left{flex:0 0 116px;display:flex;flex-direction:column;gap:6px}
  .mk-preview{
    width:100%;height:140px;border-radius:20px;border:2px dashed #e2d8c2;background:#fbf7ee;
    display:grid;place-items:end center;padding-bottom:8px;overflow:hidden;position:relative;
  }
  .mk-preview svg{width:92px;height:auto;display:block;overflow:visible}
  .mk-preview .tag{
    position:absolute;left:0;right:0;top:7px;text-align:center;font-size:11px;color:#a89a80;letter-spacing:1px;
  }
  .mk-dice{
    border:1.6px solid #e6dcc8;background:#fff;border-radius:13px;padding:8px 6px;font-size:13px;
    font-family:inherit;color:#6f7d74;white-space:nowrap;
  }
  .mk-dice:active{transform:scale(.97)}
  .mk-form{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:9px}
  #mkChoices{display:flex;flex-direction:column;gap:7px}
  .mk-lab{font-size:12px;color:#8a958c;letter-spacing:.5px;margin:2px 0 -3px}
  .mk-name{
    width:100%;box-sizing:border-box;border:1.6px solid #e6dcc8;border-radius:14px;background:#fff;
    padding:11px 13px;font-size:16px;font-family:inherit;color:var(--ink);letter-spacing:1px;
  }
  .mk-name:focus{outline:none;border-color:#9ed3a8;box-shadow:0 0 0 3px rgba(158,211,168,.22)}
  .mk-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .mk-dot{width:27px;height:27px;border-radius:50%;border:2px solid transparent;padding:0;
    box-shadow:0 2px 6px rgba(80,70,50,.14)}
  .mk-dot.on{border-color:#4f9e6b;transform:scale(1.1)}
  .mk-pick{border:1.6px solid #e6dcc8;background:#fff;border-radius:12px;padding:6px 9px;
    font-size:12.5px;font-family:inherit;color:var(--ink);display:inline-flex;align-items:center;gap:4px;
    white-space:nowrap}
  .mk-pick.on{background:#eaf6e6;border-color:#8ecb9a;color:#3f6b4c;font-weight:600}
  .mk-tip{font-size:12px;color:#a09580;line-height:1.6;margin-top:2px}

  .bag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .bag-cell{
    background:#fffdf8;border:1.5px solid #efe6d4;border-radius:16px;
    padding:10px 6px;text-align:center;
  }
  .bg-ico{display:flex;justify-content:center;height:58px;align-items:center}
  .bag-cell b{display:block;font-size:12.5px;margin-top:2px}
  .bag-cell span{font-size:11.5px;color:#a89170}
  .bg-play{
    margin-top:6px;width:100%;border:none;border-radius:10px;padding:6px 0;
    background:#eaf6e6;color:#3f6b4c;font-size:12px;font-weight:600;font-family:inherit;
  }
  .bg-play:active{transform:scale(.96)}

  /* 送礼面板：背包里的东西摊开来挑 */
  .gift-grid{grid-template-columns:repeat(3,1fr);gap:10px}
  .gift-cell{
    position:relative;font-family:inherit;cursor:pointer;transition:.15s;
    border-width:2px;border-color:#efe6d4;
  }
  .gift-cell:active{transform:scale(.95)}
  .gift-cell:hover{border-color:#bcd9b0;background:#fbfff9}
  .gift-cell.liked{border-color:#f6c9cf;background:#fffafa}
  .gift-cell .lk{
    position:absolute;right:7px;top:4px;font-style:normal;font-size:13px;color:#e4705f;
  }

  /* ================= HUD ================= */
  .hud{position:fixed;left:0;right:0;top:0;z-index:20;pointer-events:none;padding:14px 16px;
    display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
  .hud > *{pointer-events:auto}
  .brand{background:rgba(255,253,248,.94);border:1px solid #ece3d2;border-radius:16px;
    padding:8px 14px;box-shadow:var(--shadow);flex:0 0 auto}
  .brand h1{margin:0;font-size:17px;letter-spacing:2px;white-space:nowrap}
  .brand p{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:.5px;white-space:nowrap}
  .hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:1 1 auto;min-width:0}
  .pills{display:flex;gap:6px}
  .tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .pill span{background:rgba(255,253,248,.94);border:1px solid #ece3d2;border-radius:999px;
    padding:8px 12px;font-size:13px;box-shadow:var(--shadow);white-space:nowrap;
    display:flex;align-items:center;gap:4px}
  .tools button{width:42px;height:42px;border-radius:14px;border:1px solid #ece3d2;background:rgba(255,253,248,.95);
    box-shadow:var(--shadow);display:grid;place-items:center;padding:0;position:relative}
  .tools button:active{transform:scale(.94)}
  .tools button.off{opacity:.45}
  .tools button .ping{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:4px;background:#e0a92b}

  /* 摇杆 */
  .stick{position:fixed;z-index:20;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));
    width:122px;height:122px;border-radius:50%;
    background:rgba(255,253,248,.42);border:2px solid rgba(255,255,255,.7);
    -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);touch-action:none}
  .stick .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;background:rgba(255,253,248,.95);border:1px solid #e6ddc9;
    box-shadow:0 4px 10px rgba(63,58,50,.16)}
  .tipbar{position:fixed;z-index:19;left:50%;transform:translateX(calc(-50% + 70px));
    bottom:calc(18px + env(safe-area-inset-bottom));background:rgba(63,58,50,.88);color:#fff;
    padding:9px 15px;border-radius:20px;font-size:13px;white-space:normal;
    opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 190px);
    line-height:1.45;text-align:center}
  .tipbar.show{opacity:1}

  /* ================= 进屋提示 ================= */
  .enter-room{
    position:fixed;top:0;right:0;bottom:0;left:0;;z-index:60;display:grid;place-items:center;padding:20px;
    background:rgba(45,52,45,.34);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:.28s;
  }
  .enter-room.show{opacity:1;pointer-events:auto}
  .er-box{
    background:var(--card);border-radius:24px;padding:24px 26px 18px;text-align:center;
    width:min(320px,88vw);box-shadow:0 20px 44px rgba(30,40,32,.28);
    transform:translateY(10px) scale(.97);transition:.28s;
  }
  .enter-room.show .er-box{transform:none}
  .er-icon{
    width:60px;height:60px;border-radius:20px;background:var(--accent-soft);
    display:grid;place-items:center;margin:0 auto 10px;
  }
  .er-box h3{margin:0 0 6px;font-size:17px;letter-spacing:1px}
  .er-box p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.7}
  .er-go{
    display:block;width:100%;border:none;border-radius:999px;padding:14px 0;
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;letter-spacing:2px;
    cursor:pointer;font-family:inherit;box-shadow:0 8px 18px rgba(79,158,107,.32);
  }
  .er-go:active{transform:scale(.98)}
  .er-later{
    display:block;width:100%;margin-top:9px;border:none;background:transparent;
    color:#9aa89d;font-size:13px;padding:8px 0;cursor:pointer;font-family:inherit;
  }

  /* ================= 弹层 ================= */
  .mask{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:rgba(45,52,45,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:14px;
    opacity:0;pointer-events:none;transition:.22s}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{position:relative;width:100%;max-width:470px;max-height:min(90vh,780px);overflow:auto;
    overscroll-behavior:contain;background:var(--card);border-radius:26px;padding:18px 18px 16px;
    box-shadow:0 20px 50px rgba(0,0,0,.22);transform:translateY(14px) scale(.98);transition:.24s}
  .mask.show .sheet{transform:none}
  .sheet h2{margin:0 0 4px;font-size:20px;letter-spacing:1px;padding-right:46px}
  .sheet .sub{margin:0 0 12px;font-size:14px;color:#6f7d74;line-height:1.6;padding-right:4px}
  .sheet .close{position:absolute;right:12px;top:12px;width:34px;height:34px;flex:0 0 auto;
    padding:0;border-radius:12px;font-size:15px;line-height:1;background:#f4efe4;border:1px solid var(--line)}
  .row{display:flex;gap:8px}
  .btn{flex:1;border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 8px;
    font-size:15px;color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .btn.ghost{background:transparent}
  .btn:active{transform:scale(.98)}

  .stats{display:flex;justify-content:space-between;gap:8px;background:var(--accent-soft);
    border-radius:15px;padding:9px 14px;font-size:12px;margin-bottom:10px;color:#5d7a66}
  .stats b{font-size:16px;color:#3f6b4c}
  /* 难度那一格可以点，点一下换一档 */
  .statbtn{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
    border:none;background:transparent;padding:2px 6px;margin:-2px -6px;cursor:pointer;
    font:inherit;color:inherit;border-radius:10px;transition:.16s}
  .statbtn:active{background:rgba(255,255,255,.75);transform:scale(.97)}
  .statbtn b{font-size:16px;color:#3f6b4c}
  .statbtn:after{content:"点一下换难度";font-size:10px;color:#9aa89e;margin-top:1px}
  .statbtn b.bump{animation:bump .45s ease}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28);color:#e08a2c}100%{transform:scale(1)}}
  .board{width:100%;min-height:210px;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px}
  .board > *{width:100%}
  .board .hintline{font-size:13px;color:#8a958c;text-align:center;line-height:1.6;margin-top:2px}
  .note{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px}

  /* 通用大按钮格（种菜/浇水/摘果用） */
  .plots{display:grid;gap:10px;width:100%}
  .plot{position:relative;border-radius:18px;border:2px dashed #d9cfb9;background:#f7f2e6;
    display:grid;place-items:center;min-height:78px;transition:.16s;overflow:hidden}
  .plot.grown{border-style:solid;border-color:#a9d5ab;background:#eef8ea}
  .plot.wet{background:#e9f4fb;border-color:#a9cbe2}
  .plot:active{transform:scale(.97)}
  .plot .cap{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:11px;color:#a09580}

  /* 找一样 */
  .find{display:grid;gap:10px;width:100%}
  .find .card{height:96px;border-radius:18px;background:#fff;border:2px solid #ece3d2;
    display:grid;place-items:center;transition:.16s;padding:6px}
  .find .card .q{font-size:26px;font-weight:700;color:#c9c2ad;line-height:1}
  .find .card.mem.up,.find .card.pz.up{background:#f4f9f2;border-color:#bcd9b0}
  .find .card.peek{border-color:#f0a832;box-shadow:0 0 0 4px rgba(240,168,50,.35)}
  .find .card .sil{display:flex;justify-content:center;align-items:center;height:100%}
  .find .card .sil svg{filter:brightness(0);opacity:.42}
  /* 数一数 */
  .cnt-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;padding:12px;
    border-radius:18px;background:#f6f6fc;border:2px dashed #dbdcee;
    min-height:92px;align-items:center}
  .cnt-item{position:relative;width:50px;height:50px;border-radius:14px;
    border:2px solid #e6e6f2;background:#fff;display:grid;place-items:center;
    transition:.15s;padding:3px}
  .cnt-item.on{border-color:#9fb2ea;background:#eef1ff;transform:translateY(-2px)}
  .cnt-item b{position:absolute;right:-5px;top:-6px;min-width:19px;height:19px;
    border-radius:10px;background:#7a86c8;color:#fff;font-size:11px;line-height:19px;
    text-align:center;box-shadow:0 1px 4px rgba(60,60,110,.28);font-weight:700}
  .cnt-item.no{animation:shake .3s;border-color:#e8a0a0}
  .cnt-nums{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .cnt-num{width:56px;height:56px;border-radius:16px;border:2px solid #e3ddd0;background:#fff;
    font-size:24px;font-weight:800;color:#5a6a8f;display:grid;place-items:center;transition:.15s}
  .cnt-num:active{transform:scale(.95)}
  .cnt-num.yes{border-color:#8fce9a;background:#eef9ec;animation:pop .35s}
  .cnt-num.no{animation:shake .3s;border-color:#e8a0a0}
  /* 院子拼图 */
  .pzwrap{display:flex;justify-content:center;margin:6px 0 4px}
  .pzboard{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;
    width:min(240px,68vw);padding:8px;border-radius:20px;
    background:#f7f2e6;border:2px dashed #d9cfb9}
  .pzcell{height:88px;border-radius:14px;border:2px solid #ece3d2;background:#fffdf8;
    display:grid;place-items:center;transition:.16s;padding:4px;cursor:default}
  .pzcell .q{font-size:24px;font-weight:700;color:#d5cdb8}
  .pzcell.ready{cursor:pointer;border-color:#bcd9b0}
  .pzcell.ready:active{transform:scale(.97)}
  .pzcell.on{background:#f4f9f2;border-color:#bcd9b0}
  .pzcell.no{animation:shake .3s;border-color:#e8a0a0}
  .pztraytip{font-size:12px;color:#a8a294;text-align:center;margin:10px 0 4px}
  .pztray{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
  .pzpiece{width:60px;height:60px;border-radius:14px;border:2px solid #ece3d2;
    background:#fff;display:grid;place-items:center;transition:.16s;padding:4px}
  .pzpiece.sel{border-color:#f0a832;background:#fff8ea;
    box-shadow:0 0 0 4px rgba(240,168,50,.28);transform:translateY(-3px)}
  .find .card:active{transform:scale(.96)}
  .find .card.yes{border-color:#8fce9a;background:#eef9ec;animation:pop .35s}
  .find .card.no{animation:shake .3s}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  /* 路上一族（路径引导/走格子） */
  .trail-wrap{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
  .map-grid{display:grid;gap:5px;width:100%;background:#eef6ec;padding:8px;border-radius:18px}
  .tg{aspect-ratio:1/1;border-radius:11px;background:#eef2ea;border:2px solid #e4eade;display:grid;place-items:center;min-height:34px;padding:2px;box-sizing:border-box}
  .tg.block{background:#cfe0cb;border-color:#bdd3b8}
  .tg.path{background:#fdf0cf;border-color:#f3deab}
  .tg.hole{background:#fffdf4;border:3px dashed #f0a832;animation:pulsehold 1.4s infinite}
  @keyframes pulsehold{0%,100%{border-color:#f0a832;background:#fffdf4}50%{border-color:#ffc952;background:#fff8e2}}
  .tg.target{background:#fff7dd;border-color:#f0c25a;box-shadow:0 0 0 3px rgba(240,194,90,.35)}
  .tg.me{box-shadow:inset 0 0 0 3px #f0a832}
  .tg.next{animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{box-shadow:inset 0 0 0 2px rgba(240,168,50,.3)}50%{box-shadow:inset 0 0 0 3px rgba(240,168,50,.95)}}

  /* 排序 */
  .sortrow{display:flex;gap:10px;justify-content:center;align-items:flex-end;width:100%}
  .sortrow .sitem{border-radius:18px;background:#fff;border:2px solid #ece3d2;display:flex;
    justify-content:center;transition:.16s;padding:6px 0;overflow:hidden}
  .sortrow .sitem.no{border-color:#f0a0a0;background:#fdf0f0}
  .sortrow .sitem.on{border-color:#8fce9a;background:#eef9ec}
  .sortqueue{display:flex;gap:10px;justify-content:center;width:100%;margin-top:6px}
  .qcell{width:88px;height:118px;border-radius:18px;border:2px dashed #d9cfb9;background:#faf7ef;
    display:flex;align-items:flex-end;justify-content:center;padding:6px 0;position:relative;overflow:hidden}
  .qcell.filled{border-style:solid;border-color:#bfe0c4;background:#f3fbf2}
  .qnum{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#c9bfa9;font-size:20px;font-weight:700}
  .ruler{display:flex;align-items:center;gap:8px;justify-content:center;margin:8px 0 2px;
    font-size:11px;color:#9aa89d}
  .ruler i{display:block;width:120px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,#cfe6d2,#7fbf6f)}

  /* 分类列表 */
  .list{display:grid;gap:8px}
  .li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:15px;
    padding:10px 12px;background:#fff}
  .li .ic{width:44px;height:44px;border-radius:13px;background:#eef7ee;display:grid;place-items:center;flex:0 0 auto}
  .li .tx{flex:1;min-width:0}
  .li .tx b{font-size:14px}
  .li .tx p{margin:2px 0 0;font-size:11px;color:var(--muted);line-height:1.45}
  .li .go{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-size:13px}
  .li.locked{opacity:.62}

  .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);opacity:0;
    background:rgba(58,53,44,.94);color:#fff;padding:16px 24px;border-radius:18px;font-size:15px;
    transition:.24s;pointer-events:none;z-index:60;text-align:center;line-height:1.5;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .kv:last-child{border:none}
  .kv span:first-child{color:var(--muted);flex:0 0 auto}
  .kv span:last-child{text-align:right}
  .sndbtn{border:1px solid #e3dcc9;background:#fff;border-radius:10px;padding:4px 9px;font-size:12px;
    font-weight:700;color:#a9a293;cursor:pointer;font-family:inherit;line-height:1.5}
  .sndbtn.on{background:#e8f2ea;border-color:#8fd0a4;color:#3f7a55}
  .sndbtn:active{transform:translateY(1px)}

  /* 开场封面 */
  .cover{position:fixed;top:0;right:0;bottom:0;left:0;;z-index:70;display:grid;place-items:center;padding:20px;
    background:radial-gradient(circle at 50% 30%, #eaf7e6, #c6e3bf 70%);transition:.5s}
  .cover.hide{opacity:0 !important;pointer-events:none !important;visibility:hidden}
  .cover .box{text-align:center;max-width:380px}
  .cover h1{font-size:30px;letter-spacing:4px;margin:14px 0 6px}
  .cover p{margin:0 0 18px;font-size:14px;color:#6b7d70;line-height:1.7}
  .cover .go{border:none;background:#4f9e6b;color:#fff;font-size:18px;font-weight:700;
    padding:16px 46px;border-radius:999px;box-shadow:0 10px 22px rgba(79,158,107,.35);letter-spacing:2px}
  .cover .go:active{transform:scale(.97)}
  .name-row{margin:0 auto 14px;max-width:240px}
  .name-row input{
    width:100%;box-sizing:border-box;text-align:center;font-family:inherit;
    font-size:20px;letter-spacing:4px;padding:12px 14px;border-radius:16px;
    border:2px solid #d7e6d4;background:#fffdf8;color:#3f4a3f;outline:none;
  }
  .name-row input:focus{border-color:#7cc08c;box-shadow:0 0 0 4px rgba(124,192,140,.18)}
  .name-row input::placeholder{letter-spacing:2px;color:#b3c0b4;font-size:17px}
  .cover .small{margin-top:14px;font-size:11px;color:#8b9c90}

  /* 手机：品牌名一行，按钮收成两行小方块，星星和按钮同一行 */
  @media (max-width:520px){
    .hud{padding:8px 10px;gap:5px;flex-wrap:wrap}
    .brand{padding:5px 9px;border-radius:12px}
    .brand h1{font-size:13px;letter-spacing:.5px}
    .brand p{display:none}
    .hud-right{gap:5px;flex-direction:row;align-items:center;justify-content:space-between;flex:1 1 auto;min-width:0}
    .pills{order:1;flex:0 1 auto;min-width:0}
    .tools{order:2;gap:5px;flex:0 1 auto;justify-content:flex-end;flex-wrap:wrap}
    .tools button{width:32px;height:32px;border-radius:10px}
    .tools button svg{width:17px;height:17px}
    .pill span{padding:4px 7px;font-size:11.5px;border-radius:999px;gap:3px}
    .pill span svg{width:12px;height:12px}
    .tipbar{font-size:11px;bottom:calc(8px + env(safe-area-inset-bottom));
      max-width:calc(100vw - 140px);left:auto;right:8px;transform:none;border-radius:12px;padding:7px 10px}
    .sheet{padding:16px 14px 14px;border-radius:22px}
    .plot{min-height:70px}
    #speech{max-width:calc(100vw - 24px)!important;font-size:12.5px!important;
      padding:8px 12px!important;top:calc(92px + env(safe-area-inset-top))!important;
      border-radius:13px!important;line-height:1.45!important;border-width:1.5px!important}
    .bag-grid{grid-template-columns:repeat(3,1fr)}
  }
  @media (max-width:520px){
    .maker{flex-direction:column;gap:10px}
    .mk-preview{flex:0 0 auto;width:100%;height:104px}
    .mk-preview svg{width:76px}
    .row{flex-wrap:wrap}
  }
  @media (max-width:380px){
    .stick{width:104px;height:104px}
    .stick .knob{width:46px;height:46px;margin:-23px 0 0 -23px}
    .tipbar{max-width:calc(100vw - 124px);font-size:10.5px}
  }

  /* ================= 平板（iPad 2019 等，短边 ≥600）=================
     手机那一套收得太狠，平板又比电脑小，单独给一档：
     字大一点、按钮大一圈、面板宽一点，手指点得准、眼睛看着舒服 */
  @media (min-width:641px) and (max-width:1200px){
    .hud{padding:12px 16px;gap:10px}
    .brand{padding:8px 15px;border-radius:15px}
    .brand h1{font-size:19px;letter-spacing:1px}
    .brand p{font-size:11.5px}
    .tools{gap:8px}
    .tools button{width:46px;height:46px;border-radius:14px}
    .tools button svg{width:22px;height:22px}
    .pill span{padding:7px 13px;font-size:14px;border-radius:999px}
    .pill span svg{width:14px;height:14px}
    .sheet{max-width:540px;padding:22px 20px 18px;border-radius:26px;max-height:88vh}
    .sheet h2{font-size:21px}
    .sheet .sub{font-size:14px}
    .board{min-height:250px}
    .plot{min-height:96px}
    .find{gap:12px}
    .find .card{height:112px;border-radius:20px}
    .find .card .q{font-size:30px}
    .btn{padding:12px 20px;font-size:15px;border-radius:15px}
    .tipbar{font-size:14px;bottom:18px;padding:9px 16px;border-radius:14px}
    .note{font-size:13px}
    .statbtn b,.stats b{font-size:18px}
    .stick{width:132px;height:132px;left:20px;bottom:calc(20px + env(safe-area-inset-bottom))}
    .stick .knob{width:58px;height:58px;margin:-29px 0 0 -29px}
    .name-row input{font-size:22px;padding:14px 18px}
    .cover h1{font-size:30px}
    .cover .go{font-size:19px;padding:14px 44px}
    .pzboard{width:min(300px,56vw)}
    .pzcell{height:104px}
    .bag-grid{grid-template-columns:repeat(4,1fr)}
  }
  /* 平板竖着拿：面板别贴边，留出呼吸 */
  @media (min-width:641px) and (max-width:1200px) and (max-aspect-ratio:1/1){
    .sheet{max-width:600px}
    .find .card{height:104px}
  }
</style>

<div class="stage" id="stage">

  </div>
</div>

<div class="hud">

</div>

<div class="stick" id="stick"><div class="knob" id="knob"></div></div>

</div>

var Voice = CC.Voice;
var VOICE_CHAR = CC.VOICE_CHAR;

/* 统一播报：文字气泡 + 语音，一处调用 */
function guide(text,opts){
  if(text) showSpeech(text);
  Voice.say(text,opts);
}
/* 说话气泡（贴在画面上方，给大人看也给小孩看） */
var speechTimer=null;
/* 手机上是两行 HUD，气泡要落在它下面，不然会盖住按钮 */
function speechTop(){
  var hud=document.querySelector(".hud");
  var h=hud?Math.round(hud.getBoundingClientRect().bottom):78;
  return Math.max(78,h+8);
}
function showSpeech(text,ms){
  var el=document.getElementById("speech");
  if(!el){
    el=document.createElement("div");
    el.id="speech";
    el.style.cssText="position:fixed;z-index:35;left:50%;top:78px;transform:translateX(-50%);"+
      "max-width:min(560px,88vw);background:rgba(255,253,248,.97);border:2px solid #f0e2c8;"+
      "border-radius:18px;padding:12px 18px;font-size:15px;color:#4a4438;line-height:1.55;"+
      "box-shadow:0 10px 24px rgba(63,58,50,.18);opacity:0;transition:.3s;pointer-events:none;text-align:center";
    document.body.appendChild(el);
  }
  el.style.top=speechTop()+"px";
  el.textContent=text;
  el.style.opacity="1";
  el.style.transform="translateX(-50%) translateY(0)";
  clearTimeout(speechTimer);
  speechTimer=setTimeout(function(){ el.style.opacity="0"; }, ms||3800);
}

/* 点一下才允许出声（浏览器策略） */
function unlockAudio(){
  Sound.start();
  document.removeEventListener("pointerdown",unlockAudio);
  document.removeEventListener("keydown",unlockAudio);
}
document.addEventListener("pointerdown",unlockAudio);
document.addEventListener("keydown",unlockAudio);

function toggleSound(){
  /* 孩子只需要「有声音 / 没声音」；分项开关在「给大人看」里 */
  var anyOn = audioOn("music") || audioOn("voice") || audioOn("sfx");
  S.music = anyOn ? false : true;
  S.voice = anyOn ? false : true;
  S.sfx   = anyOn ? false : true;
  S.sound = S.music;
  save(); paintSoundBtn();
  if(S.music){ Sound.start(); toast("声音打开啦"); }
  else { Sound.stop(); Voice.stop(); toast("先安静一会儿"); }
}
function paintSoundBtn(){
  var btn=document.getElementById("btnSound");
  if(!btn) return;
  var anyOn = audioOn("music") || audioOn("voice") || audioOn("sfx");
  btn.classList.toggle("off",!anyOn);
}

var stage=document.getElementById("stage"), world=document.getElementById("world");
var heroEl=document.getElementById("hero"), mapSvg=document.getElementById("mapSvg");
var M={scale:1};
function viewW(){ return window.innerWidth; }
function viewH(){ return window.innerHeight; }

function resize(){
  var vw=viewW(), vh=viewH(), s;
  /* 短边 ≥600 的是平板：竖着拿时别把画面放得太大，看得到半个小镇才好玩 */
  var shortSide=Math.min(vw,vh);
  if(vw>=vh) s = Math.max(vw/W*0.985, vh/H*0.985);  // 电脑/横屏：整镇入画
  else s = vw/(shortSide>=600?940:660);             // 竖屏：手机约 660、平板约 940 世界单位宽
  s=Math.min(s,1.6);
  M.scale=s;
  world.style.width=W+"px"; world.style.height=H+"px";
  var c=camTarget(); cam.x=c.x; cam.y=c.y;
  world.style.transform="translate("+cam.x+"px,"+cam.y+"px) scale("+s+")";
  drawHero();
}
window.addEventListener("resize",resize);
/* iPad 转屏时 Safari 报的尺寸偶尔还是旧的，晚一点再量一次 */
window.addEventListener("orientationchange",function(){
  setTimeout(resize,120); setTimeout(resize,420);
});
if(window.visualViewport){
  window.visualViewport.addEventListener("resize",function(){ setTimeout(resize,80); });
}

var NS="http://www.w3.org/2000/svg";
function E(name,attrs,parent){
  var e=document.createElementNS(NS,name);
  for(var k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}

/* ---------- 地图底图 ---------- */
function tree(x,y,s){
  var g=E("g",{transform:"translate("+x+","+y+") scale("+s+")"});
  E("rect",{x:-5,y:-8,width:10,height:26,rx:4,fill:"#a9784f"},g);
  E("circle",{cx:0,cy:-26,r:26,fill:"#8ec97e"},g);
  E("circle",{cx:-16,cy:-14,r:18,fill:"#7fb96f"},g);
  E("circle",{cx:16,cy:-14,r:18,fill:"#9ad689"},g);
  E("circle",{cx:0,cy:-34,r:15,fill:"#a8e096",opacity:".8"},g);
  return g;
}
function bush(x,y,s,fill){
  var g=E("g",{transform:"translate("+x+","+y+") scale("+s+")"});
  E("circle",{cx:0,cy:0,r:16,fill:fill||"#8dc97f"},g);
  E("circle",{cx:14,cy:4,r:12,fill:fill||"#8dc97f"},g);
  E("circle",{cx:-14,cy:4,r:12,fill:fill||"#8dc97f"},g);
  return g;
}
function flower(x,y,c){
  var g=E("g",{transform:"translate("+x+","+y+")"});
  for(var i=0;i<5;i++){
    var a=i/5*Math.PI*2;
    E("circle",{cx:(Math.cos(a)*3.6).toFixed(2),cy:(Math.sin(a)*3.6).toFixed(2),r:3,fill:c},g);
  }
  E("circle",{cx:0,cy:0,r:2.2,fill:"#ffe9a8"},g);
  return g;
}

function el(n,a){ return E(n,a); }

/* 通用零件 */
function gWindows(g,x,y,w,h,n){
  var gap=(w-n*22)/(n+1);
  for(var i=0;i<n;i++){
    var wx=x+gap+i*(22+gap);
    E("rect",{x:wx,y:y,width:22,height:h,rx:7,fill:"#cfeaf6"},g);
    E("rect",{x:wx-2,y:y-2,width:26,height:h+4,rx:8,fill:"none",stroke:"#fff","stroke-width":"3",opacity:".9"},g);
    E("line",{x1:wx+11,y1:y,x2:wx+11,y2:y+h,stroke:"#fff","stroke-width":"2.4"},g);
  }
}
function gDoor(g,cx,by,w,h,col){
  E("rect",{x:cx-w/2,y:by-h,width:w,height:h,rx:w/2.6,fill:col||"#a9784f"},g);
  E("rect",{x:cx-w/2+4,y:by-h+5,width:5,height:h*0.32,rx:2.5,fill:"rgba(255,255,255,.4)"},g);
  E("circle",{cx:cx+w/2-6,cy:by-h/2+2,r:2.4,fill:"#f6e6c8"},g);
  E("rect",{x:cx-w/2-8,y:by,width:w+16,height:7,rx:3.5,fill:"#e6dcc8"},g);
}
function gSign(g,cx,cy,w,h,fill,text){
  E("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:h/2,fill:fill||"#fffdf8",
    stroke:"rgba(0,0,0,.08)","stroke-width":"2"},g);
  if(text){
    var t=E("text",{x:cx,y:cy+1,"text-anchor":"middle","dominant-baseline":"central",
      "font-size":"12","font-family":"-apple-system,'PingFang SC','Microsoft YaHei',sans-serif",
      "font-weight":"700",fill:"#6b5a45"},g);
    t.textContent=text;
  }
}

var keys={};
document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(["arrowup","arrowdown","arrowleft","arrowright","w","a","s","d"].indexOf(k)>=0){ keys[k]=true; e.preventDefault(); }
  if(k==="escape") closeSheet();
});
document.addEventListener("keyup",function(e){ keys[e.key.toLowerCase()]=false; });

var stick=document.getElementById("stick"), knob=document.getElementById("knob");
var stickVec={x:0,y:0}, stickId=null;
function stickStart(e){ stickId=e.pointerId; try{stick.setPointerCapture(stickId);}catch(err){} stickMove(e); }
function stickMove(e){
  if(stickId===null) return;
  var r=stick.getBoundingClientRect();
  var dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2);
  var len=Math.hypot(dx,dy), max=r.width/2-12;
  if(len>max){ dx=dx/len*max; dy=dy/len*max; }
  knob.style.transform="translate("+dx+"px,"+dy+"px)";
  stickVec.x=dx/max; stickVec.y=dy/max;
}
function stickEnd(){ stickId=null; stickVec.x=0; stickVec.y=0; knob.style.transform="translate(0,0)"; }
stick.addEventListener("pointerdown",stickStart);
stick.addEventListener("pointermove",stickMove);
stick.addEventListener("pointerup",stickEnd);
stick.addEventListener("pointercancel",stickEnd);

var walkTo=null;
stage.addEventListener("pointerdown",function(e){
  if(e.target.closest(".b")) return;
  if(document.getElementById("cover") && !document.getElementById("cover").classList.contains("hide")) return;
  var r=world.getBoundingClientRect();
  walkTo={ x:(e.clientX-r.left)/M.scale, y:(e.clientY-r.top)/M.scale };
});

function blocked(x,y){
  for(var i=0;i<BUILDINGS.length;i++){
    var b=BUILDINGS[i];
    if(x>b.x-b.w/2+14 && x<b.x+b.w/2-14 && y>b.y+b.h/2-26 && y<b.y+b.h/2+14) return true;
  }
  return false;
}
function clampX(x){ return Math.max(24,Math.min(W-24,x)); }
function clampY(y){ return Math.max(70,Math.min(H-14,y)); }

var lastT=0;
function loop(t){
  var dt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;
  var speed=330, vx=0, vy=0;
  if(keys["arrowleft"]||keys["a"]) vx-=1;
  if(keys["arrowright"]||keys["d"]) vx+=1;
  if(keys["arrowup"]||keys["w"]) vy-=1;
  if(keys["arrowdown"]||keys["s"]) vy+=1;
  vx+=stickVec.x; vy+=stickVec.y;
  var len=Math.hypot(vx,vy);
  if(len>1){ vx/=len; vy/=len; len=1; }
  var inputActive=len>0.18;          /* 真的有人在按方向键 / 推摇杆 */

  var moving=false;
  if(len>0.08){
    var nx=clampX(heroPose.x+vx*speed*dt), ny=clampY(heroPose.y+vy*speed*dt);
    if(!blocked(nx,heroPose.y)) heroPose.x=nx;
    if(!blocked(heroPose.x,ny)) heroPose.y=ny;
    if(Math.abs(vx)>0.1) heroPose.face=vx>0?1:-1;
    moving=true;
    /* 只有键盘/摇杆真有输入时才取消点地走路，
       否则摇杆松手后的残值会把点地走路一直清掉 */
    if(inputActive) walkTo=null;
  }
  if(walkTo){
    var dx=walkTo.x-heroPose.x, dy=walkTo.y-heroPose.y, d=Math.hypot(dx,dy);
    if(d>8){
      var st=Math.min(speed*dt,d);
      var stepX=dx/d*st, stepY=dy/d*st;
      var mx=clampX(heroPose.x+stepX), my=clampY(heroPose.y+stepY);
      var okX=!blocked(mx,heroPose.y), okY=!blocked(heroPose.x,my);
      if(okX) heroPose.x=mx;
      if(okY) heroPose.y=my;
      if(Math.abs(dx)>2) heroPose.face=dx>0?1:-1;
      if(!okX && !okY){
        /* 两个方向都堵住了：绕一下，先把能走的方向走完 */
        var slipA=clampX(heroPose.x+Math.sign(dx)*st), slipB=clampY(heroPose.y+Math.sign(dy)*st);
        if(!blocked(slipA,heroPose.y)) heroPose.x=slipA;
        else if(!blocked(heroPose.x,slipB)) heroPose.y=slipB;
        else walkTo=null;              /* 彻底堵死，停下 */
      }
      moving=true;
    } else walkTo=null;
  }
  /* 朝向(scaleX) 必须和走路/呼吸的位移写在同一行，
     否则会被后面的赋值覆盖掉，人转身就走形了 */
  var faceT="scaleX("+heroPose.face+") ";
  if(moving){
    heroPose.walk+=dt*11;
    heroInner.style.transform=faceT+"translateY("+(Math.sin(heroPose.walk)*2).toFixed(2)+"px) rotate("+(Math.sin(heroPose.walk)*1.6).toFixed(2)+"deg)";
  } else {
    heroInner.style.transform=faceT+"translateY("+(Math.sin(Date.now()/900)*0.9).toFixed(2)+"px)";
  }
  if(moving){ S.hero.x=heroPose.x; S.hero.y=heroPose.y; saveThrottled(); }
  drawHero(); stepFolk(dt); stepPendingFolk(); stepPets(dt); stepCarry(); stepFly(dt);
  updateCamera(dt); updateNearest();
  requestAnimationFrame(loop);
}

var cam={x:0,y:0};
function camTarget(){
  var s=M.scale, vw=viewW(), vh=viewH();
  var tx=vw/2-heroPose.x*s;
  var ty=vh*0.52-heroPose.y*s;
  var minX=vw-W*s, minY=vh-H*s;
  if(minX>=0) tx=minX/2; else tx=Math.max(minX,Math.min(0,tx));
  if(vh>H*s) ty=(vh-H*s)/2; else ty=Math.max(minY,Math.min(0,ty));
  return {x:tx,y:ty};
}
function updateCamera(dt){
  var t=camTarget(), k=Math.min(1,dt*5);
  cam.x+=(t.x-cam.x)*k; cam.y+=(t.y-cam.y)*k;
  world.style.transform="translate("+cam.x+"px,"+cam.y+"px) scale("+M.scale+")";
}
var saveT=0;
function saveThrottled(){ var n=Date.now(); if(n-saveT>900){ saveT=n; save(); } }

var nearId=null, nearSaid=0;
function nearest(){
  var best=null, bd=1e9;
  BUILDINGS.forEach(function(b){
    var bx=b.x, by=b.y+b.h/2-6;
    var d=Math.hypot(heroPose.x-bx,heroPose.y-by);
    var inDoor=Math.abs(heroPose.x-b.x)<b.w/2+30 && Math.abs(heroPose.y-(b.y+b.h/2+8))<72;
    var score=inDoor?d*0.5:d;
    if(score<bd){ bd=score; best=b; }
  });
  return (best&&bd<190)?best:null;
}
function updateNearest(){
  var n=nearest(), id=n?n.id:null;
  if(id===nearId) return;
  nearId=id;
  BUILDINGS.forEach(function(b){ b.el.dataset.active=(b.id===id)?"1":"0"; });
  if(n){
    showTip("到「"+bLabel(n)+"」门口了 · 点一下进去");
    /* 每 12 秒才念一次，避免吵闹 */
    if(Date.now()-nearSaid>12000){ nearSaid=Date.now(); }
  } else hideTip();
}

var curBuilding=null, curGame=null, hintsLeft=3;

function enter(id){
  var b=BUILDINGS.filter(function(x){return x.id===id})[0];

  /* 超市是个能逛的房间，进去直接逛，不用先做题 */

      '<div>提示<br><b id="gHint">3</b></div>'+
    '</div>'+
    '<div class="board" id="gBoard"></div>'+

  );

function diffName(){ return {easy:"小班",mid:"中班",hard:"大班"}[S.diff]||"中班"; }
var DIFF_ORDER=["easy","mid","hard"];

/* 提一档难度；已经到「大班」就停在那儿，回头再来 */
function stepDiff(){
  var i=DIFF_ORDER.indexOf(S.diff);
  if(i<0) i=1;
  if(i>=DIFF_ORDER.length-1) return false;      /* 已经最高 */
  S.diff=DIFF_ORDER[i+1]; save();
  return true;
}
function syncDiffLabel(){
  var e=document.getElementById("gDiff");
  if(e){
    e.textContent=diffName();
    e.classList.remove("bump");
    void e.offsetWidth;                          /* 强制重排，动画能重播 */
    e.classList.add("bump");
  }
}
function switchDiff(){
  var i=DIFF_ORDER.indexOf(S.diff);
  if(i<0) i=1;
  S.diff=DIFF_ORDER[(i+1)%DIFF_ORDER.length]; save();
  syncDiffLabel();
  startGame(curBuilding?curBuilding.game:"");
  toast("换成「"+diffName()+"」了");
  guide("现在是"+diffName()+"的，试试看。");
}

/* 「再玩一次」= 换一种难度（升一档，到顶就停在最高档重来） */
function restartGame(){
  if(!curBuilding) return;
  var up=stepDiff();
  startGame(curBuilding.game);
  syncDiffLabel();
  if(up){
    toast("换成「"+diffName()+"」了");
    guide("这次换"+diffName()+"的，我们再玩一次。");
  }else{
    toast(diffName()+"最难啦，再玩一次");
    guide("已经是最难的"+diffName()+"了，再来一次吧。");
  }
}
function hintGame(){
  if(!curGame||!curGame.hint){ toast("这里点一下就好啦"); return; }
  if(hintsLeft<=0){ toast("先自己试试看～"); guide("先自己试试看。"); return; }
  hintsLeft--;
  var e=document.getElementById("gHint"); if(e) e.textContent=hintsLeft;
  curGame.hint();
}
function startGame(name){
  curGame=null; hintsLeft=3; gameDone=false;
  /* 没有关卡面板就现搭一个（超市是直接进房间的，单独测关卡时才走这条路） */
  if(!boardEl()){
    openSheet('<h2>'+(curBuilding?bLabel(curBuilding):"小任务")+'</h2>'+
      '<p class="sub">'+(curBuilding?curBuilding.inside:"")+'</p>'+
      '<div class="stats">'+
        '<div>难度<br><b id="gDiff">'+diffName()+'</b></div>'+
        '<div>进度<br><b id="gScore">0</b></div>'+
        '<div>提示<br><b id="gHint">3</b></div>'+
      '</div>'+
      '<div class="board" id="gBoard"></div>'+
      '<div class="row" style="margin-top:12px">'+
        '<button class="btn" onclick="restartGame()" id="againBtn">再玩一次</button>'+
        '<button class="btn primary" onclick="hintGame()">帮帮我</button>'+
      '</div>');
  }
  var g=boardEl(); if(g) g.innerHTML="";
  var h=document.getElementById("gHint"); if(h) h.textContent="3";
  var s=document.getElementById("gScore"); if(s) s.textContent="0";
  var f=MINI[name];
  if(f) curGame=f();
}
function paintScore(v,total){
  var s=document.getElementById("gScore");

}

function againLabel(){

  if(i>=DIFF_ORDER.length-1) return "再玩一次";

}
/* 通关一次：花朵记录 + 星星 + 语音鼓励 */
var gameDone=false;                 /* 本局是否已通关，拦住重复结算 */
function finish(say){
  if(gameDone) return;
  gameDone=true;
  var b=curBuilding;
  var firstTime = b && !S.cleared[b.id];
  if(b){ S.cleared[b.id]=(S.cleared[b.id]||0)+1; S.flowers[b.id]=true; }
  /* 第一次玩一个地方给 3 颗，够买最便宜的东西；重复玩给 1 颗 */
  addStars(firstTime ? 3 : 1);
  paintHud();
  Sound.blip("good");
  if(say) guide(say);
  var again=document.getElementById("againBtn");
  if(again) again.textContent=againLabel();
  /* 做完这里的任务，问一句要不要进屋看看 */
  setTimeout(function(){ showEnterRoom(b); }, 1400);
}

/* =====================================================================
   8.5 小镇居民：三个小朋友 + 一只小狗，各有自己的日子
   ---------------------------------------------------------------------
   · 各自在街上慢慢走，会停下来做小动作（看花、跳一下、打哈欠、追蝴蝶）
   · 有心情：开心 / 饿了 / 困了 / 想玩。饿了头上冒小餐具，走过去点它就能喂
   · 玩家靠近会转头看你；点它会说话、给东西它会开心跳
   · 两个居民碰到一起会打招呼、并肩走一段；小狗会跟着澄澄跑
   全部存在 localStorage，刷新后位置和心情都还在
   ===================================================================== */
var FOLK = [
  { id:"doudou", name:"豆豆", kind:"boy",   spd:52,  home:{x:470,y:700}, like:"bread", talks:[
      "我在找小石头，你看这颗圆不圆？",
      "刚才有一只蝴蝶，从我鼻子前面飞过去啦。",
      "我跑得可快了，你追不上我。",
      "你饿不饿？我有一点饿。"
    ], hungry:["我肚子咕咕叫了。","有点饿，想吃面包。"] },

  { id:"duoduo", name:"朵朵", kind:"girl2", spd:44,  home:{x:1010,y:700}, like:"candy", talks:[
      "我在数地上的格子，一共好多好多。",
      "等会儿我想去公园看大树。",
      "你裙子上有花，真好看。",
      "我们慢慢走，不用着急。"
    ], hungry:["肚子空空的。","我想吃甜甜的东西。"] },

  { id:"afu", name:"阿福", kind:"dog", spd:78, home:{x:620,y:640}, like:"bread", talks:[
      "汪！",
      "汪汪！（它把尾巴摇成了一朵花）",
      "呜——（它把头搁在你手上）",
      "汪！汪！（好像有什么在那边）"
    ], hungry:["呜……（它盯着你的口袋）","汪……（肚子叫了）"] }
];

/* 每只居民的运行时状态（不直接进存档，存档是精简版） */
var folkState = [];
/* 自己做的小朋友的配色，配色变了画图就跟着变 */
/* 自己做的小朋友存在这里（和上面三个固定居民合起来才是全部居民） */
var MYFOLK = [];

/* 从存档里读回自己做的小朋友 */
function loadMyFolk(){
  MYFOLK = (S.myfolk || []).map(function(u){
    return {
      id: u.id,
      name: u.name,
      kind: "kid",
      gen: 1,
      look: u.look || randomLook(),
      lookId: u.id,
      spd: 46 + (u.id.length % 5) * 3,
      home: u.home || { x: 520, y: 700 },
      like: u.like || "apple",
      carry: u.carry || null,
      talks: u.talks || KID_TALKS.slice(),
      hungry: u.hungry || KID_HUNGRY.slice(),
      gone: u.gone ? 1 : 0
    };
  });
}
var LOOK_SKIN = ["#f6d9c2", "#eec9a9", "#dcae86"];
var LOOK_HAIR = ["#4a3a2e", "#2f2a26", "#7a5334", "#c98a4b"];
var LOOK_CLOTH = ["#7fb6e0", "#f6a3b0", "#8fcca0", "#f2c14e", "#b4a2dd"];

function allFolk(){
  return FOLK.concat(MYFOLK.filter(function(u){ return !u.gone; }));
}
/* 配色换了，把所有用这套配色的娃娃重新画一遍 */
function repaintLook(id){
  folkState.forEach(function(n){
    if (n.cfg.lookId === id && n.el){
      n.el.innerHTML = '<span class="fbubble" hidden></span>' +
        '<span class="fmood" hidden></span>' + folkSvg("kid", 92, n.cfg.look);
      n.el.className = n.el.className.replace(/\s+gen\d+/, "");
      n.el.classList.add("gen" + n.cfg.gen);
      n.inner = n.el.querySelector("svg");
    }
  });
}

function folkSvg(kind, size, look){
  return folkArt(kind, size, look);
}

/* 一个居民的运行时状态 */
function makeState(f, sv){
  sv = sv || {};
  return {
    cfg: f,
    x: typeof sv.x === "number" ? sv.x : f.home.x,
    y: typeof sv.y === "number" ? sv.y : f.home.y,
    tx: null, ty: null,
    pause: 0,                 /* 还要停多久（秒） */
    act: null,                /* 正在做的小动作 */
    actT: 0,
    face: 1,
    walk: Math.random() * 6,
    mood: sv.mood || "happy", /* happy / hungry / sleepy / play */
    moodT: 8 + Math.random() * 14,
    greet: 0,                 /* 头顶气泡倒计时 */
    greetTxt: "",
    heart: 0,                 /* 冒爱心倒计时 */
    el: null, inner: null
  };
}

/* 找回上次的位置和心情，没有就放在家门口 */
function loadFolk(){
  var saved = S.folk || {};
  folkState = allFolk().map(function(f){
    var st = makeState(f, saved[f.id]);
    /* 手里牵着的玩具跟着存档回来 */
    if (saved[f.id] && saved[f.id].carry){ st.carry = saved[f.id].carry; f.carry = saved[f.id].carry; }
    else if (f.carry) st.carry = f.carry;
    return st;
  });
}

function bindFolkEl(n){
  var b = document.createElement("button");
  b.className = "folk" + (n.cfg.gen ? " gen" + n.cfg.gen : "");
  b.type = "button";
  b.id = "folk-" + n.cfg.id;
  b.innerHTML = '<span class="fbubble" hidden></span>' + folkSvg(n.cfg.kind, 92, n.cfg.look);
  b.addEventListener("click", function(e){ e.stopPropagation(); onFolkClick(n); });
  world.appendChild(b);
  n.el = b;
  n.inner = b.querySelector("svg");
  if (n.cfg.carry) attachCarry(n);
}

function placeFolk(){
  folkState.forEach(bindFolkEl);
}

/* 新建一个居民：加状态、加存档、放到小镇上 */
function addFolk(u){
  var n = makeState(u, { x: u.home.x, y: u.home.y, mood: "happy" });
  folkState.push(n);
  bindFolkEl(n);
  n.el.classList.add("pop");
  drawFolk();
  return n;
}

/* 把某个居民从镇上拿走（收进小柜子） */
function removeFolk(id){
  var i = -1;
  folkState.forEach(function(n, k){ if (n.cfg.id === id) i = k; });
  if (i < 0) return;
  var n = folkState[i];
  if (n.el && n.el.parentNode) n.el.parentNode.removeChild(n.el);
  folkState.splice(i, 1);
  delete S.folk[id];
}

function drawFolk(){
  folkState.forEach(function(n){
    n.el.style.left = (n.x - 24) + "px";
    n.el.style.top = (n.y - 82) + "px";
    n.el.style.zIndex = String(10 + Math.round((n.y + 2) / 10));
    /* 只有娃娃翻转，气泡和表情角标保持正向 */
    var bob = n.pause > 0
      ? Math.sin(Date.now() / 700 + n.walk) * 1.2
      : Math.sin(n.walk * 2) * 2.2;
    var tilt = n.pause > 0 ? 0 : Math.sin(n.walk) * 1.4;
    n.inner.style.transform =
      "scaleX(" + n.face + ") translateY(" + bob.toFixed(2) + "px) rotate(" + tilt.toFixed(2) + "deg)";
  });
}

/* =====================================================================
   8.6 宠物：从农场带回来的小动物，会一直跟在后面走
   ---------------------------------------------------------------------
   · 记一串主角走过的位置，宠物踩在「几十帧之前」的点上，看起来像排队跟着
   · 站着不动时它们停在左右两侧，不会和主角叠在一起
   ===================================================================== */
var PET_ART = { pet_chick:"chick", pet_pig:"pig", pet_duck:"duck" };
var petEls = [];
var petTrail = [];

function petArtKey(id){ return PET_ART[id] || "chick"; }

function loadPets(){
  petEls.forEach(function(p){ if(p.el && p.el.parentNode) p.el.parentNode.removeChild(p.el); });
  petEls = []; petTrail = [];
  (S.pets || []).forEach(function(pt, i){
    var b = document.createElement("button");
    b.className = "folk pet";
    b.type = "button";
    b.id = "pet-" + i;
    b.innerHTML = '<span class="fbubble" hidden></span>' + folkSvg(petArtKey(pt.id), 64);
    b.addEventListener("click", function(e){ e.stopPropagation(); petTalk(pt, b); });
    world.appendChild(b);
    petEls.push({ cfg:pt, el:b, x:heroPose.x - 30, y:heroPose.y + 12, face:1 });
  });
}

function petTalk(pt, el){
  Sound.blip("tap");
  var lines = {
    pet_chick:["叽叽！","（它跟在你脚边，啄了两下地面）","（它抬头看你，等着你说走）"],
    pet_pig:["哼哧哼哧……","（它把鼻子凑到你手上）","（它一屁股坐下，要歇一会儿）"],
    pet_duck:["嘎嘎！","（它摇摇摆摆转了个圈）","（它用扁嘴巴理了理翅膀）"]
  };
  var arr = lines[pt.id] || lines.pet_chick;
  var txt = arr[Math.floor(Math.random() * arr.length)];
  var b = el.querySelector(".fbubble");
  if(b){
    b.hidden = false; b.textContent = txt;
    clearTimeout(el._bt);
    el._bt = setTimeout(function(){ b.hidden = true; }, 2800);
  }
  Sound.blip("ok");
  Voice.say(pt.name + "：" + txt.replace(/（.*?）/g, ""), { who:"kid", rate:1.0 });
}

function stepPets(dt){
  if(!petEls.length) return;
  petTrail.push({ x: heroPose.x, y: heroPose.y });
  if(petTrail.length > 120) petTrail.shift();

  petEls.forEach(function(p, i){
    var lag = 18 + i * 13;
    var t = petTrail[Math.max(0, petTrail.length - 1 - lag)] || { x: heroPose.x, y: heroPose.y };
    var offX = (i % 2 === 0 ? -1 : 1) * (27 + i * 4);
    var tx = t.x + offX, ty = t.y + 14;
    var k = Math.min(1, dt * 4.2);
    var px = p.x, py = p.y;
    p.x += (tx - p.x) * k;
    p.y += (ty - p.y) * k;
    if(Math.abs(p.x - px) > 0.35) p.face = p.x > px ? 1 : -1;

    p.el.style.left = (p.x - 17) + "px";
    p.el.style.top = (p.y - 56) + "px";
    p.el.style.zIndex = String(10 + Math.round((p.y + 2) / 10));
    var inner = p.el.querySelector("svg");
    if(inner){
      var hop = Math.abs(tx - p.x) > 1.5 ? Math.abs(Math.sin(Date.now() / 120 + i)) * 3 : 0;
      inner.style.transform = "scaleX(" + p.face + ") translateY(" + (-hop).toFixed(2) + "px)";
    }
  });
}

/* 挑一个新目标点：在自己家门口附近转悠，不走进房子 */
function pickTarget(n){
  var h = n.cfg.home;
  for (var k = 0; k < 12; k++){
    var a = Math.random() * Math.PI * 2;
    var r = 90 + Math.random() * 230;
    var x = clampX(h.x + Math.cos(a) * r);
    var y = clampY(h.y + Math.sin(a) * r * 0.6);
    if (!blocked(x, y)) { n.tx = x; n.ty = y; return; }
  }
  n.tx = h.x; n.ty = h.y;
}

/* 到了某个点做点小动作 */
var SMALL_ACTS = ["look", "jump", "stretch", "yawn"];

function startAct(n){
  n.act = SMALL_ACTS[Math.floor(Math.random() * SMALL_ACTS.length)];
  n.actT = 1.1 + Math.random() * 1.2;
  var txt = "";
  if (n.act === "yawn") txt = "呼——（打了个哈欠）";
  else if (n.act === "jump") txt = "嘿！（跳了一下）";
  else if (n.act === "stretch") txt = "（伸了个懒腰）";
  else txt = "（抬头看了看天）";
  if (Math.random() < 0.5) sayFolk(n, txt, 1.6);
}

function sayFolk(n, txt, sec){
  n.greetTxt = txt;
  n.greet = sec || 2.4;
  var bb = n.el.querySelector(".fbubble");
  if (bb){ bb.textContent = txt; bb.hidden = false; }
}

/* 心情变化：饿了、困了、想玩，过一阵又自己好了 */
function shiftMood(dt){
  folkState.forEach(function(n){
    n.moodT -= dt;
    if (n.moodT <= 0){
      n.moodT = 16 + Math.random() * 20;
      var pool = ["happy", "hungry", "play", "sleepy"];
      var pickM = pool[Math.floor(Math.random() * pool.length)];
      /* 玩家刚喂过就多开心一会儿 */
      if (n.justFed > 0){ pickM = "happy"; n.justFed = 0; }
      n.mood = pickM;
    }
    if (n.justFed > 0) n.justFed -= dt;
  });
}

/* 玩家靠近：转头看过来 */
function folkNoticeHero(){
  folkState.forEach(function(n){
    var d = Math.hypot(n.x - heroPose.x, n.y - heroPose.y);
    if (d < 130 && n.pause > 0.2){
      n.face = heroPose.x >= n.x ? 1 : -1;
    }
  });
}

/* 两只居民靠近了，打个招呼 */
function folkMeet(dt){
  folkState.forEach(function(a, i){
    if (a.cool > 0){ a.cool -= dt; return; }
    for (var j = i + 1; j < folkState.length; j++){
      var b = folkState[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) < 60){
        if (a.cfg.id !== "afu" && b.cfg.id !== "afu"){
          sayFolk(a, "嗨，" + b.cfg.name + "！", 1.8);
          sayFolk(b, "嗨！", 1.8);
        } else {
          sayFolk(a.cfg.id === "afu" ? a : b, "汪！", 1.4);
        }
        a.cool = 9; b.cool = 9;
        a.mood = a.mood === "hungry" ? a.mood : "happy";
        b.mood = b.mood === "hungry" ? b.mood : "happy";
        break;
      }
    }
  });
}

/* 阿福会跟着澄澄跑一小段 */
function dogFollow(dt){
  var dog = null;
  folkState.forEach(function(n){ if (n.cfg.kind === "dog") dog = n; });
  if (!dog) return;
  var d = Math.hypot(dog.x - heroPose.x, dog.y - heroPose.y);
  if (d < 300 && d > 70){
    dog.tx = heroPose.x + (dog.x > heroPose.x ? 46 : -46);
    dog.ty = heroPose.y + 12;
    dog.pause = 0;
  }
}

/* 主循环：每帧推进所有居民 */
function stepFolk(dt){
  dogFollow(dt);
  shiftMood(dt);
  folkMeet(dt);
  folkNoticeHero();

  folkState.forEach(function(n){
    /* 头顶气泡倒计时 */
    if (n.greet > 0){
      n.greet -= dt;
      if (n.greet <= 0){
        var bb = n.el.querySelector(".fbubble");
        if (bb) bb.hidden = true;
      }
    }

    /* 饿了 / 困了的图标提示 */
    var badge = n.el.querySelector(".fmood");
    if (!badge){
      badge = document.createElement("span");
      badge.className = "fmood";
      badge.hidden = true;
      n.el.appendChild(badge);
    }
    if (n.mood === "hungry"){
      badge.hidden = false;
      badge.textContent = "🍎";
      badge.className = "fmood hungry";
    } else if (n.mood === "sleepy"){
      badge.hidden = false;
      badge.textContent = "💤";
      badge.className = "fmood sleepy";
    } else {
      badge.hidden = true;
    }

    /* 正在做小动作 */
    if (n.act && n.actT > 0){
      n.actT -= dt;
      if (n.act === "jump" && n.inner){
        n.inner.style.transform = "scaleX(" + n.face + ") translateY(" + (-Math.abs(Math.sin(n.actT * 9)) * 9).toFixed(1) + "px)";
      }
      if (n.actT <= 0){ n.act = null; n.pause = 0.4 + Math.random() * 1.4; }
      return;
    }

    /* 停下来歇着 */
    if (n.pause > 0){ n.pause -= dt; return; }

    /* 该出发了 */
    if (n.tx === null || n.ty === null) pickTarget(n);

    var dx = n.tx - n.x, dy = n.ty - n.y, d = Math.hypot(dx, dy);
    if (d < 8){
      n.tx = null; n.ty = null;
      n.pause = 1.6 + Math.random() * 3.6;
      if (Math.random() < 0.55) startAct(n);
      return;
    }
    var st = Math.min(n.cfg.spd * dt, d);
    var nx = clampX(n.x + dx / d * st), ny = clampY(n.y + dy / d * st);
    if (!blocked(nx, n.y)) n.x = nx;
    if (!blocked(n.x, ny)) n.y = ny;
    if (Math.abs(dx) > 1) n.face = dx > 0 ? 1 : -1;
    n.walk += dt * 9;
  });
  drawFolk();
}

/* 点一个居民 */
/* 站到多远算「身边」：再远就先走过去 */
var NEAR_FOLK = 96;
var pendingFolk = null;

/* 点一个居民：太远就先走过去，走到了再说话 */
function onFolkClick(n){
  var d = Math.hypot(heroPose.x - n.x, heroPose.y - n.y);
  if (d <= NEAR_FOLK){ pendingFolk = null; talkFolk(n); return; }
  /* 走到他身边 46px 的地方，别站到人身上 */
  var dx = heroPose.x - n.x, dy = heroPose.y - n.y;
  var len = Math.hypot(dx, dy) || 1;
  pendingFolk = n;
  walkTo = { x: clampX(n.x + dx / len * 46), y: clampY(n.y + dy / len * 26) };
  Sound.blip("tap");
  showTip("走近" + n.cfg.name + "，再点一下");
  sayFolk(n, "过来呀。", 1.4);
  /* 万一走不过去（被房子挡住），几秒后放开，别一直卡着 */
  var started = Date.now();
  var guard = setInterval(function(){
    if (pendingFolk !== n){ clearInterval(guard); return; }
    if (Date.now() - started > 7000){
      clearInterval(guard);
      pendingFolk = null; walkTo = null;
      toast("绕一下，走到" + n.cfg.name + "旁边再点");
    }
  }, 500);
}

/* 到身边了没有：主循环每帧看一眼（对方会走动，所以要一直跟） */
function stepPendingFolk(){
  if (!pendingFolk) return;
  var n = pendingFolk;
  var d = Math.hypot(heroPose.x - n.x, heroPose.y - n.y);
  if (d <= NEAR_FOLK){
    pendingFolk = null;
    walkTo = null;
    talkFolk(n);
    return;
  }
  if (!walkTo){
    var dx = heroPose.x - n.x, dy = heroPose.y - n.y;
    var len = Math.hypot(dx, dy) || 1;
    walkTo = { x: clampX(n.x + dx / len * 46), y: clampY(n.y + dy / len * 26) };
  }
}

function talkFolk(n){
  Sound.blip("tap");
  var line;
  if (n.mood === "hungry") line = pickPhrase(n.cfg.hungry);
  else if (n.mood === "sleepy") line = "啊……有点困了。";
  else line = pickPhrase(n.cfg.talks);

  sayFolk(n, line, 3.2);
  Voice.say(line.replace(/（.*?）/g, ""), { who: folkVoice(n.cfg) });

  /* 说话的同时把背包摊开：想送就点，不想送就关掉 */
  var ids = Object.keys(S.bag || {}).filter(function(id){ return S.bag[id] > 0; });
  if (ids.length){
    setTimeout(function(){ openGift(n); }, 760);
  } else {
    setTimeout(function(){
      if (Math.random() < 0.45) guide("背包还是空的。去商店用星星换点东西，就能送给" + n.cfg.name + "了。");
    }, 1200);
  }
}

/* 谁在说话：小狗汪汪，小朋友亮一点，其余按画法给个最接近的嗓音 */
function folkVoice(cfg){
  if(!cfg) return "kid";
  if(cfg.kind === "dog") return "dog";
  if(cfg.kind === "girl2") return "kid";
  if(cfg.kind === "boy" || cfg.kind === "kid") return "kid";
  return "kid";
}
/* 「去哪里」里的每个地点是谁在招呼：按 by 的名字给音色 */
function byVoice(by){
  by = by || "";
  if(/外公/.test(by)) return "grandpa";
  if(/爷爷/.test(by)) return "grandpa";
  if(/外婆/.test(by)) return "grandma";
  if(/奶奶/.test(by)) return "grandma";
  if(/妈妈/.test(by)) return "mom";
  if(/爸爸/.test(by)) return "dad";
  if(/舅舅/.test(by)) return "uncle";
  if(/消防/.test(by)) return "fireman";
  if(/护士/.test(by)) return "nurse";
  if(/理货/.test(by)) return "clerk";
  if(/农场/.test(by)) return "farmer";
  if(/老师|管理员|大树/.test(by)) return "teacher";
  return "teacher";
}

/* 送礼小窗：点了「送给它」才真的送出 */
/* 真的把东西送出去：扣背包、影响心情、做个开心的小动作 */
function doGift(n, itemId){
  if (!(S.bag[itemId] > 0)) return false;
  var it = SHOP_ITEMS.filter(function(x){ return x.id === itemId; })[0];
  if (!it) return false;

  S.bag[itemId] = (S.bag[itemId] || 0) - 1;
  if (S.bag[itemId] <= 0) delete S.bag[itemId];
  n.mood = "happy"; n.justFed = 20; n.moodT = 20 + Math.random() * 8;
  /* 气球和风筝是拿在手里玩的，送出去以后它会一直牵着 */
  if (itemId === "balloon" || itemId === "kite"){
    n.carry = itemId;
    n.cfg.carry = itemId;
    attachCarry(n);
    saveFolk();
  }
  save(); paintHud(); paintCarry();
  closeGift();
  Sound.blip("good");

  /* 先把庆祝的小动作收住，不然会把话盖掉 */
  n.act = null; n.actT = 0; n.pause = 3;
  var cheer = "给我的吗？谢谢你！";
  if (itemId === "balloon") cheer = "气球！我牵着它走。";
  else if (itemId === "kite") cheer = "风筝！等下就去放。";
  else if (itemId === "teddy") cheer = "我可以抱着它睡午觉。";
  else if (itemId === "apple" || itemId === "bread" || itemId === "candy") cheer = "好吃的！我正好饿了。";
  else if (itemId === "bubble") cheer = "哇，可以吹泡泡啦。";
  sayFolk(n, cheer, 3.2);
  Voice.say(cheer);
  n.inner.style.transition = "transform .18s ease";
  var t0 = Date.now();
  var iv = setInterval(function(){
    var k = (Date.now() - t0) / 120;
    n.inner.style.transform = "scaleX(" + n.face + ") translateY(" + (-Math.abs(Math.sin(k)) * 14).toFixed(1) + "px)";
    if (Date.now() - t0 > 900){ clearInterval(iv); n.inner.style.transform = "scaleX(" + n.face + ")"; }
  }, 60);
  heartBurst(n);
  toast("送给" + n.cfg.name + "一个" + it.name);
  return true;
}

/* 送礼小窗：点了「送给它」才真的送出（喂它爱吃的东西时用） */
function offerGift(n, itemId){
  var it = SHOP_ITEMS.filter(function(x){ return x.id === itemId; })[0];
  if (!it) return;
  if (document.getElementById("giftBox")) return;
  var d = document.createElement("div");
  d.id = "giftBox";
  d.className = "gift-box";
  d.innerHTML =
    '<div class="gb-in">' +
      '<div class="gb-ico">' + art(itemId, 54) + '</div>' +
      '<p>把' + it.name + '送给' + n.cfg.name + '？</p>' +
      '<button class="gb-yes" id="gbYes">送</button>' +
      '<button class="gb-no" id="gbNo">先留着</button>' +
    '</div>';

  requestAnimationFrame(function(){ d.classList.add("show"); });
  document.getElementById("gbYes").onclick = function(){ doGift(n, itemId); };
  document.getElementById("gbNo").onclick = function(){ closeGift(); };
}

/* 送礼面板：走到谁身边点一下，就把背包摊开来挑 */
var giftTarget = null;
function openGift(n){
  n = n || giftTarget;
  if (!n) return;
  giftTarget = n;
  var ids = Object.keys(S.bag || {}).filter(function(id){ return S.bag[id] > 0; });
  var html = '<h2>送给' + n.cfg.name + '</h2>' +
    '<p class="sub">' + (ids.length
      ? '从背包里挑一样吧。' + (n.cfg.like ? '带小爱心的，是' + n.cfg.name + '最喜欢的。' : '')
      : '背包还是空的。去商店用星星换点东西，再拿来送人吧。') + '</p>';
  if (ids.length){
    html += '<div class="bag-grid gift-grid">';
    ids.forEach(function(id){
      var it = SHOP_ITEMS.filter(function(x){ return x.id === id; })[0];
      if (!it) return;
      var liked = (n.cfg.like === id);
      html += '<button class="bag-cell gift-cell' + (liked ? ' liked' : '') + '" onclick="giveTo(\'' + id + '\')">' +
                (liked ? '<i class="lk">♥</i>' : '') +
                '<div class="bg-ico">' + art(id, 54) + '</div>' +
                '<b>' + it.name + '</b><span>× ' + S.bag[id] + '</span>' +
              '</button>';
    });
    html += '</div>';
  }
  html += '<div class="row" style="margin-top:14px">' +
            '<button class="btn" onclick="closeSheet()">先不送</button>' +
            (ids.length ? '' : '<button class="btn primary" onclick="closeSheet();openShop()">去商店</button>') +
          '</div>';
  openSheet(html);
  Sound.blip("tap");
}
function giveTo(itemId){
  if (!giftTarget) return;
  doGift(giftTarget, itemId);
}
function closeGift(){
  var d = document.getElementById("giftBox");
  if (d && d.parentNode) d.parentNode.removeChild(d);
}

/* 头顶冒爱心 */
function heartBurst(n){
  for (var i = 0; i < 3; i++){
    (function(i){
      setTimeout(function(){
        var h = document.createElement("div");
        h.className = "fheart";
        h.innerHTML = folkArt("heart", 22);
        h.style.left = (n.x - 12 + (i - 1) * 16) + "px";
        h.style.top = (n.y - 96) + "px";
        world.appendChild(h);
        setTimeout(function(){ if (h.parentNode) h.parentNode.removeChild(h); }, 1200);
      }, i * 130);
    })(i);
  }
}

/* 存档：只存必要的 */
function saveFolk(){
  var o = {};
  folkState.forEach(function(n){
    o[n.cfg.id] = { x: Math.round(n.x), y: Math.round(n.y), mood: n.mood };
    if (n.carry) o[n.cfg.id].carry = n.carry;      /* 手里牵着的气球要记住 */
  });
  S.folk = o;
}
/* 自己做的小朋友整只存下来：名字、配色、家在哪 */
function saveMyFolk(){
  S.myfolk = MYFOLK.map(function(u){
    return { id:u.id, name:u.name, look:u.look, home:u.home, like:u.like,
             talks:u.talks, hungry:u.hungry, carry:u.carry || null, gone:u.gone ? 1 : 0 };
  });
}
setInterval(function(){ saveFolk(); save(); }, 4000);

function toggleMine(id){

    u.gone = 0;
    addFolk(u);

    toast(u.name + "回来了");

    removeFolk(id);

/* =====================================================================
   8.6 商店与背包
   ===================================================================== */
/* 商店分成四类：吃的、玩的、农作物（种子）、幼崽。
   这张表和价格规则都在 ui.js 里，超市、农场、背包共用同一份——
   以前三处各抄一遍，改一次价要改三个地方，漏一处就对不上账。 */
var SHOP_CATS = CC.CATS;
var SHOP_ITEMS = CC.ITEMS;

/* 种子／幼崽的图形用「长成以后的样子」，孩子一眼就认得出 */
function itemArt(it, size){ return art(CC.itemGrow(it), size); }
function itemById(id){ return CC.itemById(id); }
function sellPrice(it){ return CC.sellPrice(it); }
function petGiftPrice(it){ return CC.giftPrice(it); }

function buyItem(id){
  var it = SHOP_ITEMS.filter(function(x){ return x.id === id; })[0];
  if (!it) return;
  if (S.stars < it.cost){
    Sound.blip("tap");
    toast("还差 " + (it.cost - S.stars) + " 颗星星，再去玩一会儿吧");
    Voice.say("星星还不够，再去玩一会儿吧。");
    return;
  }
  S.stars -= it.cost;
  var n = it.per || 1;
  S.bag[id] = (S.bag[id] || 0) + n;
  save(); paintHud(); paintCarry();
  Sound.blip("good");
  toast("买到 " + n + " 个" + it.name + "啦，在背包里");
  Voice.say("买到" + it.name + "啦。");
  if (id === "balloon" || id === "bubble" || id === "firework"){
    setTimeout(function(){
      guide("现在" + childCall() + "身上就带着" + it.name + "，碰到它点一下，" +
        (id === "balloon" ? "气球就飞上天啦" : id === "bubble" ? "泡泡就吹出来啦" : "天上就开出花啦") + "。");
    }, 1200);
  }
  if (it.cat === "seed" || it.cat === "pet"){
    setTimeout(function(){
      guide(it.cat === "seed"
        ? "种子买好啦。走到小镇农场，把它种到地里，浇两次水就长熟了。"
        : "幼崽买好啦。走到小镇农场，把它放进小窝里，喂两次就长大了。");
    }, 1300);
  }
  if (document.getElementById("mask") && mask.classList.contains("show")) paintShopSheet();
}

/* 商店面板（小镇 HUD 的「商店」按钮直接打开，方便随时看） */
function openShop(){
  paintShopSheet();
}
function paintShopSheet(catId){
  if (!catId) catId = S.shopCat || "food";
  S.shopCat = catId;
  var cur = SHOP_CATS.filter(function(c){ return c.id === catId; })[0] || SHOP_CATS[0];

  var html = '<h2>小镇商店</h2><p class="sub">玩小游戏攒的星星，可以换东西。</p>';
  html += '<div class="shop-wallet">' + ico("star", 16, "#f0a832") + ' <b>' + S.stars + '</b> 颗星星可以花</div>';

  /* 分类标签 */
  html += '<div class="shop-tabs">';
  SHOP_CATS.forEach(function(c){
    html += '<button class="shop-tab' + (c.id === cur.id ? " on" : "") + '" ' +
            'onclick="paintShopSheet(\'' + c.id + '\')">' +
              '<span class="tab-ico">' + art(c.ico, 22) + '</span>' + c.name +
            '</button>';
  });
  html += '</div>';
  html += '<div class="shop-cat-hint">' + cur.hint + '</div>';

  html += '<div class="shop-grid">';
  SHOP_ITEMS.filter(function(x){ return x.cat === cur.id; }).forEach(function(it){
    var can = S.stars >= it.cost;
    var tail = it.cat === "seed" ? ("卖出 " + sellPrice(it) + " 星") :
               (it.cat === "pet" ? ("送人 " + petGiftPrice(it) + " 星") : "");
    html += '<div class="shop-cell' + (can ? "" : " poor") + '">' +
              '<div class="sc-ico">' + itemArt(it, 62) + '</div>' +
              '<b>' + it.name + '</b>' +
              '<div class="sc-cost">' + ico("star", 13, "#f0a832") + ' ' + it.cost + '</div>' +
              (tail ? '<div class="sc-tail">' + tail + '</div>' : '') +
              '<button class="sc-buy" ' + (can ? 'onclick="buyItem(\'' + it.id + '\')"' : 'disabled') + '>' +
                (can ? "换" : "还差") + '</button>' +
            '</div>';
  });
  html += '</div>';

  html += '<div class="row" style="margin-top:14px"><button class="btn" onclick="openBag()">看看背包</button>' +
          '<button class="btn primary" onclick="closeSheet()">继续逛</button></div>';
  openSheet(html);
}

/* 背包面板（从小镇 HUD 打开） */
function openBag(){
  var ids = Object.keys(S.bag || {});
  var html = '<h2>我的背包</h2><p class="sub">' + (ids.length ? "点一下可以看，走到谁身边就能送给谁。" : "还是空的，去超市用星星换点东西吧。") + '</p>';
  if (ids.length){
    html += '<div class="bag-grid">';
    ids.forEach(function(id){
      var it = SHOP_ITEMS.filter(function(x){ return x.id === id; })[0];
      if (!it) return;
      var playable = (id === "balloon" || id === "bubble" || id === "firework");
      html += '<div class="bag-cell"><div class="bg-ico">' + itemArt(it, 58) + '</div>' +
              '<b>' + it.name + '</b><span>× ' + S.bag[id] + '</span>' +
              (playable ? '<button class="bg-play" onclick="closeSheet();playCarry(\'' + id + '\')">放</button>' : '') +
              '</div>';
    });
    html += '</div>';
  }
  html += '<div class="row" style="margin-top:14px"><button class="btn primary" onclick="closeSheet()">收起来</button></div>';
  openSheet(html);
  guide(ids.length ? "背包里有" + ids.length + "样东西。" : "背包还空着。");
}

var MINI={};

/* ---------- 10.1 浇水：按顺序给每盆花浇水 ---------- */
MINI.water=function(){
  var n = S.diff==="easy"?3:(S.diff==="mid"?4:5);
  var cur=0, seq=[];            // seq 里存每盆花的花色
  var cols=["#f7a5ad","#f6d365","#b9a5f7","#f78fb3","#8fd0e8"];
  seq=cols.slice(0,n);
  var step=0;                   // 0 浇水 1 开花结果

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div style="display:flex;justify-content:center">'+art(step===0?"can":"bloom",60,{c:"#f7a5ad"})+'</div>'+
      '<div class="hintline" id="wHint">'+(step===0? "点一点小花，给它浇浇水" : "花开了，真好看")+'</div>';
    var grid=document.createElement("div"); grid.className="plots";
    grid.style.gridTemplateColumns="repeat("+Math.min(n,3)+",1fr)";
    seq.forEach(function(c,i){
      var d=document.createElement("button");
      d.className="plot"+(i<cur?" wet":"");
      d.innerHTML=art(i<cur? "bloom" : "thirsty", 46, {c:c});
      var cap=document.createElement("div"); cap.className="cap";
      cap.textContent = i<cur? (step===0?"喝饱了":"开花了") : "还没浇";
      d.appendChild(cap);
      if(i===cur && step===0){
        d.style.borderColor="#7fb6e0"; d.style.background="#eef7fd";
        d.onclick=function(){ water(i,c); };
      }
      grid.appendChild(d);
    });
    g.appendChild(grid);
    paintScore(cur,seq.length);
  }
  function water(i,c){
    cur++; Sound.blip("ok"); render();
    if(cur<seq.length){
      guide(pickPhrase(["真棒，再浇下一盆。","这一盆也喝饱啦。","好厉害，还有几盆呢。"]),{rate:0.95});
    }else{
      step=1; render();
      Sound.blip("good");
      finish("花都开了，你帮了大忙，谢谢你。");
      /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    var ps=g.querySelectorAll(".plot");
    if(ps[cur]){ ps[cur].style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ if(ps[cur]) ps[cur].style.boxShadow=""; },1600); }
    guide("点一亮一亮的这一盆。");
  }
  render();
  return {hint:hint};
};

/* ---------- 10.3 排队：按从小到大排好（大小比较） ---------- */
MINI.sort=function(){
  /* 三个身高差别明显的小朋友（矮 / 中 / 高），按从矮到高排进队里 */
  var n = S.diff==="easy"?3:3;
  var KIDS=[
    {k:"kid3", h:52, name:"小小"},
    {k:"kid2", h:72, name:"中中"},
    {k:"kid1", h:94, name:"大大"}
  ];
  var chosen = KIDS.slice(0, n);
  var ans = chosen.slice();                      /* 已经是矮→高 */
  var pool = shuffle(chosen.slice());
  var placed = [];

  /* 画小朋友：底部对齐，高度决定大小，一眼看出谁高 */
  function kidSvg(k, h){
    /* 确保图形字典已生成 */
    if(!ART_LIB[k]) art(k,40);
    /* 用统一的 36 单位视口，只改宽高：图形等比放大，不会被裁头 */
    var size = Math.round(h*1.55);
    return '<div style="display:flex;align-items:flex-end;justify-content:center">'+
             '<svg viewBox="-18 -18 36 36" width="'+size+'" height="'+size+'" style="display:block;overflow:visible;flex:0 0 auto">'+
               ART_LIB[k] +
             '</svg>'+
           '</div>';
  }

  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div class="hintline">从矮到高，一个一个点</div>';

    /* 队列：左边是起点（矮），右边越来越高 */
    var slots=document.createElement("div"); slots.className="sortqueue";
    for(var i=0;i<n;i++){
      var cell=document.createElement("div");
      cell.className="qcell"+(placed[i]?" filled":"");
      if(placed[i]) cell.innerHTML=kidSvg(placed[i].k, placed[i].h);
      else cell.innerHTML='<span class="qnum">'+(i+1)+'</span>';
      slots.appendChild(cell);
    }
    g.appendChild(slots);

    /* 身高刻度参考 */
    var ruler=document.createElement("div"); ruler.className="ruler";
    ruler.innerHTML='<span>矮</span><i></i><span>高</span>';
    g.appendChild(ruler);

    var row=document.createElement("div"); row.className="sortrow";
    pool.forEach(function(it){
      if(it.used) return;
      var d=document.createElement("button"); d.className="sitem";
      d.style.width="88px"; d.style.height="118px"; d.style.alignItems="flex-end";
      d.innerHTML=kidSvg(it.k, it.h);
      d.onclick=function(){ pick(it,d); };
      row.appendChild(d);
    });
    g.appendChild(row);
    paintScore(placed.length,n);
  }

  function pick(it,dom){
    var idx=placed.length;
    if(it===ans[idx]){
      it.used=true; placed.push(it); Sound.blip("ok"); render();
      if(placed.length===n){
        Sound.blip("good");
        finish("排好啦！一个比一个高，真整齐。");
        /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
      }else{
        guide(pickPhrase(["对，把它放进来。","接着找高一点的。","很好，再看下一个。"]),{rate:0.95});
      }
    }else{
      Sound.blip("soft");
      if(dom){ dom.classList.add("no"); setTimeout(function(){ dom.classList.remove("no"); },420); }
      guide("先点最矮的那个，它会排在第一个。",{rate:0.95});
    }
  }

  function hint(){
    var want=ans[placed.length];
    if(!want){ return; }
    guide("找一找，哪一个最矮？");
    var g=boardEl(); if(!g) return;
    var found=null;
    [].forEach.call(g.querySelectorAll(".sortrow .sitem"),function(btn){
      if(btn.querySelector('svg') && +btn.querySelector('svg').getAttribute("width")===Math.round(94*want.h/94)) found=btn;
    });
    /* 用高度匹配更稳：直接找 svg 高度等于目标高度的按钮 */
    [].forEach.call(g.querySelectorAll(".sortrow .sitem"),function(btn){
      var sv=btn.querySelector("svg");
      if(sv && Math.abs(+sv.getAttribute("height") - Math.round(94*want.h/94))<3) found=btn;
    });
    if(found){ found.style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ if(found) found.style.boxShadow=""; },1800); }
  }
  render();
  return {hint:hint};
};

/* ---------- 10.4 找一样：从四张图里找出和样板一样的 ---------- */
MINI.same=function(){
  var pool=["apple","orange","pear","banana","berry","flower","pill","bottle","plaster","ball","book","leaf"];
  var round=0, total=S.diff==="easy"?3:(S.diff==="mid"?4:5);
  var target=null, opts=[];

  function next(){
    target=pickPhrase(pool);
    var others=shuffle(pool.filter(function(x){return x!==target;})).slice(0,3);
    opts=shuffle([target].concat(others));
    render();
  }
  function render(){
    var g=boardEl(); if(!g) return; g.innerHTML="";
    g.innerHTML='<div style="text-align:center;font-size:13px;color:#7c8b80">找出和这个一样的</div>'+
      '<div style="display:flex;justify-content:center;margin:4px 0 6px">'+
        '<div id="sameTarget" data-k="'+target+'" style="background:#f4f9f2;border-radius:20px;padding:8px">'+art(target,56)+'</div></div>';
    var grid=document.createElement("div"); grid.className="find";
    grid.style.gridTemplateColumns="repeat(2,1fr)";
    opts.forEach(function(k){
      var d=document.createElement("button"); d.className="card"; d.dataset.k=k;
      d.innerHTML=art(k,76);
      d.onclick=function(){ choose(k,d); };
      grid.appendChild(d);
    });
    g.appendChild(grid);
    paintScore(round,total);
  }
  var locked=false;
  function choose(k,el){
    if(locked||gameDone) return;
    if(k===target){
      locked=true;
      el.classList.add("yes"); Sound.blip("ok"); round++;
      if(round>=total){
        paintScore(round,total);       /* 先把分数刷成 4/4 再收尾 */
        Sound.blip("good");
        finish("都找对啦，眼睛真亮。");
        /* 按钮文字由 finish() 统一按难度写，这里不再各自覆盖 */
        return;
      }
      guide("找对啦。");
      setTimeout(function(){ locked=false; next(); },700);
    }else{
      el.classList.add("no"); Sound.blip("soft");
      setTimeout(function(){ el.classList.remove("no"); },340);
      guide("这两个不一样，再仔细看看。");
    }
  }
  function hint(){
    var g=boardEl(); if(!g) return;
    var cs=g.querySelectorAll(".find .card");
    for(var i=0;i<cs.length;i++){
      if(cs[i].innerHTML.indexOf(art(target,58))>=0){ cs[i].style.boxShadow="0 0 0 5px #f0a832"; setTimeout(function(){ cs[i].style.boxShadow=""; },1700); break; }
    }
    guide("和上面那张图一样的，就是它。");
  }
  next();
  return {hint:hint};
};

/* ---------- 10.5 分类：一样的放同一个筐 ---------- */
MINI.basket=function(){
  var kinds=[
    {id:"apple", name:"苹果筐", k:"apple"},

    var it=queue[idx];
    if(!it){
      g.innerHTML='<div style="display:flex;justify-content:center">'+art("basket",64)+'</div>'+
        '<div class="hintline">都放好啦</div>';

    }

      '<div id="basketItem" data-k="'+it.id+'" style="display:flex;justify-content:center;margin:8px 0">'+art(it.k,64)+'</div>';
    var row=document.createElement("div"); row.className="trash";

      d.innerHTML='<div style="font-size:0;line-height:0;margin-top:2px">'+art(kd.k,64)+'</div>'+
                  '<div style="margin-top:2px;font-size:0;line-height:0;opacity:.9">'+art("basket",30)+'</div>'+
                  '<div class="cap" style="position:static;margin-top:4px;color:#5f564a;font-size:12.5px;font-weight:600">'+kd.name+'</div>';
      d.onclick=function(){ put(kd,d); };
      row.appendChild(d);

      right++; idx++; Sound.blip("ok");

        paintScore(right,total);          /* 先刷成 6/6 */
        Sound.blip("good");
