<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>故事屋 · 澄澄的小镇</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f4eddd; --card:#fffdf7; --ink:#3b352c; --muted:#877f6e;
  --line:#e8e0cd; --accent:#4f7a5e; --accent-soft:#e8f2ea;
  --gold:#e9a52e; --seal:#c0563f; --paper:#faf6ea;
  --shadow:0 6px 18px rgba(59,53,44,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;touch-action:manipulation}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ---------- 顶栏 ---------- */
.hud{
  position:fixed;left:0;right:0;top:0;z-index:30;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 14px 0;
}
.brand{background:rgba(255,253,247,.95);border:1px solid var(--line);border-radius:16px;padding:8px 14px;box-shadow:var(--shadow);pointer-events:auto}
.brand h1{margin:0;font-size:16px;letter-spacing:.5px}
.brand p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.tools{display:flex;gap:8px;pointer-events:auto}
.tools button{
  height:38px;min-width:38px;padding:0 10px;border-radius:13px;border:1px solid var(--line);
  background:rgba(255,253,247,.95);color:#5b5548;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:5px;box-shadow:var(--shadow);cursor:pointer;
}
.tools button:active{transform:scale(.96)}
.tools .star-n{color:#b8791c}

/* ---------- 地图 ---------- */
.mapwrap{position:fixed;top:0;right:0;bottom:0;left:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.map{
  position:relative;width:100%;max-width:720px;margin:0 auto;
  background:
    /* 书页中缝：一条很淡的竖影，像摊开的一本书 */
    linear-gradient(90deg, transparent 0 49.3%, rgba(176,160,128,.10) 50%, transparent 50.7% 100%),
    repeating-linear-gradient(180deg, rgba(180,168,140,.09) 0 1px, transparent 1px 34px),
    /* 墙板：淡淡的竖条纹 */
    repeating-linear-gradient(90deg, rgba(190,170,130,.05) 0 2px, transparent 2px 64px),
    /* 底部一小段木地板 */
    linear-gradient(180deg, transparent 0 calc(100% - 120px), rgba(186,148,96,.14) calc(100% - 120px)),
    linear-gradient(180deg,#fbf6e8 0%,#f6efdd 55%,#f0e7d1 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.55) inset, 0 0 26px rgba(150,132,100,.06) inset;
}
/* ---------- 图书馆氛围装饰：书架、绿植、台灯、阅读角 ---------- */
.deco{position:absolute;inset:0;pointer-events:none;z-index:0}
.deco .d{position:absolute;transform:translate(-50%,-50%)}
.deco .d svg{display:block}
.deco .d.float svg{animation:floaty 3.2s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(0)}to{transform:translateY(-6px)}}
#nodes{position:relative;z-index:1}
@media (max-width:560px){ .deco .d{transform:translate(-50%,-50%) scale(.6)} }
.map svg.path{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

/* 节点做成小书签：圆角方块 + 左侧书脊 */
.node{
  position:absolute;width:76px;height:76px;margin-left:-38px;margin-top:-38px;
  border-radius:14px 18px 18px 14px;border:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#fffdf7,#f3ecdc);
  box-shadow:0 5px 0 #dbd0b8, 0 8px 16px rgba(59,53,44,.14);
  transition:transform .14s, box-shadow .14s;
  font-size:24px;font-weight:800;color:#8b8272;
}
.node::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:9px;
  border-radius:14px 0 0 14px;background:#d9cbb0;
}
.node:active{transform:translateY(2px)}
.node .num{position:absolute;font-size:22px;font-weight:800;line-height:1}
.node .cap{
  position:absolute;left:50%;top:calc(100% + 11px);transform:translateX(-50%);z-index:3;
  white-space:nowrap;font-size:12.5px;font-weight:700;color:#6d6555;
  background:rgba(255,253,247,.92);border-radius:9px;padding:2px 8px;box-shadow:0 2px 6px rgba(59,53,44,.10);
}
.node .badge{
  position:absolute;right:-5px;top:-5px;width:26px;height:26px;border-radius:50%;
  background:var(--gold);color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.16);
}
/* 奖杯角标：贴在节点左上，点亮金色、没点亮是灰剪影 */
.node .cup{
  position:absolute;left:-9px;top:-9px;width:26px;height:26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#fffdf6;border:1.5px solid #e8dfc9;box-shadow:0 2px 5px rgba(80,60,30,.14);
}
.node .cup.on{background:#fff6e0;border-color:#f0d492;animation:cupIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cupIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
/* 结算面板里的大奖杯，点亮时弹一下 */
.cupPop{display:inline-block;animation:cupIn .55s .15s cubic-bezier(.2,1.4,.4,1) both}
.node.done{background:linear-gradient(180deg,#8fd0a4,#5cb37c);box-shadow:0 5px 0 #3f8f5d, 0 8px 16px rgba(59,53,44,.16)}
.node.done::before{background:#3f8f5d}
.node.done .num,.node.done .cap{color:#fff}
.node.done .cap{background:rgba(88,150,110,.94)}
.node.now{
  background:linear-gradient(180deg,#ffe6a8,#f3b83f);color:#8a5a12;
  box-shadow:0 5px 0 #c98d26, 0 0 0 8px rgba(243,184,63,.20), 0 10px 22px rgba(59,53,44,.18);
  animation:pulse 1.8s ease-in-out infinite;
}
.node.now::before{background:#c98d26}
.node.now .num{color:#7a4d0d}
.node.now .cap{background:#f3b83f;color:#fff}
@keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.node.lock{background:linear-gradient(180deg,#efeade,#e2dbcb);box-shadow:0 5px 0 #cfc7b5;color:#b3aa98}
.node.lock::before{background:#cfc7b5}
.node.lock .cap{color:#a9a08d}
.node.lock .num{opacity:.5}
.node .lockico{position:absolute;bottom:6px;right:6px;width:18px;height:18px;opacity:.7}

.peak{position:absolute;left:0;right:0;display:flex;justify-content:center;pointer-events:none}
.peak .flag{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:rgba(255,253,247,.95);border:1px dashed #d8cfb6;border-radius:18px;
  padding:10px 18px;box-shadow:var(--shadow);text-align:center;
}
.peak b{font-size:13px;color:#6b5540}
.peak span{font-size:11.5px;color:var(--muted)}

/* ---------- 封面 ---------- */
.cover{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;
  background:linear-gradient(180deg,#faf4e4,#eef3e8);
  display:flex;align-items:center;justify-content:center;padding:24px;
  transition:opacity .35s;
}
.cover.gone{opacity:0;pointer-events:none}
.cover .box{max-width:460px;text-align:center}
.cover h1{font-size:26px;margin:10px 0 8px;letter-spacing:1px}
.cover p{color:#6d6555;font-size:14px;line-height:1.75;margin:0 0 20px}
.cover .btn{font-size:16px;padding:14px 34px}

.btn{
  border:none;border-radius:16px;padding:12px 22px;font-size:15px;font-weight:700;
  background:#fff;color:#5b5548;border:1px solid var(--line);cursor:pointer;
  box-shadow:0 4px 0 #e2d9c6;
}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #e2d9c6}
.btn.primary{background:var(--accent);color:#fff;border-color:#3f8a5b;box-shadow:0 4px 0 #3f8a5b}
.btn.gold{background:var(--gold);color:#fff;border-color:#c98d26;box-shadow:0 4px 0 #c98d26}

/* ---------- 关卡面板 ---------- */
.mask{
  position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;
  background:rgba(45,42,34,.44);display:flex;align-items:flex-end;justify-content:center;
  padding:0;opacity:0;pointer-events:none;transition:opacity .24s;
}
.mask.show{opacity:1;pointer-events:auto}
.sheet{
  position:relative;width:100%;max-width:760px;max-height:94vh;
  background:var(--card);border-radius:26px 26px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .26s;overflow:auto;
  box-shadow:0 -10px 40px rgba(40,34,24,.20);
}
.mask.show .sheet{transform:none}
.sheet .x{
  position:absolute;right:12px;top:12px;width:34px;height:34px;border:none;border-radius:12px;
  background:#f1ece0;color:#8a8272;font-size:16px;line-height:1;cursor:pointer;z-index:3;
}
.lv-head{padding-right:42px}
.lv-no{display:inline-block;background:var(--accent-soft);color:#3f7a55;font-size:11.5px;
  font-weight:800;border-radius:9px;padding:3px 9px;margin-bottom:6px}
.lv-head h2{margin:0 0 4px;font-size:21px}
.lv-head p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.lv-stage{margin-top:14px;min-height:260px}

/* 通用件 */
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.tile{
  width:62px;height:62px;border-radius:16px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 0 #e6ddca;transition:transform .12s,box-shadow .12s;position:relative;
}
.tile svg{pointer-events:none}
.tile:active{transform:translateY(2px)}
.tile.sel{box-shadow:0 0 0 3px #f5b83d, 0 3px 0 #e6ddca;transform:translateY(-3px)}
.tile.ok{opacity:.32;pointer-events:none}
.tile.bad{animation:shake .34s}
.tile.drag{position:fixed;z-index:80;pointer-events:none;transform:scale(1.1) rotate(-3deg);box-shadow:0 12px 26px rgba(0,0,0,.2)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.drop{
  border-radius:18px;border:2px dashed #d5cdb9;background:#fbf8ee;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:10px;min-height:96px;transition:border-color .15s,background .15s,transform .15s;
}
.drop .dl{font-size:12.5px;font-weight:700;color:#6d6555}
.drop.hot{border-color:var(--accent);background:#eaf6ee;transform:scale(1.03)}
.drop.full{border-style:solid;border-color:#8fd0a4;background:#f0faf3}

.opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px}
.opt{
  min-width:76px;height:76px;border-radius:20px;border:1px solid var(--line);background:#fff;
  font-size:30px;font-weight:800;color:#4a4437;cursor:pointer;box-shadow:0 4px 0 #e6ddca;
  display:flex;align-items:center;justify-content:center;padding:0 14px;
}
.opt:active{transform:translateY(2px);box-shadow:0 2px 0 #e6ddca}
.opt.ok{background:#e6f4e8;border-color:#8fd0a4}
.opt.bad{animation:shake .34s}

.sayline{margin-top:12px;text-align:center;font-size:14px;color:#4f6b56;min-height:22px;line-height:1.6}

/* 第 2 关的对话框 */
.bubble-line{
  position:relative;margin:6px auto 14px;max-width:400px;
  background:var(--paper);border:2px solid #e8dfc8;border-radius:20px;
  padding:18px 20px;text-align:center;
}
.bubble-line .who{font-size:22px;font-weight:800;line-height:1.5;color:#3b352c}
.bubble-line .tip{margin-top:6px;font-size:12.5px;color:var(--muted)}
.bubble-line::after{
  content:"";position:absolute;left:50%;bottom:-11px;margin-left:-9px;
  width:18px;height:18px;background:var(--paper);border-right:2px solid #e8dfc8;border-bottom:2px solid #e8dfc8;
  transform:rotate(45deg);
}

/* 第 5 关的字形卡 */
.glyphcard{
  width:96px;height:96px;border-radius:16px;background:var(--paper);
  border:2px solid #e6dcc4;display:flex;align-items:center;justify-content:center;
}
.glyphcard svg{width:64px;height:64px}

/* 第 6 关的听故事 */
.storybox{
  background:var(--paper);border:2px solid #e8dfc8;border-radius:20px;
  padding:18px 20px;font-size:15px;line-height:2;color:#4a4437;
}
.storybox p{margin:0 0 8px}
.storybox p:last-child{margin-bottom:0}
.replay{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:#fff;border-radius:12px;padding:7px 14px;font-size:13px;font-weight:700;
  color:#5b5548;cursor:pointer;box-shadow:0 3px 0 #e6ddca;
}
.replay:active{transform:translateY(2px);box-shadow:0 1px 0 #e6ddca}

/* 完成面板 */
.donebox{text-align:center;padding:6px 4px 4px}
.donebox h2{margin:8px 0 6px;font-size:22px}
.donebox p{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.75}
.donebox .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.starfly{position:fixed;z-index:90;font-size:22px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-90px) scale(1.5)}}

/* ---------- 认字关卡（第 7 关以后） ---------- */
.hz{
  font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  font-weight:700;color:#3b352c;line-height:1;letter-spacing:3px;
}
.qhead{text-align:center;margin:2px 0 4px}
.qline{font-size:23px;font-weight:800;color:#3b352c;line-height:1.5}
.qline .blank{
  display:inline-block;min-width:54px;border-bottom:3px dashed #d5cdb9;
  color:#c98d26;font-weight:800;
}
.qhint{font-size:13px;color:#8a8272;margin-top:8px}
.qimg{display:flex;justify-content:center;margin:2px 0 4px}
.opt.qo{
  height:auto;min-height:74px;flex-direction:column;gap:2px;
  padding:8px 16px;min-width:94px;font-size:22px;
}
.opt.qo .ol{font-size:20px;font-weight:800;line-height:1.25;color:#4a4437}
.opt.qo .ol.big{font-size:29px}
.opt.qo .oi{display:block;line-height:0}
.opt.qo.ok{background:#e6f4e8;border-color:#8fd0a4}
.opt.qo.ok .ol{color:#3f7a55}

/* 组词／造句：一排空格 + 一排字卡 */
.wslots{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.wslot{
  width:86px;height:86px;border-radius:18px;border:2px dashed #d5cdb9;background:#fbf8ee;
  display:flex;align-items:center;justify-content:center;
}
/* 它也带 .drop 类，拖放才认得出来；尺寸压回方卡大小，不用 .drop 那套大框 */
.wslot.drop{min-height:0;padding:4px;gap:0;width:86px;height:86px}
.wslot.full{border-style:solid;border-color:#8fd0a4;background:#f0faf3}
.wtile{
  width:86px;height:86px;border-radius:18px;border:1px solid var(--line);background:#fff;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 3px 0 #e6ddca;transition:transform .12s;
}
.wtile:active{transform:translateY(2px)}
.wtile.sel{box-shadow:0 0 0 3px #f5b83d,0 3px 0 #e6ddca;transform:translateY(-3px)}
.wtile.bad{animation:shake .34s}
.wtile.ok{opacity:.32;pointer-events:none}
.wtile .hz{font-size:40px}

/* 方位题的小场景：一个敞口木箱，小猫可能在上面、里面、下面 */
.scene{position:relative;width:230px;height:186px;margin:6px auto 0}
.scene .box{position:absolute;left:52px;width:126px}
/* 箱体后半（含敞开的箱口） */
.scene .box.back{
  top:66px;height:62px;
  background:linear-gradient(180deg,#d3bb93 0 7px,#ecd9b6 7px);
  border:3px solid #c9ae84;border-bottom:none;border-radius:4px;
}
/* 敞开的两片箱盖：往两边翻 */
.scene .flap{position:absolute;top:-20px;width:64px;height:22px;
  background:#f6e8cd;border:3px solid #c9ae84;border-radius:3px}
.scene .flap.l{left:-12px;transform:rotate(-15deg);transform-origin:100% 100%}
.scene .flap.r{right:-12px;transform:rotate(15deg);transform-origin:0 100%}
/* 盖上盖子时的箱盖：一条盖沿 */
.scene .lid{position:absolute;left:-6px;top:-11px;width:138px;height:15px;
  background:#f0e0c2;border:3px solid #c9ae84;border-radius:5px}
/* 箱子里的暗影，小猫站进去才衬得出轮廓 */
.scene .inner{position:absolute;left:0;top:0;width:100%;height:22px;
  background:linear-gradient(180deg,rgba(122,96,58,.30),rgba(122,96,58,0));border-radius:5px 5px 0 0}
/* 箱体前壁：在猫上面盖一层，小猫「在箱子里」时才看得出来 */
.scene .box.front{
  top:104px;height:24px;background:#e3d0a9;
  border:3px solid #c9ae84;border-top:none;border-radius:0 0 6px 6px;
  z-index:3;
}
/* 箱身上的胶带 */
.scene .box.front::after{
  content:"";position:absolute;left:50%;top:0;width:10px;height:100%;
  margin-left:-5px;background:#d6bd92;
}
.scene .kit{position:absolute;transform:translate(-50%,-50%);z-index:2}

@media (min-width:820px){
  .mask{align-items:center;padding:22px}
  .sheet{border-radius:26px;max-height:88vh}
}
@media (max-width:390px){
  .node{width:68px;height:68px;margin-left:-34px;margin-top:-34px}
  .node .cap{font-size:10.5px;padding:2px 6px}
  .sheet{padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
  .lv-stage{min-height:220px}
}
</style>
</head>
<body>

<div class="hud">
  <div class="brand">
    <h1>故事屋</h1>
    <p>小镇图书馆 · 读一读，猜一猜</p>
  </div>
  <div class="tools">
    <button id="btnStar" title="我的星星">
      <svg width="15" height="15" viewBox="-12 -12 24 24"><path d="M0,-10 L3,-3 L10,-2.6 L4.8,2.2 L6.6,9.6 L0,5.6 L-6.6,9.6 L-4.8,2.2 L-10,-2.6 L-3,-3 Z" fill="#f0a832"/></svg>
      <span class="star-n" id="starNum">0</span>
    </button>
    <button id="btnBack" title="回小镇">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 11 L12 4 L20 11"/><path d="M6.5 10 L6.5 19 L17.5 19 L17.5 10"/>
      </svg>
    </button>
  </div>
</div>

<div class="mapwrap" id="mapWrap">
  <div class="map" id="map">
    <svg class="path" id="pathSvg" preserveAspectRatio="none"></svg>
    <div class="deco" id="deco"></div>
    <div id="nodes"></div>
  </div>
</div>

<div class="mask" id="mask">
  <div class="sheet" id="sheet"></div>
</div>

<div class="cover" id="cover">
  <div class="box">
    <div id="coverArt" style="display:flex;justify-content:center;align-items:flex-end;gap:4px"></div>
    <h1>故事屋</h1>
    <p>图书馆的角落里有一间小屋，<br>里面有会说话的书。</p>
    <button class="go btn primary" id="goBtn">推门进去</button>
    <div class="small" style="margin-top:12px;font-size:11.5px;color:#9a9282">点「推门进去」后会有轻轻的声音</div>
  </div>
</div>

<script src="ui.js"></script>
<script src="room.js"></script>
<script>
var S = Room.load();
S.books = S.books || { cleared:{}, times:{}, trophies:{} };
S.books.cleared = S.books.cleared || {};
S.books.times = S.books.times || {};
S.books.trophies = S.books.trophies || {};   /* 每 5 关一个奖杯：{5:true, 10:true...} */

/* ------------------------------------------------------------------
   额外的图形：room.js 里没有的，这里补
   ------------------------------------------------------------------ */
var MORE = {
  /* 象形字：山 */

/* ---------------- 图书馆氛围装饰：书架 / 绿植 / 台灯 / 阅读角 ----------------
   只做背景，pointer-events 关掉，不挡点关卡；位置跟着关卡节点走。 */
var DECO_COLS = ["#d98b6c","#e0a234","#7fa8c9","#8fbf7f","#b48ac9","#d97b7b","#c9a86a"];
/* 四层书架，70×120：一关一个高度，摆起来像两面连续的墙 */
function shelfSVG(seed){
  function row(bottom){
    var s = "", x = 8;
    for (var k = 0; k < 6; k++){
      var w = 5 + ((seed + k) % 3);
      var h = 17 + ((seed * 3 + k * 4) % 6);
      s += '<rect x="' + x + '" y="' + (bottom - h) + '" width="' + w + '" height="' + h + '" rx="1" fill="' + DECO_COLS[(seed + k) % DECO_COLS.length] + '"/>';
      x += w + 1.4;
    }
    return s;

var GAP = 136, PAD_TOP = 176, PAD_BOT = 186;
var NODE_POS = [];

function computePos(){
  NODE_POS = [];
  var h = PAD_TOP + (TOTAL - 1) * GAP + PAD_BOT;
  for (var i = 0; i < TOTAL; i++){
    var y = h - PAD_BOT - i * GAP;
    var x = 50 + 24 * Math.sin(i * 1.15 + 0.4);
    NODE_POS.push({ x: x, y: y });
  }
  return h;
}

function buildMap(){
  var map = document.getElementById("map");
  var h = computePos();
  map.style.height = h + "px";
  paintDeco();

  var svg = document.getElementById("pathSvg");
  svg.setAttribute("viewBox", "0 0 1000 " + h);
  svg.setAttribute("width", "100%");
  svg.setAttribute("height", h);
  var d = "";
  for (var i = 0; i < NODE_POS.length; i++){
    var p = NODE_POS[i], px = p.x * 10, py = p.y;
    if (i === 0) d += "M" + px + "," + py;
    else {
      var q = NODE_POS[i - 1], qx = q.x * 10, qy = q.y;
      var mx = (qx + px) / 2, my = (qy + py) / 2;
      d += " Q" + qx + "," + qy + " " + mx + "," + my;
      d += " Q" + px + "," + py + " " + px + "," + py;
    }
  }
  svg.innerHTML =
    '<path d="' + d + '" fill="none" stroke="#e8dfc9" stroke-width="20" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".85"/>' +
    '<path d="' + d + '" fill="none" stroke="#fffdf7" stroke-width="11" stroke-linecap="round" stroke-dasharray="1 26" vector-effect="non-scaling-stroke"/>';

  var box = document.getElementById("nodes");
  box.innerHTML = "";
  LEVELS.forEach(function(L, i){
    var p = NODE_POS[i];
    var st = clearedN(L.n) ? "done" : (openN(L.n) ? (L.n === firstOpen() ? "now" : "open") : "lock");
    var b = document.createElement("button");
    b.className = "node " + st;
    b.style.left = p.x + "%";
    b.style.top = p.y + "px";
    b.dataset.n = L.n;
    var inner = clearedN(L.n)
      ? '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 L9.5 18 L20 6.5"/></svg>'
      : '<span class="num">' + L.n + '</span>' +
        (openN(L.n) ? '' : '<svg class="lockico" viewBox="0 0 24 24" fill="none" stroke="#b3ab9b" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2.6"/><path d="M8.4 11 V8.4 a3.6 3.6 0 0 1 7.2 0 V11"/></svg>');
    var cupTag = "";
    if (CUP_AT(L.n)){
      var on = cupN(L.n);
      cupTag = '<span class="cup' + (on ? ' on' : '') + '">' + trophySVG(17, on ? "#e9a52e" : "#b3a894") + '</span>';
    }
    b.innerHTML = inner + '<span class="cap">' + L.name + '</span>' +
      (clearedN(L.n) ? '<span class="badge">★</span>' : '') + cupTag;
    b.addEventListener("click", function(){ tapLevel(L, b); });
    box.appendChild(b);
  });

  var old = document.querySelector(".peak"); if (old) old.remove();
  var peak = document.createElement("div");
  peak.className = "peak";
  peak.style.top = "44px";
  var done = progressN();

    (done >= TOTAL ? "二十个故事都读完啦" : "已经读完 " + done + " 个故事") +
    '</b><span>' +
    (done >= TOTAL ? "这本书合上了，字还留在你心里" : "往下走，还有新的故事 · 奖杯 " + cupsN() + " / 4") +
    '</span></div>';

  setTimeout(function(){
    var wrap = document.getElementById("mapWrap");
    var cur = document.querySelector(".node.now") || document.querySelector(".node.done:last-of-type");
    var target = cur ? (cur.offsetTop - window.innerHeight * 0.55) : 0;
    wrap.scrollTop = Math.max(0, target);
  }, 60);
}

/* ------------------------------------------------------------------
   拖拽工具
   ------------------------------------------------------------------ */
function makeDraggable(tile, onDrop, onTap){
  var sx = 0, sy = 0, dragging = false, ghost = null, moved = false;

  tile.addEventListener("pointerdown", function(e){
    if (tile.classList.contains("ok")) return;
    e.preventDefault();
    sx = e.clientX; sy = e.clientY; dragging = true; moved = false;
    try { tile.setPointerCapture(e.pointerId); } catch(err){}
  });

  tile.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (!moved && Math.abs(dx) + Math.abs(dy) < 6) return;
    if (!moved){
      moved = true;
      var r = tile.getBoundingClientRect();
      ghost = tile.cloneNode(true);
      ghost.classList.add("drag");
      ghost.style.width = r.width + "px";
      ghost.style.height = r.height + "px";
      ghost.style.left = (e.clientX - r.width / 2) + "px";
      ghost.style.top = (e.clientY - r.height / 2) + "px";
      document.body.appendChild(ghost);
      tile.style.opacity = ".32";
    }
    if (ghost){
      ghost.style.left = (e.clientX - ghost.offsetWidth / 2) + "px";
      ghost.style.top = (e.clientY - ghost.offsetHeight / 2) + "px";
    }
    highlightUnder(e.clientX, e.clientY);
  });

  function end(e){
    if (!dragging) return;
    dragging = false;
    tile.style.opacity = "";
    if (ghost){ ghost.remove(); ghost = null; }
    document.querySelectorAll(".drop.hot").forEach(function(d){ d.classList.remove("hot"); });
    if (!moved){ if (onTap) onTap(); return; }
    var target = dropUnder(e.clientX, e.clientY);
    if (onDrop) onDrop(target, tile, e.clientX, e.clientY);
  }
  tile.addEventListener("pointerup", end);
  tile.addEventListener("pointercancel", function(){
    dragging = false; tile.style.opacity = "";
    if (ghost){ ghost.remove(); ghost = null; }
    document.querySelectorAll(".drop.hot").forEach(function(d){ d.classList.remove("hot"); });
  });
}
function dropUnder(x, y){
  var el = document.elementFromPoint(x, y);
  while (el && !(el.classList && el.classList.contains("drop"))) el = el.parentNode;
  return el;
}
function highlightUnder(x, y){
  document.querySelectorAll(".drop.hot").forEach(function(d){ d.classList.remove("hot"); });
  var d = dropUnder(x, y);
  if (d) d.classList.add("hot");
}
function nearRect(el, x, y, pad){
  var r = el.getBoundingClientRect();
  pad = pad || 26;
  return x > r.left - pad && x < r.right + pad && y > r.top - pad && y < r.bottom + pad;
}

var RENDER = {};

/* ---- 1. 故事排排队：种子 → 发芽 → 开花 ---- */
RENDER.storyOrder = function(stage, L, win){
  /* 两组「从小到大」轮着出：花和树。故事结构一样，换一套图形，
     孩子第二次玩会有新鲜感，但难度没变。 */
  var SETS = [
    [ { id:"seedbag", word:"先种下种子" },
      { id:"sprout",  word:"再发出小芽" },
      { id:"flower",  word:"最后开花了" } ],
    [ { id:"sprout",    word:"先是一棵小苗" },
      { id:"treeShort", word:"再长高一点" },
      { id:"treeTall",  word:"最后长成大树" } ]
  ];
  var steps = SETS[Math.floor(Math.random() * SETS.length)];
  var html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px">';
  steps.forEach(function(s, i){
    html += '<div class="drop so" data-i="' + i + '" style="min-height:118px">' +
      '<span class="dl">第 ' + (i + 1) + ' 步</span>' +
      '<span style="font-size:11.5px;color:#b0a794;margin-top:2px">' + s.word + '</span></div>';
  });
  html += '</div><div class="tray" id="soTray">';
  steps.slice().sort(function(){ return Math.random() - .5; }).forEach(function(s){
    html += '<div class="tile so2" data-id="' + s.id + '" style="width:76px;height:76px">' + gart(s.id, 56) + '</div>';
  });
  html += '</div>';
  stage.innerHTML = html;
  say(steps[0].word + "，" + steps[1].word + "，" + steps[2].word + "。按这个顺序摆好。", { who:"teacher" });

  var left = 3;
  stage.querySelectorAll(".so2").forEach(function(tile){
    makeDraggable(tile, function(target){
      if (!target) return;
      var i = +target.dataset.i;
      if (steps[i].id === tile.dataset.id){
        tile.remove();
        target.classList.add("full");
        target.innerHTML = gart(tile.dataset.id, 56) +
          '<span class="dl">第 ' + (i + 1) + ' 步</span>';
        Room.Sound.blip("ok");
        left--;
        if (left === 0){
          say("从小到大的顺序，排对啦。", { who:"teacher" });
          setTimeout(win, 520);
        } else {
          say(steps[i].word + "。", { who:"teacher" });
        }
      } else {
        tile.classList.add("bad");
        setTimeout(function(){ tile.classList.remove("bad"); }, 360);
        Room.Sound.blip("soft");
        say("这一步不对哦，谁在最前面呢？", { who:"teacher" });
      }
    }, function(){
      tile.classList.add("sel");
      setTimeout(function(){ tile.classList.remove("sel"); }, 300);
    });
  });
};

/* =====================================================================
   7-20：认图识字
   ---------------------------------------------------------------------
   3-4 岁的识字路：先认图（这是苹果），再认字（这个字念苹果），
   然后量词、方位、句子，最后认识偏旁（三点水、木字旁）。
   每一关都配语音——不识字的孩子也能玩下去。
   ===================================================================== */

function hz(t, size){
  return '<span class="hz" style="font-size:' + (size || 40) + 'px">' + t + '</span>';
}
/* 位置示意图：一个箱子 + 一个红点，红点在箱上 / 箱下 / 箱里
   第 13 关的选项配这张图，不认字也能选。 */
function posSVG(where){
  var box = '<rect x="9" y="16" width="22" height="16" rx="3" fill="#f1e6cf" stroke="#c9b58c" stroke-width="2"/>';
  var dot = '<circle cx="20" cy="24" r="4.6" fill="#e4705f"/>';
  var body = where === "up" ? '<circle cx="20" cy="8" r="5.2" fill="#e4705f"/>' + box
           : where === "down" ? box + '<circle cx="20" cy="37" r="5.2" fill="#e4705f"/>'
           : box + dot;
  return '<svg width="46" height="46" viewBox="0 0 40 42" aria-hidden="true">' + body + '</svg>';
}
/* 动作小图：飞 / 游 / 跳 / 捉老鼠。
   一张小场景 = 底色 + 谁在动 + 动的痕迹，不认字也看得出。 */

function optInner(o){
  if (o.svg) return '<span class="oi">' + o.svg + '</span>' +
                    (o.t ? '<span class="ol">' + o.t + '</span>' : '');
  if (o.ico) return '<span class="oi">' + gart(o.ico, 46) + '</span>' +
                    (o.t ? '<span class="ol">' + o.t + '</span>' : '');
  if (o.hz)  return '<span class="ol">' + hz(o.hz, 34) + '</span>';
  return '<span class="ol big">' + (o.t || "") + '</span>';
}

/* 一道选择题：题干 + 再听一遍 + 若干选项。
   点错不扣分，只把提示说一遍；点对了交给 done()。 */
function runQuestion(host, q, done){
  var html = '<div class="qhead">' + (q.head || "") + '</div>';
  html += '<div style="display:flex;justify-content:center;margin:10px 0 2px">' +
            '<button class="replay qagain">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M4 9 A8 8 0 1 1 4 15"/><path d="M4 4 L4 9 L9 9"/></svg>' +
              '再听一遍</button></div>';
  html += '<div class="opts qopts">';
  q.opts.forEach(function(o, i){
    html += '<button class="opt qo" data-i="' + i + '">' + optInner(o) + '</button>';
  });
  html += '</div>';
  host.innerHTML = html;

  function speak(){
    try { Room.Voice.say(q.read || "", { who: "teacher", force: true }); } catch(e){}
  }
  setTimeout(speak, 320);
  lvSay(q.hide ? "听清楚了就点一张。" : (q.read || ""));
  host.querySelector(".qagain").onclick = function(){ Room.Sound.blip("tap"); speak(); };

  var solved = false;
  host.querySelectorAll(".qo").forEach(function(b){
    b.addEventListener("click", function(){
      if (solved) return;
      var o = q.opts[+b.dataset.i];
      if (o.ok){
        solved = true;
        b.classList.add("ok");
        Room.Sound.blip("ok");
        try { Room.Voice.say(o.say || o.t || "", { who: "teacher", force: true }); } catch(e){}
        lvSay(q.done || ("对啦，" + (o.t || "") + "。"));
        setTimeout(done, 760);
      } else {
        b.classList.add("bad");
        setTimeout(function(){ b.classList.remove("bad"); }, 360);
        Room.Sound.blip("soft");
        lvSay(q.hint || "再看看，不是这个。");
        var sayWrong = (o.t ? "这是" + o.t + "。" : "") + (q.hint || "再看看。");
        try { Room.Voice.say(sayWrong, { who: "teacher", force: true }); } catch(e){}
      }
    });
  });
}

  var all = [
    { glyph:"glyphHuo",  word:"火" },

    { glyph:"glyphTian", word:"田" },
    { glyph:"glyphYu",   word:"雨" }
  ];
  var items = all.slice().sort(function(){ return Math.random() - .5; }).slice(0, 3);

  var html = '<p style="text-align:center;color:#8a8272;font-size:12.5px;margin:0 0 12px">' +
    '古时候的字，画的就是那个东西</p>' +
    '<div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:16px">';
  items.forEach(function(it, i){
    html += '<div class="drop cg" data-i="' + i + '" style="width:104px;min-height:118px;background:#fbf8ee">' +
      hz(it.word, 46) + '<span class="dl">这个字</span></div>';
  });
  html += '</div><div class="tray">';
  items.slice().sort(function(){ return Math.random() - .5; }).forEach(function(it){
    html += '<div class="tile cg2" data-word="' + it.word + '" style="width:76px;height:76px">' +
      gart(it.glyph, 54) + '</div>';
  });
  html += '</div>';
  stage.innerHTML = html;
  say("这些是古时候的字。哪一个画的是这个字？把它拖过去。", { who: "teacher" });

  var left = 3;
  stage.querySelectorAll(".cg2").forEach(function(tile){
    makeDraggable(tile, function(target){
      if (!target) return;
      var i = +target.dataset.i;
      if (target.classList.contains("full")) return;
      if (items[i].word === tile.dataset.word){
        tile.remove();
        target.classList.add("full");
        target.innerHTML = gart(items[i].glyph, 50) +
          '<span class="dl" style="font-size:15px;color:#3f7a55">' + items[i].word + '</span>';
        Room.Sound.blip("ok");
        left--;
        if (left === 0){
          say(items.map(function(x){ return x.word; }).join("、") + "，古时候的字你都认出来了。", { who: "teacher" });
          setTimeout(win, 560);
        } else {
          say("对，这就是" + items[i].word + "。", { who: "teacher" });
        }
      } else {
        tile.classList.add("bad");
        setTimeout(function(){ tile.classList.remove("bad"); }, 360);
        Room.Sound.blip("soft");
        say("再看看，这个字哪里尖、哪里弯？", { who: "teacher" });
      }
    }, function(){
      tile.classList.add("sel");
      setTimeout(function(){ tile.classList.remove("sel"); }, 300);
    });
  });
};

/* ---- 13. 谁在哪里 ---- */
function sceneWhere(where){
  /* 猫高 56：
     上面 —— 箱子盖着，猫坐在箱盖上，整只都看得见；
     里面 —— 箱子打开，猫站在里面，箱体前壁挡住下半身；
     下面 —— 箱子盖着，猫蹲在箱子前面。
     三种情况一眼就能分开，不会「上面」和「里面」长得一样。 */
  var open = (where === "inside");
  var top  = { up: "44px", inside: "86px", down: "154px" }[where];
  var z    = open ? 2 : 4;
  return '<div class="scene">' +
    '<div class="box back">' + (open ? '<i class="inner"></i><i class="flap l"></i><i class="flap r"></i>' : '<i class="lid"></i>') + '</div>' +
    '<div class="kit" style="left:115px;top:' + top + ';z-index:' + z + '">' + gart("cat", 56) + '</div>' +
    '<div class="box front"></div>' +
  '</div>';
}

/* ---- 16-18. 点出一类字 ---- */
RENDER.pickAll = function(stage, L, win){
  var k = pickFrom(L.data.pool);
  var need = k.chars.filter(function(c){ return c.ok; }).length;

  var html = '<div class="qhead"><div class="qline">' + k.ask + '</div>' +
    '<div class="qhint">' + k.sub + '</div></div><div class="opts qopts">';
  k.chars.forEach(function(c, i){
    html += '<button class="opt qo" data-i="' + i + '" style="min-width:86px">' + hz(c.t, 36) + '</button>';
  });
  html += '</div>';
  stage.innerHTML = html;
  lvSay(k.ask);
  try { Room.Voice.say(k.read || k.ask, { who: "teacher" }); } catch(e){}

  var got = 0;
  stage.querySelectorAll(".qo").forEach(function(b){
    b.addEventListener("click", function(){
      if (b.classList.contains("ok")) return;
      var c = k.chars[+b.dataset.i];
      if (c.ok){
        b.classList.add("ok");
        b.innerHTML = hz(c.t, 36) +
          '<span style="font-size:11.5px;color:#3f7a55;font-weight:800;margin-top:2px">找到了</span>';
        Room.Sound.blip("ok");
        got++;
        try { Room.Voice.say(c.t, { who: "teacher" }); } catch(e){}
        if (got === need){
          lvSay(k.done || "都找出来啦。");
          say(k.done || "都找出来啦。", { who: "teacher" });
          setTimeout(win, 640);
        } else {
          lvSay("对，" + c.t + "。还有 " + (need - got) + " 个。");
        }
      } else {
        b.classList.add("bad");
        setTimeout(function(){ b.classList.remove("bad"); }, 360);
        Room.Sound.blip("soft");
        lvSay("这个字不一样，再看看它的样子。");
        try { Room.Voice.say("这个字不一样，再看看。", { who: "teacher", force: true }); } catch(e){}
      }
    });
  });
};
